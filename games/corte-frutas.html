<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1a"><title>Corte de Frutas · Jogos do Jhon · v1.2</title><style>
:root{color-scheme:dark;--bg:#080d1a;--panel:#111c30;--line:#263750;--txt:#edf5ff;--muted:#9fb0c8;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(900px 450px at 12% -10%,#12334a 0,transparent 65%),radial-gradient(750px 430px at 100% 0,#291a4b 0,transparent 65%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}.wrap{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:11px}.brand .emoji{font-size:34px}.brand h1{font-size:clamp(20px,4vw,30px);margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.ver{display:inline-block;color:#9fb0c8;font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:99px;margin-top:6px}.back{color:#a5f3fc;text-decoration:none;border:1px solid #276078;background:#0b2635;padding:10px 13px;border-radius:11px;font-weight:700;font-size:13px}.panel{background:linear-gradient(145deg,#142139,#0d1729);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 40px #0004}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}.stat{background:#091321;border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:88px;text-align:center}.stat b{display:block;font-size:18px}.stat small{display:block;color:var(--muted);font-size:10px}.btn,select{border:1px solid #35506d;background:#172944;color:#eff8ff;border-radius:10px;padding:10px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#087e98,#5b3bab);border-color:#4b9ab0}.btn:active{transform:scale(.98)}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto 2px;max-width:700px}.game{display:flex;align-items:center;justify-content:center;min-height:260px;overflow:hidden}canvas{display:block;max-width:100%;border-radius:12px;background:#07111e;touch-action:none}.message{text-align:center;color:#a5f3fc;font-weight:800;min-height:25px;margin:8px 0}canvas{width:min(100%,600px);height:auto;aspect-ratio:600/390;background:radial-gradient(ellipse at 50% 100%,#15364a,#071322 70%);border:1px solid #4b8791;box-shadow:inset 0 0 35px #22d3ee18,0 18px 38px #0009;touch-action:none;cursor:crosshair}
@media(max-width:560px){body{padding:10px}.panel{padding:10px}.back{padding:8px 10px}.stat{min-width:72px;padding:7px}.stat b{font-size:16px}}.panel{background:radial-gradient(ellipse at 50% 0%,#17404a,#0d182b 78%);border-color:#28616a}.game canvas{box-shadow:inset 0 0 25px #34d39915,0 12px 28px #0008}.stat{background:linear-gradient(145deg,#10283a,#081522);border-color:#2a5360}</style></head><body><main class="wrap"><header><div class="brand"><span class="emoji">🍉</span><div><h1>Corte de Frutas</h1><p>Corte frutas, faça combos e fuja das bombas.</p><span class="ver">Jogos do Jhon · v1.2</span></div></div><a class="back" href="../index.html">← Catálogo</a></header><section class="panel"><div class="toolbar"><div class="stat"><b id="score">0</b><small>PONTOS</small></div><div class="stat"><b id="time">60</b><small>SEGUNDOS</small></div><div class="stat"><b id="best">0</b><small>RECORDE</small></div><button class="btn primary" id="start">▶ Começar</button></div><div class="game"><canvas id="c" width="600" height="390"></canvas></div><p class="message" id="msg">Arraste o dedo ou mouse sobre as frutas para cortar!</p><p class="note">Cada fruta vale pontos. Acerte várias em sequência para ganhar bônus. Não corte as bombas! O jogo dura 60 segundos.</p></section></main><script>(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),msg=document.getElementById('msg');let items=[],particles=[],trail=[],score=0,time=60,playing=false,last=0,spawn=0,slash=false,prev=null,raf=0,best=Number(localStorage.getItem('fruitBest')||0);document.getElementById('best').textContent=best;
function start(){items=[];particles=[];trail=[];score=0;time=60;playing=true;last=performance.now();spawn=0;document.getElementById('score').textContent=0;document.getElementById('time').textContent=60;msg.textContent='Corte as frutas!';cancelAnimationFrame(raf);loop(last)}
function add(){let bomb=Math.random()<.18;items.push({x:45+Math.random()*510,y:405,vx:(Math.random()-.5)*2.7,vy:-7-Math.random()*4,r:bomb?19:17+Math.random()*5,bomb,emoji:bomb?'💣':['🍉','🍊','🍓','🍍','🍎','🥝'][Math.floor(Math.random()*6)],cut:false,rot:(Math.random()-.5)*.65,spin:(Math.random()-.5)*2.6})}
function drawFruit(a){
 ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot||0);ctx.scale(a.r/22,a.r/22);
 ctx.shadowColor=a.bomb?'#fb7185':'#000';ctx.shadowBlur=13;ctx.shadowOffsetY=5;
 if(a.bomb){
  const g=ctx.createRadialGradient(-7,-9,2,2,3,23);g.addColorStop(0,'#64748b');g.addColorStop(.4,'#263548');g.addColorStop(1,'#080d18');
  ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,1,13,-.8,2.3);ctx.stroke();
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(5,-14);ctx.quadraticCurveTo(15,-23,11,-28);ctx.stroke();
  ctx.fillStyle='#fb7185';ctx.beginPath();ctx.arc(11,-29,3.5,0,Math.PI*2);ctx.fill();
  ctx.shadowColor='#fbbf24';ctx.shadowBlur=12;ctx.strokeStyle='#fde68a';ctx.lineWidth=1.6;
  for(let k=0;k<4;k++){let an=k*Math.PI/2;ctx.beginPath();ctx.moveTo(11+Math.cos(an)*5,-29+Math.sin(an)*5);ctx.lineTo(11+Math.cos(an)*9,-29+Math.sin(an)*9);ctx.stroke()}
  ctx.shadowBlur=0;ctx.fillStyle='#e2e8f0';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,2);
 }else{
  let colors=a.emoji==='🍎'?['#ff9a9a','#ef3348','#8f102d']:a.emoji==='🍊'?['#fff0a6','#ffb52e','#a93d12']:a.emoji==='🍓'?['#ff9baf','#f43f5e','#9f1239']:a.emoji==='🍍'?['#fff09a','#facc15','#a16207']:a.emoji==='🥝'?['#d9f99d','#65a30d','#6b442b']:['#ff9aa8','#f43f5e','#166534'];
  const g=ctx.createLinearGradient(-15,-18,15,20);g.addColorStop(0,colors[0]);g.addColorStop(.48,colors[1]);g.addColorStop(1,colors[2]);
  if(a.emoji==='🍊'||a.emoji==='🥝'){
   ctx.beginPath();ctx.ellipse(0,0,a.emoji==='🥝'?19:17,a.emoji==='🥝'?16:17,.1,0,Math.PI*2);ctx.fillStyle=a.emoji==='🥝'?'#8b5e3c':g;ctx.fill();ctx.strokeStyle=a.emoji==='🥝'?'#d6a477':'#a84b15';ctx.lineWidth=2;ctx.stroke();
   ctx.beginPath();ctx.ellipse(0,0,a.emoji==='🥝'?15:14,a.emoji==='🥝'?12:14,.1,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
   ctx.fillStyle=a.emoji==='🥝'?'#fef3c7':'#ffffff77';ctx.beginPath();ctx.ellipse(-6,-7,3,6,-.5,0,Math.PI*2);ctx.fill();
   if(a.emoji==='🥝'){ctx.fillStyle='#17210e';for(let k=0;k<10;k++){let an=k*Math.PI*2/10;ctx.beginPath();ctx.ellipse(Math.cos(an)*9,Math.sin(an)*7,1,2,an,0,Math.PI*2);ctx.fill()}}
   else{ctx.fillStyle='#ffd166';for(let k=0;k<16;k++){let an=k*2.4,rr=5+(k%4)*2.5;ctx.beginPath();ctx.arc(Math.cos(an)*rr,Math.sin(an)*rr,.65,0,Math.PI*2);ctx.fill()}}
  }else if(a.emoji==='🍍'){
   ctx.beginPath();ctx.ellipse(0,2,13,18,.05,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#a16207';ctx.lineWidth=1.5;ctx.stroke();ctx.shadowBlur=0;
   ctx.save();ctx.clip();ctx.strokeStyle='#9a5b16';ctx.lineWidth=1.2;for(let v=-26;v<=26;v+=8){ctx.beginPath();ctx.moveTo(-18,v);ctx.lineTo(18,v+18);ctx.moveTo(-18,v+18);ctx.lineTo(18,v);ctx.stroke()}ctx.restore();
   ctx.fillStyle='#22c55e';for(let k=0;k<5;k++){let x=(k-2)*5;ctx.beginPath();ctx.moveTo(0,-12);ctx.quadraticCurveTo(x-5,-23,x,-27+Math.abs(k-2)*2);ctx.quadraticCurveTo(x+4,-19,0,-12);ctx.fill()}
  }else if(a.emoji==='🍓'){
   ctx.beginPath();ctx.moveTo(-14,-9);ctx.bezierCurveTo(-16,-20,1,-20,0,-12);ctx.bezierCurveTo(13,-20,18,-9,12,3);ctx.quadraticCurveTo(6,15,0,20);ctx.quadraticCurveTo(-8,12,-14,-9);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#881337';ctx.lineWidth=1.2;ctx.stroke();ctx.shadowBlur=0;
   ctx.fillStyle='#4ade80';ctx.beginPath();ctx.moveTo(-14,-12);ctx.lineTo(-7,-17);ctx.lineTo(-3,-11);ctx.lineTo(1,-19);ctx.lineTo(5,-11);ctx.lineTo(13,-14);ctx.lineTo(8,-6);ctx.lineTo(-8,-5);ctx.fill();
   ctx.fillStyle='#ffe9a8';for(let y=-5;y<15;y+=5)for(let x=-8;x<10;x+=7){ctx.beginPath();ctx.ellipse(x,y,1,2,-.3,0,Math.PI*2);ctx.fill()}
  }else if(a.emoji==='🍎'){
   ctx.beginPath();ctx.moveTo(0,-12);ctx.bezierCurveTo(-7,-19,-20,-12,-18,1);ctx.bezierCurveTo(-16,15,-6,20,0,15);ctx.bezierCurveTo(7,20,17,13,18,1);ctx.bezierCurveTo(20,-12,7,-19,0,-12);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#7f1d1d';ctx.lineWidth=1.3;ctx.stroke();ctx.shadowBlur=0;
   ctx.strokeStyle='#6b3f25';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-13);ctx.lineTo(2,-21);ctx.stroke();ctx.fillStyle='#4ade80';ctx.beginPath();ctx.ellipse(8,-18,7,3.5,-.45,0,Math.PI*2);ctx.fill();
  }else{
   ctx.beginPath();ctx.moveTo(-19,-7);ctx.quadraticCurveTo(0,-28,19,-7);ctx.lineTo(14,10);ctx.quadraticCurveTo(0,21,-14,10);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#166534';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#86efac';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-16,8);ctx.quadraticCurveTo(0,20,16,8);ctx.stroke();ctx.shadowBlur=0;
   ctx.fillStyle='#172554';[[-9,-7],[-2,-14],[7,-11],[11,-2],[1,0],[-7,2]].forEach(p=>{ctx.beginPath();ctx.ellipse(p[0],p[1],1.3,2.2,.25,0,Math.PI*2);ctx.fill()});
  }
  ctx.shadowBlur=0;ctx.fillStyle='#ffffff88';ctx.beginPath();ctx.ellipse(-8,-7,2.5,5,-.4,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}
function burst(a){
 const colors=a.bomb?['#fb7185','#f97316','#fbbf24','#e2e8f0']:['#67e8f9','#fda4af','#fef08a','#86efac','#c4b5fd'];
 for(let k=0;k<(a.bomb?22:13);k++){let an=Math.random()*Math.PI*2,sp=1.2+Math.random()*(a.bomb?4.2:3.1);particles.push({x:a.x,y:a.y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-1,life:.35+Math.random()*.35,size:2+Math.random()*3,color:colors[Math.floor(Math.random()*colors.length)]})}
}
function draw(){
 ctx.clearRect(0,0,600,390);
 let bg=ctx.createLinearGradient(0,0,0,390);bg.addColorStop(0,'#07172d');bg.addColorStop(.48,'#0b3542');bg.addColorStop(1,'#061321');ctx.fillStyle=bg;ctx.fillRect(0,0,600,390);
 let glow=ctx.createRadialGradient(300,360,5,300,360,310);glow.addColorStop(0,'#22d3ee22');glow.addColorStop(1,'#22d3ee00');ctx.fillStyle=glow;ctx.fillRect(0,0,600,390);
 ctx.save();ctx.strokeStyle='#a5f3fc0b';ctx.lineWidth=1;for(let y=28;y<390;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(600,y);ctx.stroke()}for(let x=24;x<600;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,390);ctx.stroke()}ctx.restore();
 items.forEach(a=>{if(!a.cut)drawFruit(a)});
 particles.forEach(p=>{ctx.save();ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore()});
 if(slash&&trail.length>1){ctx.save();ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<trail.length;i++){let alpha=i/trail.length;ctx.globalAlpha=alpha;ctx.strokeStyle=i>trail.length-3?'#fff':'#67e8f9';ctx.lineWidth=2+alpha*5;ctx.shadowColor='#67e8f9';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke()}ctx.restore()}
}
function cutAt(px,py){if(!playing)return;for(let a of items){if(!a.cut&&Math.hypot(a.x-px,a.y-py)<a.r+15){a.cut=true;burst(a);if(a.bomb){score=Math.max(0,score-15);time=Math.max(0,time-5);msg.textContent='💥 Bomba! -15 pontos e -5 segundos.'}else{score+=10;msg.textContent='🍉 +10 pontos!'}}}document.getElementById('score').textContent=score}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*390}}c.addEventListener('pointerdown',e=>{slash=true;prev=point(e);trail=[{x:prev.x,y:prev.y}];cutAt(prev.x,prev.y)});c.addEventListener('pointermove',e=>{if(!slash)return;let p=point(e);for(let i=1;i<=5;i++)cutAt(prev.x+(p.x-prev.x)*i/5,prev.y+(p.y-prev.y)*i/5);trail.push({x:p.x,y:p.y});if(trail.length>10)trail.shift();prev=p});window.addEventListener('pointerup',()=>{slash=false;prev=null;trail=[]});
function loop(now){if(!playing)return;let dt=Math.min(.04,(now-last)/1000);last=now;time-=dt;spawn+=dt;if(spawn>.72){add();spawn=0}items.forEach(a=>{a.vy+=.18;a.x+=a.vx;a.y+=a.vy;a.rot+=(a.spin||0)*dt});particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=dt});particles=particles.filter(p=>p.life>0);items=items.filter(a=>a.y<430&&!a.cut);document.getElementById('time').textContent=Math.ceil(time);draw();if(time<=0){playing=false;best=Math.max(best,score);localStorage.setItem('fruitBest',best);document.getElementById('best').textContent=best;msg.textContent='⏱️ Tempo encerrado! Pontuação: '+score;return}raf=requestAnimationFrame(loop)}document.getElementById('start').onclick=start;draw();})();</script></body></html>
