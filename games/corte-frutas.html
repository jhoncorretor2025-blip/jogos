<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1a"><title>Corte de Frutas · Jogos do Jhon · v1.0</title><style>
:root{color-scheme:dark;--bg:#080d1a;--panel:#111c30;--line:#263750;--txt:#edf5ff;--muted:#9fb0c8;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(900px 450px at 12% -10%,#12334a 0,transparent 65%),radial-gradient(750px 430px at 100% 0,#291a4b 0,transparent 65%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}.wrap{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:11px}.brand .emoji{font-size:34px}.brand h1{font-size:clamp(20px,4vw,30px);margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.ver{display:inline-block;color:#9fb0c8;font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:99px;margin-top:6px}.back{color:#a5f3fc;text-decoration:none;border:1px solid #276078;background:#0b2635;padding:10px 13px;border-radius:11px;font-weight:700;font-size:13px}.panel{background:linear-gradient(145deg,#142139,#0d1729);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 40px #0004}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}.stat{background:#091321;border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:88px;text-align:center}.stat b{display:block;font-size:18px}.stat small{display:block;color:var(--muted);font-size:10px}.btn,select{border:1px solid #35506d;background:#172944;color:#eff8ff;border-radius:10px;padding:10px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#087e98,#5b3bab);border-color:#4b9ab0}.btn:active{transform:scale(.98)}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto 2px;max-width:700px}.game{display:flex;align-items:center;justify-content:center;min-height:260px;overflow:hidden}canvas{display:block;max-width:100%;border-radius:12px;background:#07111e;touch-action:none}.message{text-align:center;color:#a5f3fc;font-weight:800;min-height:25px;margin:8px 0}canvas{width:min(100%,600px);background:radial-gradient(ellipse at 50% 100%,#15364a,#071322 70%);border:1px solid #28506a;touch-action:none}
@media(max-width:560px){body{padding:10px}.panel{padding:10px}.back{padding:8px 10px}.stat{min-width:72px;padding:7px}.stat b{font-size:16px}}</style></head><body><main class="wrap"><header><div class="brand"><span class="emoji">🍉</span><div><h1>Corte de Frutas</h1><p>Corte frutas, faça combos e fuja das bombas.</p><span class="ver">Jogos do Jhon · v1.0</span></div></div><a class="back" href="../index.html">← Catálogo</a></header><section class="panel"><div class="toolbar"><div class="stat"><b id="score">0</b><small>PONTOS</small></div><div class="stat"><b id="time">60</b><small>SEGUNDOS</small></div><div class="stat"><b id="best">0</b><small>RECORDE</small></div><button class="btn primary" id="start">▶ Começar</button></div><div class="game"><canvas id="c" width="600" height="390"></canvas></div><p class="message" id="msg">Arraste o dedo ou mouse sobre as frutas para cortar!</p><p class="note">Cada fruta vale pontos. Acerte várias em sequência para ganhar bônus. Não corte as bombas! O jogo dura 60 segundos.</p></section></main><script>(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),msg=document.getElementById('msg');let items=[],score=0,time=60,playing=false,last=0,spawn=0,slash=false,prev=null,raf=0,best=Number(localStorage.getItem('fruitBest')||0);document.getElementById('best').textContent=best;
function start(){items=[];score=0;time=60;playing=true;last=performance.now();spawn=0;document.getElementById('score').textContent=0;document.getElementById('time').textContent=60;msg.textContent='Corte as frutas!';cancelAnimationFrame(raf);loop(last)}
function add(){let bomb=Math.random()<.18;items.push({x:45+Math.random()*510,y:405,vx:(Math.random()-.5)*2.7,vy:-7-Math.random()*4,r:bomb?19:17+Math.random()*5,bomb,emoji:bomb?'💣':['🍉','🍊','🍓','🍍','🍎','🥝'][Math.floor(Math.random()*6)],cut:false})}
function draw(){ctx.clearRect(0,0,600,390);ctx.fillStyle='#102b40';ctx.fillRect(0,0,600,390);for(let a of items){ctx.font=(a.r*2)+'px serif';ctx.textAlign='center';ctx.fillText(a.emoji,a.x,a.y+a.r*.7)}}
function cutAt(px,py){if(!playing)return;for(let a of items){if(!a.cut&&Math.hypot(a.x-px,a.y-py)<a.r+15){a.cut=true;if(a.bomb){score=Math.max(0,score-15);time=Math.max(0,time-5);msg.textContent='💥 Bomba! -15 pontos e -5 segundos.'}else{score+=10;msg.textContent='🍉 +10 pontos!'}}}document.getElementById('score').textContent=score}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*600,y:(e.clientY-r.top)/r.height*390}}c.addEventListener('pointerdown',e=>{slash=true;prev=point(e);cutAt(prev.x,prev.y)});c.addEventListener('pointermove',e=>{if(!slash)return;let p=point(e);for(let i=1;i<=5;i++)cutAt(prev.x+(p.x-prev.x)*i/5,prev.y+(p.y-prev.y)*i/5);prev=p});window.addEventListener('pointerup',()=>{slash=false;prev=null});
function loop(now){if(!playing)return;let dt=Math.min(.04,(now-last)/1000);last=now;time-=dt;spawn+=dt;if(spawn>.72){add();spawn=0}items.forEach(a=>{a.vy+=.18;a.x+=a.vx;a.y+=a.vy});items=items.filter(a=>a.y<430&&!a.cut);document.getElementById('time').textContent=Math.ceil(time);draw();if(time<=0){playing=false;best=Math.max(best,score);localStorage.setItem('fruitBest',best);document.getElementById('best').textContent=best;msg.textContent='⏱️ Tempo encerrado! Pontuação: '+score;return}raf=requestAnimationFrame(loop)}document.getElementById('start').onclick=start;draw();})();</script></body></html>
