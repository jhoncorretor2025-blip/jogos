</main><script>
(()=>{'use strict';

function saveBest(key,value){try{const old=Number(localStorage.getItem('jhon-'+key)||0);if(value>old)localStorage.setItem('jhon-'+key,value)}catch(e){}}

function start(){if(mode==='domino')domino();if(mode==='paciencia')paciencia();if(mode==='pinball')pinball();if(mode==='bolhas')bolhas();if(mode==='frogger')frogger();if(mode==='resta')resta()}
function domino(){
shellStats(stat('Pontos','score')+stat('Suas peças','mine')+stat('Peças da IA','ai'));
$('stage').innerHTML='<div class="ends"><span id="leftEnd">Ponta esquerda: —</span><span id="rightEnd">Ponta direita: —</span></div><div class="domboard" id="domboard">O tabuleiro começa aqui</div><h3 style="font-size:15px;margin:14px 0 3px">Sua mão</h3><div class="hand" id="hand"></div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+btn('draw','Comprar peça')+btn('pass','Passar')+'</div>';
buttons(btn('new','🔄 Nova partida','btn primary'));let deck=[],hand=[],ai=[],board=[],score=0,blocked=0,locked=false;

 const list=readAchievements();if(list.includes(id))return;list.push(id);try{localStorage.setItem(ACH_KEY,JSON.stringify(list))}catch(e){}

}
function checkAchievements(){if(level>1)unlockAchievement('first');if(bestCombo>=5)unlockAchievement('combo5');if(level>=5)unlockAchievement('level5');if(totalPopped>=100)unlockAchievement('pop100');if(shots>=10&&clears/shots>=.8)unlockAchievement('accuracy80')}
function showAchievements(){const list=readAchievements();$('achievementList').innerHTML=ACHIEVEMENTS.map(a=>'<div class="achievement '+(list.includes(a.id)?'':'locked')+'"><b>'+(list.includes(a.id)?'🏆':'🔒')+' '+a.name+'</b><br><small>'+a.desc+'</small></div>').join('');$('bubbleAchievements').hidden=false}
function showTutorial(){$('bubbleTutorial').hidden=false}
function closeTutorial(){$('bubbleTutorial').hidden=true;try{localStorage.setItem('jhon-bolhas-tutorial','1')}catch(e){}}
function saveGame(){
 try{if(gameOver){localStorage.removeItem(SAVE_KEY);return}
 const d={v:1,difficulty,grid:grid.map(row=>row.map(b=>b?b.color:null)),angle,shot:shot?{x:shot.x,y:shot.y,vx:shot.vx,vy:shot.vy,color:shot.color,r:shot.r,wild:shot.wild,mode:shot.mode}:null,score,level,shots,clears,combo,bestCombo,bombs,rainbows,special,loadedColor,queueColor,swappedThisTurn,lives,totalPopped};
 localStorage.setItem(SAVE_KEY,JSON.stringify(d));
 }catch(e){}
}
function loadGame(){
 try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d||d.v!==1||!Array.isArray(d.grid)||d.grid.length!==14)return false;
 difficulty=MODES[d.difficulty]?d.difficulty:'normal';palette=COLORS.slice(0,MODES[difficulty].palette);grid=d.grid.map((row,r)=>Array.from({length:9},(_,c)=>row[c]?{x:cellX(c,r),y:cellY(r),color:row[c]}:null));
 angle=Number(d.angle)||-Math.PI/2;shot=d.shot?{...d.shot}:null;score=Number(d.score)||0;level=Math.max(1,Number(d.level)||1);shots=Number(d.shots)||0;clears=Number(d.clears)||0;combo=Number(d.combo)||0;bestCombo=Math.max(bestCombo,Number(d.bestCombo)||0);bombs=Math.max(0,Number(d.bombs)||0);rainbows=Math.max(0,Number(d.rainbows)||0);special=d.special||null;loadedColor=d.loadedColor||randColor();queueColor=d.queueColor||randColor();swappedThisTurn=!!d.swappedThisTurn;lives=Math.max(0,Math.min(5,Number(d.lives)||3));totalPopped=Math.max(0,Number(d.totalPopped)||0);paused=false;gameOver=false;effects=[];
 $('bubbleDifficulty').value=difficulty;render();setMsg('💾 Sua partida anterior foi recuperada. Continue de onde parou!');if(shot){lastFrame=0;rafId=requestAnimationFrame(animate)}return true;
 }catch(e){return false}
}
function fresh(){

 try{localStorage.removeItem(SAVE_KEY)}catch(e){}effects=[];level=1;score=0;shots=0;clears=0;combo=0;bestCombo=Math.max(bestCombo,best('bolhas_combo'));bombs=1;rainbows=1;special=null;paused=false;gameOver=false;shot=null;lastFrame=0;swappedThisTurn=false;lives=3;totalPopped=0;
 const mode=MODES[difficulty];palette=COLORS.slice(0,mode.palette);makeField(mode.rows);loadedColor=randColor();queueColor=randColor();render();setMsg('Nível 1 · Combine três ou mais bolhas. Você tem três vidas, uma bomba e um coringa!');saveGame();
}
function spawnPopEffects(points,label='POP!'){
 if(!points||!points.length)return;
 const now=performance.now();
 points.forEach((p,index)=>{
  const color=p.color||'#67e8f0',count=12;
  const particles=Array.from({length:count},(_,i)=>{const a=(Math.PI*2*i/count)+(Math.random()-.5)*.22,speed=45+Math.random()*105;return {x:p.x,y:p.y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed-24,size:2+Math.random()*3,spin:Math.random()*6}});
  effects.push({x:p.x,y:p.y,color,particles,life:0,duration:.62,ring:0,label:index===0?label:''});
 });
 if(!fxRaf){lastFxTime=now;fxRaf=requestAnimationFrame(animatePopEffects)}
}
function animatePopEffects(timestamp){
 const dt=Math.min((timestamp-lastFxTime)/1000,.04);lastFxTime=timestamp;
 effects.forEach(e=>{e.life+=dt;e.particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.985,dt*60);p.vy+=95*dt})});
 effects=effects.filter(e=>e.life<e.duration);
 render();
 if(effects.length)fxRaf=requestAnimationFrame(animatePopEffects);else fxRaf=0;
}
function drawPopEffects(){
 effects.forEach(e=>{
  const t=Math.min(1,e.life/e.duration),fade=1-t,radius=10+34*t;
  ctx.save();ctx.globalAlpha=fade;
  ctx.beginPath();ctx.arc(e.x,e.y,radius,0,Math.PI*2);ctx.strokeStyle=e.color;ctx.lineWidth=3*(1-t)+.5;ctx.shadowColor=e.color;ctx.shadowBlur=16;ctx.stroke();ctx.shadowBlur=0;
  ctx.beginPath();ctx.arc(e.x,e.y,Math.max(2,7*(1-t)),0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  e.particles.forEach(p=>{ctx.globalAlpha=fade;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-t*.45),0,Math.PI*2);ctx.fillStyle=e.color;ctx.shadowColor=e.color;ctx.shadowBlur=9;ctx.fill()});
  if(e.label&&t<.8){ctx.globalAlpha=Math.min(1,fade*1.5);ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor=e.color;ctx.shadowBlur=10;ctx.fillText(e.label,e.x,e.y-20-22*t)}
  ctx.restore();
 });
}
function drawBubble(x,y,r,color,wild=false){
 ctx.save();ctx.shadowColor=wild?'#a78bfa':color;ctx.shadowBlur=11;
 const grad=ctx.createRadialGradient(x-r*.38,y-r*.42,r*.08,x,y,r);
 if(wild){grad.addColorStop(0,'#fff');grad.addColorStop(.22,'#fbcfe8');grad.addColorStop(.48,'#a78bfa');grad.addColorStop(.72,'#38bdf8');grad.addColorStop(1,'#312e81')}
 else{grad.addColorStop(0,'#fff');grad.addColorStop(.18,color);grad.addColorStop(.72,color);grad.addColorStop(1,'#0f172a')}
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=grad;ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#ffffffdd';ctx.lineWidth=1.7;ctx.stroke();
 // 4. Reflexo duplo e aro interno de vidro.
 ctx.beginPath();ctx.ellipse(x-r*.32,y-r*.38,r*.27,r*.15,-.55,0,Math.PI*2);ctx.fillStyle='#ffffffbb';ctx.fill();
 ctx.beginPath();ctx.arc(x,y,r*.78,.22,Math.PI*.82);ctx.strokeStyle='#ffffff30';ctx.lineWidth=1;ctx.stroke();
 ctx.beginPath();ctx.arc(x-r*.34,y-r*.3,r*.055,0,Math.PI*2);ctx.fillStyle='#ffffffaa';ctx.fill();ctx.restore();
}
function trajectory(){
 let x=shooter.x,y=shooter.y-18,vx=Math.cos(angle),vy=Math.sin(angle),step=5;
 ctx.beginPath();ctx.setLineDash([2,7]);ctx.moveTo(x,y);
 for(let i=0;i<180;i++){
  x+=vx*step;y+=vy*step;
  if(x<14){x=14;vx=Math.abs(vx)}if(x>346){x=346;vx=-Math.abs(vx)}
  if(i%2===0)ctx.lineTo(x,y);
  if(y<=20||grid.some(row=>row.some(b=>b&&Math.hypot(b.x-x,b.y-y)<=30)))break;
 }

function tap(r,c){if(selected){const [sr,sc]=selected,dr=r-sr,dc=c-sc;if(Math.abs(dr)+Math.abs(dc)===2&&((Math.abs(dr)===2&&dc===0)||(Math.abs(dc)===2&&dr===0))&&board[sr+dr/2][sc+dc/2]===1&&board[r][c]===0){history.push(board.map(row=>row.slice()));board[sr][sc]=0;board[sr+dr/2][sc+dc/2]=0;board[r][c]=1;selected=null;render();const n=board.flat().reduce((a,b)=>a+b,0);if(n===1){saveBest('resta',40);setMsg('🏆 Perfeito! Restou apenas uma peça!')}else if(!movesAvailable())setMsg('Fim de jogo: não há mais movimentos possíveis. Restaram '+n+' peças.');else setMsg('Boa jogada! Restam '+n+' peças.');return}}
if(board[r][c]){selected=[r,c];setMsg('Agora escolha o buraco vazio duas casas na horizontal ou vertical.')}else{selected=null;setMsg('Movimento inválido. Selecione uma peça para começar.')}render()}
on('new',fresh);on('undo',()=>{if(history.length){board=history.pop();selected=null;render();setMsg('Último movimento desfeito.')}});fresh();
}
start();
})();
