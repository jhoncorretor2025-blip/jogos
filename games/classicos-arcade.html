const cv=$('bubble'),ctx=cv.getContext('2d');
const COLORS=['#fb7185','#38bdf8','#fbbf24','#34d399','#c084fc','#fb923c'];
const MODES={

let difficulty='normal',palette=COLORS.slice(0,5),grid=[],angle=-Math.PI/2,shot=null,score=0,level=1,shots=0,clears=0,combo=0,bestCombo=best('bolhas_combo'),bombs=1,rainbows=1,special=null,loadedColor=COLORS[0],queueColor=COLORS[1],swappedThisTurn=false,paused=false,gameOver=false,rafId=0,lastFrame=0;
const shooter={x:180,y:474,r:14};
function cellX(c){return 20+c*40}

function randColor(){
 const present=grid.flat().filter(Boolean).map(b=>b.color);

}
function neighbors(r,c){

}
function countBubbles(){return grid.flat().filter(Boolean).length}
function updateControls(){

function updateStats(){

}
function makeField(rows){
 grid=Array.from({length:14},()=>Array(9).fill(null));
 for(let r=0;r<rows;r++)for(let c=0;c<9;c++)grid[r][c]={x:cellX(c),y:cellY(r),color:palette[Math.random()*palette.length|0]};
}
function fresh(){
 if(rafId){cancelAnimationFrame(rafId);rafId=0}
 const mode=MODES[difficulty];palette=COLORS.slice(0,mode.palette);
 level=1;score=0;shots=0;clears=0;combo=0;bombs=1;rainbows=1;special=null;paused=false;gameOver=false;shot=null;lastFrame=0;swappedThisTurn=false;
 makeField(mode.rows);loadedColor=randColor();queueColor=randColor();

}
function drawBubble(x,y,r,color,wild=false){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
 if(wild){const grad=ctx.createLinearGradient(x-r,y-r,x+r,y+r);grad.addColorStop(0,'#fb7185');grad.addColorStop(.25,'#fbbf24');grad.addColorStop(.5,'#34d399');grad.addColorStop(.75,'#38bdf8');grad.addColorStop(1,'#c084fc');ctx.fillStyle=grad}

 ctx.beginPath();ctx.arc(x-r*.32,y-r*.38,r*.25,0,Math.PI*2);ctx.fillStyle='#ffffff99';ctx.fill();
}
function trajectory(){
 let x=shooter.x,y=shooter.y-18,vx=Math.cos(angle),vy=Math.sin(angle),step=5;
 ctx.beginPath();ctx.setLineDash([2,7]);ctx.moveTo(x,y);
 for(let i=0;i<180;i++){
  x+=vx*step;y+=vy*step;
  if(x<14){x=14;vx=Math.abs(vx)}if(x>346){x=346;vx=-Math.abs(vx)}
  if(i%2===0)ctx.lineTo(x,y);
  if(y<=20||grid.some(row=>row.some(b=>b&&Math.hypot(b.x-x,b.y-y)<=30)))break;
 }

}
function render(){

 ctx.fillStyle='#ffffff12';ctx.fillRect(0,452,360,2);
 ctx.font='10px system-ui';ctx.fillStyle='#94a3b8';ctx.fillText('PRÓXIMA',286,13);drawBubble(320,31,10,queueColor);
 grid.forEach(row=>row.forEach(b=>{if(b)drawBubble(b.x,b.y,16,b.color)}));
 if(!shot&&!gameOver)trajectory();
 if(special==='bomb')drawBubble(shooter.x,shooter.y,shooter.r,'#f97316');
 else if(special==='rainbow')drawBubble(shooter.x,shooter.y,shooter.r,'#fff',true);
 else drawBubble(shooter.x,shooter.y,shooter.r,loadedColor);
 if(shot)drawBubble(shot.x,shot.y,shot.r,shot.color,shot.wild);
 if(paused){ctx.fillStyle='#020617bb';ctx.fillRect(0,0,360,520);ctx.fillStyle='#fff';ctx.font='bold 28px system-ui';ctx.textAlign='center';ctx.fillText('PAUSADO',180,260);ctx.textAlign='left'}
 if(gameOver){ctx.fillStyle='#020617bb';ctx.fillRect(0,0,360,520);ctx.fillStyle='#fff';ctx.font='bold 25px system-ui';ctx.textAlign='center';ctx.fillText('FIM DE JOGO',180,245);ctx.font='15px system-ui';ctx.fillText('Toque em Reiniciar',180,275);ctx.textAlign='left'}

}
function nearestEmpty(b){
 let target=null,dist=Infinity;
 for(let r=0;r<14;r++)for(let c=0;c<9;c++){
  if(grid[r][c])continue;
  const x=cellX(c),y=cellY(r),d=(x-b.x)**2+(y-b.y)**2;
  if(d<dist){dist=d;target={r,c,x,y}}

}
function connectedGroup(r,c,color){
 const seen=new Set(),stack=[[r,c]],group=[];
 while(stack.length){
  const [a,b]=stack.pop(),key=a+','+b;
  if(seen.has(key)||!grid[a]?.[b]||grid[a][b].color!==color)continue;
  seen.add(key);group.push([a,b]);neighbors(a,b).forEach(p=>stack.push(p));
 }

}
function removeFloating(){
 const connected=new Set(),queue=[];
 grid[0].forEach((v,c)=>{if(v){connected.add('0,'+c);queue.push([0,c])}});
 while(queue.length){
  const [r,c]=queue.pop();
  neighbors(r,c).forEach(([a,b])=>{const key=a+','+b;if(grid[a][b]&&!connected.has(key)){connected.add(key);queue.push([a,b])}});
 }
 let dropped=0;
 grid.forEach((row,r)=>row.forEach((v,c)=>{if(v&&!connected.has(r+','+c)){grid[r][c]=null;dropped++}}));
 return dropped;
}
function finishImpact(removed,bonus=0){
 if(removed>=3){
  combo++;clears++;bestCombo=Math.max(bestCombo,combo);saveBest('bolhas_combo',bestCombo);
  const multiplier=Math.min(combo,5);score+=removed*10*multiplier+bonus;
  setMsg('✨ '+removed+' bolhas removidas · combo x'+combo+' · multiplicador x'+multiplier+'!');
 }else{
  combo=0;setMsg('Bolinha posicionada. Prepare a próxima combinação!');
 }
 score=Math.max(0,score);saveBest('bolhas',score);
 const remaining=countBubbles();
 if(!remaining){
  level++;bombs=Math.min(3,bombs+1);rainbows=Math.min(3,rainbows+1);
  const rows=Math.min(9,MODES[difficulty].rows+Math.floor((level-1)/2));
  makeField(rows);loadedColor=randColor();queueColor=randColor();combo=0;special=null;
  setMsg('🏆 Nível '+(level-1)+' concluído! Novo nível '+level+' iniciado. Você ganhou uma bomba e um coringa!');
 }else if(grid.some((row,r)=>r>=11&&row.some(Boolean))){
  gameOver=true;saveBest('bolhas',score);setMsg('As bolhas chegaram perto do canhão! Fim de jogo. Pontos: '+score+'.');
 }

}
function attach(b){
 const target=nearestEmpty(b);
 if(!target){gameOver=true;render();setMsg('Não há espaço para encaixar a bolinha. Fim de jogo!');return}
 grid[target.r][target.c]={x:target.x,y:target.y,color:b.color};
 const group=connectedGroup(target.r,target.c,b.color);
 let removed=0;
 if(group.length>=3){group.forEach(([r,c])=>{grid[r][c]=null;removed++})}
 const dropped=removeFloating();removed+=dropped;
 finishImpact(removed,dropped*20);
}
function bombImpact(b){
 const radius=78;let removed=0;
 grid.forEach((row,r)=>row.forEach((v,c)=>{if(v&&Math.hypot(v.x-b.x,v.y-b.y)<=radius){grid[r][c]=null;removed++}}));
 const dropped=removeFloating();removed+=dropped;
 finishImpact(removed,dropped*20+(removed?40:0));
}
function rainbowImpact(b){
 const target=nearestEmpty(b);
 if(!target){gameOver=true;render();return}
 const adjacent=neighbors(target.r,target.c).map(([r,c])=>grid[r][c]).filter(Boolean);
 const counts={};adjacent.forEach(v=>counts[v.color]=(counts[v.color]||0)+1);

 grid[target.r][target.c]={x:target.x,y:target.y,color:chosen};
 const group=connectedGroup(target.r,target.c,chosen);let removed=0;
 if(group.length>=3){group.forEach(([r,c])=>{grid[r][c]=null;removed++})}
 const dropped=removeFloating();removed+=dropped;
 finishImpact(removed,dropped*20);
}
function setAim(e){
 if(shot||paused||gameOver)return;
 const rect=cv.getBoundingClientRect(),px=(e.clientX-rect.left)*360/rect.width,py=(e.clientY-rect.top)*520/rect.height;

}
function fire(){
 if(shot||paused||gameOver)return;
 const mode=special,color=mode==='bomb'?'#f97316':mode==='rainbow'?'#ffffff':loadedColor;
 if(mode==='bomb')bombs--;if(mode==='rainbow')rainbows--;
 shot={x:shooter.x,y:shooter.y-18,vx:Math.cos(angle)*MODES[difficulty].speed,vy:Math.sin(angle)*MODES[difficulty].speed,color,r:14,wild:mode==='rainbow',mode};
 special=null;loadedColor=queueColor;queueColor=randColor();swappedThisTurn=false;shots++;lastFrame=0;

}
function animate(timestamp){
 rafId=0;if(paused||!shot||gameOver){render();return}
 const dt=lastFrame?Math.min((timestamp-lastFrame)/1000,.032):1/60;lastFrame=timestamp;

 if(shot.x>346){shot.x=346;shot.vx=-Math.abs(shot.vx)}
 const collision=grid.some(row=>row.some(b=>b&&Math.hypot(b.x-shot.x,b.y-shot.y)<=30));
 if(collision||shot.y<=20){
  const landed=shot;shot=null;lastFrame=0;
  if(landed.mode==='bomb')bombImpact(landed);
  else if(landed.mode==='rainbow')rainbowImpact(landed);

}
function swap(){

 [loadedColor,queueColor]=[queueColor,loadedColor];swappedThisTurn=true;render();

}
function toggleSpecial(type){
 if(shot||paused||gameOver)return;
 const available=type==='bomb'?bombs:rainbows;
 if(special===type){special=null;render();setMsg('Poder especial desativado.');return}
 if(!available){setMsg('Você não tem cargas desse poder. Conclua um nível para ganhar mais.');return}
 special=type;render();setMsg(type==='bomb'?'Bomba selecionada: explode as bolhas próximas ao impacto.':'Coringa selecionado: combina com a cor predominante ao redor do impacto.');
}
function togglePause(){
 if(gameOver)return;
 paused=!paused;
 if(paused&&rafId){cancelAnimationFrame(rafId);rafId=0}
 render();
 if(!paused&&shot&&!rafId){lastFrame=0;rafId=requestAnimationFrame(animate)}

}
$('bubbleDifficulty').addEventListener('change',e=>{difficulty=MODES[e.target.value]?e.target.value:'normal';fresh()});
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)setAim(e)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture?.(e.pointerId);setAim(e);fire()});
on('shoot',fire);on('swap',swap);on('bomb',()=>toggleSpecial('bomb'));on('rainbow',()=>toggleSpecial('rainbow'));on('pause',togglePause);on('new',fresh);
fresh();
}
function frogger(){
shellStats(stat('Pontos','score')+stat('Chegadas','homes')+stat('Recorde','best'));
$('stage').innerHTML='<canvas id="frog" width="360" height="440" aria-label="Travessia Maluca"></canvas><div class="frog-pad"><span></span><button id="up">▲</button><span></span><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div>';
buttons(btn('new','🔄 Reiniciar','btn primary'));const cv=$('frog'),ctx=cv.getContext('2d');let px=4,py=9,homes=[],score=0,tick=0,alive=true,lanes=[];
function fresh(){px=4;py=9;homes=[];score=0;tick=0;alive=true;lanes=[];for(let r=1;r<=3;r++)lanes[r]=Array.from({length:3},(_,i)=>({x:i*4-1,len:2+(r%2),speed:(r%2?1:-1)*(.012+.006*r)}));for(let r=6;r<=8;r++)lanes[r]=Array.from({length:3},(_,i)=>({x:i*5-1,len:r===7?1:1.5,speed:(r%2?1:-1)*(.018+.008*(r-6))}));draw();setMsg('Atravesse com cuidado. Chegue a uma das cinco bases verdes!')}
function draw(){ctx.clearRect(0,0,360,440);for(let r=0;r<11;r++){ctx.fillStyle=(r===0||r===5||r===10)?'#14532d':r<=3?'#075985':r===4?'#334155':'#374151';ctx.fillRect(0,r*40,360,40);if(r<=3||r>=6&&r<=8){ctx.strokeStyle='#ffffff16';for(let x=0;x<360;x+=40){ctx.strokeRect(x,r*40,40,40)}}}
homes.forEach(c=>{ctx.fillStyle='#fbbf24';ctx.fillRect(c*40+5,4,30,30);ctx.fillStyle='#14532d';ctx.font='22px sans-serif';ctx.fillText('★',c*40+10,28)});
for(let r=1;r<=3;r++)lanes[r].forEach(o=>{ctx.fillStyle='#a16207';ctx.fillRect(o.x*40,r*40+7,o.len*40-3,26);ctx.fillStyle='#fbbf24';ctx.fillRect(o.x*40+8,r*40+11,Math.max(4,o.len*40-20),5)});
for(let r=6;r<=8;r++)lanes[r].forEach(o=>{ctx.fillStyle=r===7?'#ef4444':'#f59e0b';ctx.fillRect(o.x*40,r*40+6,o.len*40-4,28);ctx.fillStyle='#111827';ctx.fillRect(o.x*40+7,r*40+29,10,5);ctx.fillRect(o.x*40+o.len*40-18,r*40+29,10,5)});
ctx.font='30px sans-serif';ctx.fillText('🐸',px*40+5,py*40+32);$('score').textContent=score;$('homes').textContent=homes.length;$('best').textContent=best('frogger')}
function lose(msg){alive=false;setMsg(msg+' Toque em reiniciar.');}
function step(dx,dy){if(!alive)return;px=Math.max(0,Math.min(8,px+dx));py=Math.max(0,Math.min(10,py+dy));if(py===0){if([0,2,4,6,8].includes(px)&&!homes.includes(px)){homes.push(px);score+=100;saveBest('frogger',score);if(homes.length===5){score+=500;setMsg('🏆 Todas as chegadas completas!');alive=false;return}}else{lose('Essa chegada já foi ocupada.')}}draw()}
function update(){if(!alive)return;tick++;for(let r=1;r<=3;r++)lanes[r].forEach(o=>{o.x+=o.speed;if(o.speed>0&&o.x>9)o.x=-o.len;if(o.speed<0&&o.x+o.len<0)o.x=9});for(let r=6;r<=8;r++)lanes[r].forEach(o=>{o.x+=o.speed;if(o.speed>0&&o.x>9)o.x=-o.len;if(o.speed<0&&o.x+o.len<0)o.x=9});
if(py>=1&&py<=3){const log=lanes[py].find(o=>px+.45>=o.x&&px+.55<=o.x+o.len);if(!log){lose('Você caiu na água!')}else{px+=log.speed;if(px<0||px>8)lose('A corrente levou você!')}}
if(py>=6&&py<=8&&lanes[py].some(o=>px+.5>=o.x&&px+.5<=o.x+o.len)){lose('Um veículo atingiu o sapinho!')}
draw()}
function action(id,dx,dy){on(id,()=>step(dx,dy))}action('up',0,-1);action('down',0,1);action('left',-1,0);action('right',1,0);on('new',fresh);window.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(m[k]){e.preventDefault();step(...m[k])}});setInterval(update,100);fresh();
}
function resta(){
shellStats(stat('Peças restantes','leftCount')+stat('Recorde','best'));
$('stage').innerHTML='<div class="pegs" id="pegs"></div>';
buttons(btn('new','🔄 Novo desafio','btn primary')+btn('undo','↶ Desfazer'));
let board=[],selected=null,history=[];
function valid(r,c){return (r>=2&&r<=4)||(c>=2&&c<=4)}
function fresh(){board=Array.from({length:7},(_,r)=>Array.from({length:7},(_,c)=>valid(r,c)?1:0));board[3][3]=0;selected=null;history=[];render();setMsg('Salte sobre uma peça para removê-la. Objetivo: deixar apenas uma!')}
function movesAvailable(){for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(board[r][c])for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]])if(board[r+dr]?.[c+dc]&&board[r+2*dr]?.[c+2*dc]===0)return true;return false}
function render(){const el=$('pegs');el.innerHTML='';let n=0;for(let r=0;r<7;r++)for(let c=0;c<7;c++){const b=document.createElement('button');b.className='hole '+(!valid(r,c)?'block':'')+(board[r][c]?' peg':'')+(selected&&selected[0]===r&&selected[1]===c?' sel':'');if(valid(r,c)){n+=board[r][c];b.setAttribute('aria-label',board[r][c]?'Peça':'Buraco vazio');b.addEventListener('click',()=>tap(r,c))}el.appendChild(b)}$('leftCount').textContent=n;$('best').textContent=best('resta')}
function tap(r,c){if(selected){const [sr,sc]=selected,dr=r-sr,dc=c-sc;if(Math.abs(dr)+Math.abs(dc)===2&&((Math.abs(dr)===2&&dc===0)||(Math.abs(dc)===2&&dr===0))&&board[sr+dr/2][sc+dc/2]===1&&board[r][c]===0){history.push(board.map(row=>row.slice()));board[sr][sc]=0;board[sr+dr/2][sc+dc/2]=0;board[r][c]=1;selected=null;render();const n=board.flat().reduce((a,b)=>a+b,0);if(n===1){saveBest('resta',40);setMsg('🏆 Perfeito! Restou apenas uma peça!')}else if(!movesAvailable())setMsg('Fim de jogo: não há mais movimentos possíveis. Restaram '+n+' peças.');else setMsg('Boa jogada! Restam '+n+' peças.');return}}
if(board[r][c]){selected=[r,c];setMsg('Agora escolha o buraco vazio duas casas na horizontal ou vertical.')}else{selected=null;setMsg('Movimento inválido. Selecione uma peça para começar.')}render()}
on('new',fresh);on('undo',()=>{if(history.length){board=history.pop();selected=null;render();setMsg('Último movimento desfeito.')}});fresh();
}
start();
})();
