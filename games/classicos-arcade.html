/* Bubble Shooter visual refresh */
.bubble-ui{width:100%;max-width:560px;margin:0 auto;padding:4px 0 8px;color:#eaf6ff}

.bubble-canvas-frame:before{content:"";position:absolute;inset:3px;border-radius:22px;border:1px solid #ffffff33;pointer-events:none;z-index:2}
.bubble-canvas-frame:after{content:"";position:absolute;left:18px;right:18px;top:8px;height:40%;border-radius:18px;background:linear-gradient(120deg,#ffffff12,transparent 48%);pointer-events:none;z-index:1}
.bubble-canvas-top{position:absolute;z-index:3;top:15px;left:17px;right:17px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.bubble-canvas-top span{padding:5px 8px;border-radius:999px;background:#071321bd;border:1px solid #ffffff25;color:#dff7ff;font-size:9px;font-weight:900;letter-spacing:.08em;backdrop-filter:blur(5px)}
.bubble-canvas-top .bubble-live{color:#86efac}
#bubble{position:relative;z-index:0;width:100%;max-width:360px;height:auto;aspect-ratio:360/520;display:block;margin:0 auto;border:1px solid #8ddcff66;border-radius:17px;background:#071321;box-shadow:inset 0 0 25px #0008,0 5px 12px #0008;touch-action:pan-y}

</style></head><body><main class="wrap">
<div class="top"><a class="back" href="../index.html">← Voltar ao Arcade</a><span class="ver">JOGO v1.3</span></div>
<header class="hero"><div id="logo" class="logo">🎮</div><h1 id="title">Clássicos Arcade</h1><p id="subtitle" class="sub">Diversão para todos os momentos</p></header>
<section class="panel"><div id="stats" class="stats"></div><div id="stage"></div><div id="message" class="message" aria-live="polite"></div><div id="controls" class="controls"></div><p id="hint" class="hint"></p></section>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),mode=params.get('game')||'domino';
const info={
 domino:['🁣','Dominó','Encaixe suas peças, bloqueie a IA e seja o primeiro a ficar sem pedras.','Use as peças da sua mão; quando houver encaixe nos dois lados, escolha onde jogar.'],
 paciencia:['🃏','Paciência','Organize as cartas em sequência e complete os quatro naipes.','Toque numa carta para selecioná-la e depois toque no destino. Monte em ordem decrescente e cores alternadas.'],
 pinball:['🎱','Pinball Neon','Acione as palhetas, acerte os alvos e tente bater seu recorde.','Use ◀ e ▶, as teclas A/D ou as setas. Toque em LANÇAR para iniciar.'],
 bolhas:['🫧','Bubble Shooter','Mire, combine três bolhas da mesma cor e limpe o campo.','Toque no tabuleiro para mirar e solte/toque em ATIRAR.'],
 frogger:['🐸','Travessia Maluca','Atravesse pistas e rios sem ser atingido.','Use as setas ou os botões para atravessar ruas e rios.']
};
function stat(label,id){return '<div class="stat"><small>'+label+'</small><b id="'+id+'">0</b></div>'}
function shellStats(html){$('stats').innerHTML=html}
function btn(id,label,cls='btn'){return '<button class="'+cls+'" id="'+id+'">'+label+'</button>'}
function buttons(html){$('controls').innerHTML=html}
function on(id,fn){const el=$(id);if(el)el.addEventListener('click',fn)}
function setMsg(text){$('message').textContent=text}
function best(key){return Number(localStorage.getItem('arcade_best_'+key)||0)}
function saveBest(key,value){if(value>best(key))localStorage.setItem('arcade_best_'+key,String(value))}
function start(){const titles=info[mode]||info.domino;$('logo').textContent=titles[0];$('title').textContent=titles[1];$('subtitle').textContent=titles[2];$('hint').textContent=titles[3];const games={domino,paciencia,pinball,bolhas,frogger,resta,stop};(games[mode]||domino)()}
function stop(){
shellStats(stat('Rodadas','rounds')+stat('Pontos','score'));
const cats=['Nome','Cidade','Animal','Comida','Objeto','Profissão'];let letter='A',round=0;
$('stage').innerHTML='<div style="text-align:center;font-size:56px;font-weight:900" id="stopLetter">A</div><div class="solgrid" style="grid-template-columns:1fr">'+cats.map((x,i)=>'<label style="display:block;margin:6px 0">'+x+'<input id="stop'+i+'" placeholder="Digite uma resposta" style="width:100%;padding:12px;border-radius:9px;background:#0b1424;color:white;border:1px solid #334155"></label>').join('')+'</div>';
buttons(btn('stopNew','🔤 Nova letra')+btn('stopCheck','✅ STOP!','btn primary'));
function newRound(){letter='ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.random()*26|0];round++;$('stopLetter').textContent=letter;cats.forEach((_,i)=>{$('stop'+i).value=''});$('rounds').textContent=round;setMsg('Responda cada categoria com a letra '+letter+'.')}
on('stopNew',newRound);on('stopCheck',()=>{let points=0;cats.forEach((_,i)=>{const v=$('stop'+i).value.trim();if(v&&v[0].toUpperCase()===letter)points+=10});const total=Number($('score').textContent||0)+points;$('score').textContent=total;setMsg('Você marcou '+points+' pontos nesta rodada! Total: '+total+'.');newRound()});newRound()
}
function domino(){
shellStats(stat('Pontos','score')+stat('Suas peças','mine')+stat('Peças da IA','ai'));
$('stage').innerHTML='<div class="domino-top"><div class="dom-avatar"><div class="avatar-face">😎</div><b>Você</b><small id="playerCount">7 peças</small></div><div class="domino-status" id="domStatus">Sua vez</div><div class="dom-avatar ai-avatar"><div class="avatar-face">🤖</div><b>IA</b><small id="aiCount">7 peças</small></div></div><div class="dom-theme-row"><span>🎨 Mesa</span><select id="domTheme"><option value="green">Clássica verde</option><option value="wood">Madeira</option><option value="blue">Azul moderna</option><option value="dark">Escura</option><option value="casino">Cassino</option></select></div><div class="ends"><span id="leftEnd">⬅️ Ponta: —</span><span id="rightEnd">Ponta: — ➡️</span></div><div class="domboard" id="domboard">O tabuleiro começa aqui</div><h3 style="font-size:15px;margin:14px 0 3px">🀄 Sua mão <span id="handHint" class="handhint"></span></h3><div class="hand" id="hand"></div><div class="dom-actions" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+btn('draw','🛒 Comprar peça')+btn('pass','⏭️ Passar')+'</div>';
buttons(btn('new','🔄 Nova partida','btn primary'));
let deck=[],hand=[],ai=[],board=[],score=0,blocked=0,locked=false,theme='green';
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){deck=[];for(let a=0;a<=6;a++)for(let b=a;b<=6;b++)deck.push([a,b]);shuffle(deck);hand=deck.splice(0,7);ai=deck.splice(0,7);board=[deck.pop()];score=0;blocked=0;locked=false;render();setMsg('Sua vez! Se não houver jogada, compre até encontrar uma peça.')}
function ends(){return [board[0][0],board[board.length-1][1]]}
const pipMap={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

function animateEffects(dt){effects.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=190*dt;p.life-=dt});effects=effects.filter(p=>p.life>0);fallers.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=430*dt;p.life-=dt});fallers=fallers.filter(p=>p.life>0&&p.y<560);floaters.forEach(p=>{p.y-=32*dt;p.life-=dt});floaters=floaters.filter(p=>p.life>0);ceilingFlash=Math.max(0,ceilingFlash-dt)}

ctx.save();ctx.translate(180,470);ctx.rotate(angle+Math.PI/2);ctx.fillStyle=cannonSkins[skin];ctx.shadowColor=cannonSkins[skin];ctx.shadowBlur=10;ctx.fillRect(-7,-38,14,40);ctx.fillStyle='#0f172a';ctx.fillRect(-3,-34,6,28);ctx.restore();ctx.beginPath();ctx.arc(180,470,18,0,Math.PI*2);ctx.fillStyle='#334155';ctx.fill();ctx.strokeStyle=cannonSkins[skin];ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(180,470,12,0,Math.PI*2);ctx.fillStyle=currentBubbleColor;ctx.fill();if(shot){if(shot.trail&&shot.trail.length>1){ctx.save();ctx.lineCap='round';for(let i=1;i<shot.trail.length;i++){ctx.beginPath();ctx.moveTo(shot.trail[i-1].x,shot.trail[i-1].y);ctx.lineTo(shot.trail[i].x,shot.trail[i].y);ctx.strokeStyle=shot.color+(i<shot.trail.length-4?'44':'99');ctx.lineWidth=2+i/shot.trail.length*4;ctx.stroke()}ctx.restore()}ctx.save();ctx.shadowColor=shot.color;ctx.shadowBlur=20;ctx.beginPath();ctx.arc(shot.x,shot.y,15,0,Math.PI*2);ctx.fillStyle=shot.color;ctx.fill();ctx.restore();if(shot.kind==='bomb'||shot.kind==='electric'||shot.kind==='pierce'||shot.kind==='rainbow'){ctx.strokeStyle=shot.kind==='bomb'?'#fbbf24':shot.kind==='electric'?'#67e8f9':shot.kind==='pierce'?'#f0abfc':'#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(shot.x,shot.y,19,0,Math.PI*2);ctx.stroke()}}

function startAnimation(){if(animationRunning)return;animationRunning=true;lastFrame=0;requestAnimationFrame(animationFrame)}
function animationFrame(now){if(!animationRunning)return;if(!lastFrame)lastFrame=now;const dt=Math.min((now-lastFrame)/1000,.035);lastFrame=now;if(shot){shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;shot.trail.push({x:shot.x,y:shot.y});if(shot.trail.length>9)shot.trail.shift();if(shot.x<16||shot.x>344){shot.vx*=-1;shot.x=Math.max(16,Math.min(344,shot.x));shot.bounces++}let collision=false;for(const row of grid){for(const b of row){if(b&&Math.hypot(b.x-shot.x,b.y-shot.y)<29){collision=true;break}}if(collision)break}if(collision||shot.y<24||shot.y>460){const landed=shot;shot=null;burst(landed.x,landed.y,landed.color,7);attach(landed)}}

function fire(kind='normal'){if(shot||gameOver||levelTransition)return;let shotKind=kind;if(kind==='normal'){shotKind=ammo%12===11?'rainbow':ammo%8===7?'electric':ammo%6===5?'pierce':'normal'}const speed=precisionActive?500:430,startX=180+Math.cos(angle)*39,startY=470+Math.sin(angle)*39;shot={x:startX,y:startY,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,color:currentBubbleColor,kind:shotKind,bounces:0,trail:[{x:startX,y:startY}]};ammo++;currentBubbleColor=nextColor();shotsSinceDrop++;precisionActive=false;sfx('shot');render();startAnimation()}

function setAimFromPointer(e){const rect=cv.getBoundingClientRect(),px=(e.clientX-rect.left)*360/rect.width,py=(e.clientY-rect.top)*520/rect.height;angle=Math.atan2(py-470,px-180);angle=Math.max(-Math.PI+.2,Math.min(-.2,angle));render()}

function frogger(){

buttons(btn('new','🔄 Reiniciar','btn primary'));const cv=$('frog'),ctx=cv.getContext('2d');let px=4,py=9,homes=[],score=0,tick=0,alive=true,lanes=[];
function fresh(){px=4;py=9;homes=[];score=0;tick=0;alive=true;lanes=[];for(let r=1;r<=3;r++)lanes[r]=Array.from({length:3},(_,i)=>({x:i*4-1,len:2+(r%2),speed:(r%2?1:-1)*(.012+.006*r)}));for(let r=6;r<=8;r++)lanes[r]=Array.from({length:3},(_,i)=>({x:i*5-1,len:r===7?1:1.5,speed:(r%2?1:-1)*(.018+.008*(r-6))}));draw();setMsg('Atravesse com cuidado. Chegue a uma das cinco bases verdes!')}
function draw(){ctx.clearRect(0,0,360,440);for(let r=0;r<11;r++){ctx.fillStyle=(r===0||r===5||r===10)?'#14532d':r<=3?'#075985':r===4?'#334155':'#374151';ctx.fillRect(0,r*40,360,40);if(r<=3||r>=6&&r<=8){ctx.strokeStyle='#ffffff16';for(let x=0;x<360;x+=40){ctx.strokeRect(x,r*40,40,40)}}}

function lose(msg){alive=false;setMsg(msg+' Toque em reiniciar.');}

}
