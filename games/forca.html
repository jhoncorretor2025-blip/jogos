<style>
  :root{--bg:#070b14;--card:#0f172a;--line:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--acc:#fb7185}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;background:radial-gradient(700px 420px at 50% -10%,rgba(251,113,133,.15),transparent 65%),var(--bg);
    color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  .top{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{color:var(--muted);text-decoration:none;font-size:22px;padding:6px 8px;border-radius:10px}
  .back:hover{background:#111c31;color:var(--txt)}
  h1{font-size:17px;margin:0;font-weight:700}
  .hud{width:100%;max-width:560px;display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:center}
  .stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .stat b{font-size:16px}
  .stage{width:100%;max-width:560px;display:flex;gap:14px;align-items:center;margin-bottom:6px}
  svg{width:130px;height:150px;flex:0 0 auto}
  svg .part{opacity:0;transition:opacity .25s}
  svg .part.on{opacity:1}
  .side{flex:1;min-width:0}
  .cat{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .cat b{color:var(--acc)}
  .hintline{font-size:12px;color:#cbd5e1;margin-top:5px;line-height:1.35}
  .hearts{font-size:17px;letter-spacing:2px}
  #word{width:100%;max-width:560px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0 16px}
  .slot{
    min-width:30px;height:42px;display:flex;align-items:center;justify-content:center;
    border-bottom:3px solid #334155;font-size:23px;font-weight:800;letter-spacing:1px;
    color:var(--txt);padding:0 2px;
  }
  .slot.gap{border:0;min-width:14px}
  .slot.miss{color:#fb7185;border-color:#7f1d1d}
  #keys{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .key{
    aspect-ratio:1.15;border-radius:9px;border:1px solid var(--line);background:#131f36;color:var(--txt);
    font-size:15px;font-weight:700;cursor:pointer;
  }
  .key:active{transform:scale(.96)}
  .key.ok{background:#065f46;border-color:#10b981;color:#d1fae5}
  .key.bad{background:#3f1d24;border-color:#7f1d1d;color:#fda4af}
  .key:disabled{cursor:default}
  .bar{width:100%;max-width:560px;display:flex;gap:8px;margin-top:16px}
  .btn{
    flex:1;font:inherit;font-size:14.5px;font-weight:700;border-radius:12px;padding:12px;border:0;cursor:pointer;
    background:linear-gradient(90deg,#fb7185,#f59e0b);color:#2a0b10;
  }
  .btn.ghost{background:#101a2e;border:1px solid var(--line);color:var(--txt)}
  .btn:active{transform:scale(.98)}
  .msg{min-height:22px;margin-top:12px;font-size:14.5px;text-align:center;color:var(--muted)}
  .msg b{color:var(--txt)}
  .hint{color:#64748b;font-size:12.5px;margin:10px 0 0;text-align:center;max-width:460px}
  .ver{color:#475569;font-size:11.5px;margin-top:10px}

  const clues={"apartamento":"Moradia em um prédio, com vizinhos em outras unidades.","aluguel":"Valor pago para morar ou usar um imóvel de outra pessoa.","condomínio":"Prédio ou conjunto com despesas e áreas compartilhadas.","imobiliária":"Empresa que trabalha com compra, venda e locação de imóveis.","contrato":"Documento que formaliza um acordo.","vistoria":"Inspeção para conferir o estado de um imóvel.","inquilino":"Pessoa que aluga um imóvel.","fiador":"Pessoa que garante uma obrigação de outra.","escritura":"Documento oficial relacionado à transferência de um imóvel.","cartório":"Local onde registros e documentos oficiais são feitos.","financiamento":"Compra paga parceladamente com ajuda de crédito.","corretor":"Profissional que intermedia negócios imobiliários.","garagem":"Lugar onde se guarda um carro.","varanda":"Área aberta ligada a uma casa ou apartamento.","reforma":"Obra para melhorar ou modificar algo.","javascript":"Linguagem usada para dar interatividade a páginas web.","algoritmo":"Sequência de passos para resolver um problema.","servidor":"Sistema que fornece serviços ou dados a outros dispositivos.","aplicativo":"Programa usado para realizar tarefas.","inteligência":"Capacidade de aprender, compreender e resolver problemas.","automação":"Tarefas realizadas automaticamente com pouca intervenção.","internet":"Rede mundial que conecta computadores e dispositivos.","senha":"Código secreto para entrar em uma conta.","robô":"Máquina que executa tarefas automaticamente.","planilha":"Arquivo organizado em linhas e colunas.","navegador":"Programa para acessar páginas da internet.","memória":"Capacidade ou componente que guarda informações.","bicicleta":"Veículo de duas rodas movido por pedais.","cachorro":"Animal doméstico conhecido como melhor amigo do homem.","floresta":"Grande área coberta por árvores.","montanha":"Grande elevação natural do terreno.","chocolate":"Doce feito com cacau.","guitarra":"Instrumento de cordas muito usado no rock.","oceano":"Imensa massa de água salgada.","futebol":"Esporte em que duas equipes tentam marcar gols.","pizza":"Massa redonda com molho e coberturas.","viagem":"Deslocamento para conhecer outro lugar.","saudade":"Sentimento de falta de alguém ou algo querido.","família":"Grupo de pessoas ligadas por parentesco ou afeto.","música":"Arte que combina sons e ritmos.","biblioteca":"Lugar onde livros podem ser consultados ou emprestados.","passarinho":"Pequena ave que costuma cantar e voar.","guarda-chuva":"Objeto usado para se proteger da chuva.","relâmpago":"Clarão que aparece durante uma tempestade.","vegetal":"Ser vivo do reino das plantas; também pode ser alimento.","violão":"Instrumento de cordas tocado com dedos ou palheta.","bateria":"Instrumento musical com tambores e pratos.","piano":"Instrumento musical com teclas brancas e pretas.","trompete":"Instrumento de sopro metálico.","cenoura":"Raiz alaranjada usada em receitas e saladas.","brócolis":"Vegetal verde que lembra pequenas árvores.","abóbora":"Fruto grande usado em sopas e doces.","tomate":"Fruto vermelho usado em saladas e molhos.","alface":"Folhas verdes comuns em saladas.","martelo":"Ferramenta usada para bater pregos.","tesoura":"Objeto com duas lâminas usado para cortar.","avião":"Veículo que voa e transporta pessoas ou cargas.","ônibus":"Veículo coletivo que transporta passageiros.","navio":"Grande embarcação que navega pelos mares.","astronauta":"Pessoa treinada para viajar e trabalhar no espaço.","professor":"Profissional que ensina.","médico":"Profissional que cuida da saúde.","dentista":"Profissional que cuida dos dentes.","enfermeira":"Profissional da saúde que cuida de pacientes.","campeonato":"Competição para decidir o vencedor de uma modalidade.","basquete":"Esporte em que a bola deve entrar numa cesta elevada.","voleibol":"Esporte em que a bola passa por cima de uma rede.","xadrez":"Jogo de estratégia com rei, rainha e outras peças.","dominó":"Jogo com peças retangulares marcadas por pontos.","pintura":"Arte de criar imagens usando tintas.","cinema":"Lugar onde se assistem filmes numa tela grande.","teatro":"Arte de representar histórias ao vivo no palco.","fotografia":"Arte de registrar imagens com uma câmera.","relógio":"Objeto que indica as horas.","telefone":"Aparelho usado para conversar à distância.","televisão":"Aparelho que transmite programas e imagens.","computador":"Máquina eletrônica usada para trabalhar, estudar e jogar.","microfone":"Dispositivo que capta voz e outros sons.","fone":"Acessório usado para ouvir áudio nos ouvidos.","montagem":"Processo de juntar peças para formar algo.","parafuso":"Peça com rosca usada para fixar materiais.","escada":"Estrutura com degraus para subir ou descer.","travesseiro":"Objeto macio que apoia a cabeça ao dormir.","geladeira":"Eletrodoméstico que mantém alimentos frios.","fogão":"Eletrodoméstico usado para cozinhar.","chuveiro":"Equipamento usado para tomar banho.","borboleta":"Inseto com asas coloridas que passa por metamorfose.","elefante":"Grande mamífero com tromba.","girafa":"Animal conhecido pelo pescoço muito comprido.","tartaruga":"Réptil que possui uma carapaça.","pinguim":"Ave que não voa e vive em regiões frias.","abelha":"Inseto que produz mel e poliniza flores.","deserto":"Região muito seca, com pouca chuva.","vulcão":"Abertura na crosta terrestre por onde pode sair lava.","cachoeira":"Queda de água de um rio ou riacho.","arco-íris":"Fenômeno colorido que pode aparecer após a chuva.","planeta":"Astro que orbita uma estrela.","galáxia":"Conjunto enorme de estrelas, gás e poeira cósmica.","cometa":"Corpo celeste que pode formar uma cauda perto do Sol.","satélite":"Objeto que orbita um planeta, natural ou artificial."};
  function celebrate(){confettiEl.innerHTML='';for(let i=0;i<60;i++){const p=document.createElement('i');p.className='conf';p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*.45+'s';p.style.background=['#fb7185','#fbbf24','#34d399','#60a5fa','#c084fc'][i%5];confettiEl.appendChild(p)}setTimeout(()=>confettiEl.innerHTML='',2300)}

  function norm(s){
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function render(){
    const nw = norm(current.w);
    wordEl.innerHTML = '';
    for (let i = 0; i < nw.length; i++) {
      const ch = nw[i];
      const slot = document.createElement('div');
      if (ch === '-' || ch === ' ') {
        slot.className = 'slot gap';
        slot.textContent = ch === '-' ? '-' : '';
        if (ch === '-') { slot.style.border = '0'; slot.style.color = '#64748b'; }
      } else if (guessed.has(ch)) {
        slot.className = 'slot';
        slot.textContent = current.w[i];
      } else {
        slot.className = 'slot' + (over && errors >= MAX_ERRORS ? ' miss' : '');
        slot.textContent = over && errors >= MAX_ERRORS ? current.w[i] : '';
      }
      wordEl.appendChild(slot);
    }

    keysEl.innerHTML = '';
    LETTERS.forEach(function(L){
      const k = L.toLowerCase();
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'key';
      b.textContent = L;
      if (guessed.has(k)) {
        b.disabled = true;
        b.classList.add(norm(current.w).indexOf(k) >= 0 ? 'ok' : 'bad');
      }
      b.addEventListener('click', function(){ guess(k); });
      keysEl.appendChild(b);
    });

    catEl.textContent = current.c;
    catIconEl.textContent=(language==='en'?langIcons[current.c]:categoryIcons[current.c])||'🧩';
    hintEl.textContent = language==='en'?(current.d||'Think of an example from this category.'):(clues[current.w] || 'Pense em exemplos da categoria: ' + current.c + '.');
    heartsEl.textContent = '❤️'.repeat(Math.max(0, MAX_ERRORS - errors)) + '🖤'.repeat(Math.min(errors, MAX_ERRORS));
    parts.forEach(function(p){
      p.classList.toggle('on', Number(p.dataset.part) <= errors);
    });
    roundEl.textContent = round;
    winsEl.textContent = wins;
    lossesEl.textContent = losses;
    streakEl.textContent=streak;
    scoreEl.textContent=score;
  }

  function newWord(){
    if(!started)return;
    const pool=language==='en'?EN_WORDS:WORDS;
    let next;
    do { next = pool[Math.floor(Math.random() * pool.length)]; }
    while (pool.length > 1 && current && next.w === current.w);
    current = next;
    guessed = new Set();
    errors = 0;
    over = false;
    round++;
    msgEl.className='msg';
    msgEl.textContent = language==='en'?'Choose a letter.':'Escolha uma letra.';
    stageEl.classList.remove('winGlow','lossGlow');
    render();
  }

  function guess(letter){
    if (over || guessed.has(letter)) return;
    guessed.add(letter);
    const nw = norm(current.w);
    if (nw.indexOf(letter) === -1) {
      errors++;
      stageEl.classList.remove('shake');void stageEl.offsetWidth;stageEl.classList.add('shake');
      if (errors >= MAX_ERRORS) {
        over = true;
        losses++;streak=0;
        stageEl.classList.add('lossGlow');msgEl.className='msg loss';
        msgEl.innerHTML = language==='en'?'No lives left. The word was <b>'+current.w+'</b>.':'Sem vidas. A palavra era <b>' + current.w + '</b>.';
        render();
        return;
      }
    }
    const allFound = nw.split('').every(function(ch){
      return ch === '-' || guessed.has(ch);
    });
    if (allFound) {
      over = true;
      wins++;streak++;score+=Math.max(10,(MAX_ERRORS-errors)*10);
      stageEl.classList.add('winGlow');msgEl.className='msg win';celebrate();
      msgEl.innerHTML = language==='en'?'🎉 Correct: <b>'+current.w+'</b>! +'+Math.max(10,(MAX_ERRORS-errors)*10)+' points':'🎉 Acertou: <b>' + current.w + '</b>! +' + Math.max(10,(MAX_ERRORS-errors)*10) + ' pontos';
    }
    render();
  }

  document.getElementById('next').addEventListener('click', newWord);
  let selectedLanguage='pt';
  document.querySelectorAll('.language-btn').forEach(btn=>btn.addEventListener('click',()=>{selectedLanguage=btn.dataset.lang;document.querySelectorAll('.language-btn').forEach(b=>b.classList.toggle('selected',b===btn));}));
  document.getElementById('startGame').addEventListener('click',()=>{language=selectedLanguage;started=true;document.getElementById('startScreen').style.display='none';document.body.classList.remove('game-hidden');newWord();});
  document.getElementById('resetScore').addEventListener('click', function(){
    wins = 0; losses = 0; round = 0;streak=0;score=0;
    newWord();
  });

  window.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { if (over) newWord(); return; }
    if (!/^[a-zA-Z]$/.test(e.key)) return;
    guess(e.key.toLowerCase());
  });

  document.body.classList.add('game-hidden');
})();
</script>
