<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Jogo da Memória — Jogos do Jhon v1.6</title>
<style>
  :root{--bg:#070b14;--card:#0f172a;--line:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--acc:#a78bfa}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh;min-height:100dvh;
    background:radial-gradient(700px 420px at 50% -10%,rgba(167,139,250,.18),transparent 65%),var(--bg);
    color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:12px 14px 20px;display:flex;flex-direction:column;align-items:center;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  .top{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{color:var(--muted);text-decoration:none;font-size:22px;padding:6px 8px;border-radius:10px}
  .back:hover{background:#111c31;color:var(--txt)}
  h1{font-size:17px;margin:0;font-weight:700;flex:1}
  .icon-btn{
    border:1px solid var(--line);background:#101a2e;color:var(--txt);border-radius:10px;
    width:42px;height:42px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn[aria-pressed="true"]{background:#1b2b47}
  .icon-btn:active{transform:scale(.96)}
  .bar{width:100%;max-width:560px;display:flex;gap:8px;margin-bottom:8px}
  select,.btn{
    font:inherit;font-size:14px;border-radius:11px;padding:10px 14px;border:1px solid var(--line);
    background:#101a2e;color:var(--txt);cursor:pointer;
  }
  .btn{background:linear-gradient(90deg,#a78bfa,#818cf8);color:#1e1b4b;font-weight:700;border:0}
  .btn:active,select:active{transform:scale(.98)}
  .stats{width:100%;max-width:560px;display:flex;gap:8px;margin-bottom:8px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:6px 8px;text-align:center;min-width:0}
  .stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .stat b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .stat b small{font-size:11px;color:var(--muted);font-weight:500}
  .progress{width:100%;max-width:560px;height:6px;border-radius:99px;background:#16223a;overflow:hidden;margin-bottom:10px}
  #fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#34d399,#a78bfa);transition:width .3s ease}
  #board{
    width:100%;display:grid;gap:8px;
    grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
  }
  .card{aspect-ratio:1;perspective:800px;background:none;border:0;padding:0;cursor:pointer;border-radius:13px}
  .card:focus-visible{outline:2px solid #a78bfa;outline-offset:2px}
  .inner{position:relative;width:100%;height:100%}
  .face{position:absolute;inset:0;align-items:center;justify-content:center;border-radius:13px;font-size:clamp(24px,7vw,38px)}
  .front{display:flex;background:linear-gradient(160deg,#1e293b,#0f172a);border:1px solid #2a3a55;color:#94a3b8;font-size:18px}
  .front::after{content:"?";font-weight:800}
  .back{display:none;background:linear-gradient(160deg,#312e81,#1e1b4b);border:1px solid #4c1d95;backface-visibility:visible;-webkit-backface-visibility:visible}
  .card.flipped .front,.card.matched .front{display:none}
  .card.flipped .back,.card.matched .back{display:flex}
  .card.matched .back{background:linear-gradient(160deg,#065f46,#064e3b);border-color:#10b981}
  .card.matched{animation:pop .32s ease}
  .card.shake{animation:shake .3s ease}
  @keyframes pop{50%{transform:scale(1.06)}}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .msg{
    width:100%;max-width:560px;min-height:24px;margin-top:10px;font-size:14px;color:var(--muted);
    text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  }
  .msg b{color:var(--txt)}
  .skip{
    font:inherit;font-size:12.5px;font-weight:700;border-radius:99px;padding:5px 12px;cursor:pointer;
    background:#1b2b47;color:var(--txt);border:1px solid #2f4468;
  }
  #ov{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;
    background:rgba(4,8,16,.85);backdrop-filter:blur(4px);z-index:9;
  }
  #ov.show{display:flex}
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;
    text-align:center;max-width:340px;width:100%;position:relative;z-index:2;
  }
  .panel h2{margin:0 0 8px;font-size:23px}
  .panel p{margin:0 0 4px;color:var(--muted);font-size:14.5px;line-height:1.6}
  .panel .btn{margin-top:16px;width:100%;padding:13px}
  .ver{color:#475569;font-size:11.5px;margin-top:12px}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:1;display:none}
  #fx.show{display:block}
  @media (max-height:620px){
    .stat span{font-size:9px}
    .stat b{font-size:15px}
    h1{font-size:15px}
  }

/* v1.6 — identidade visual premium e cartas com efeito 3D */
:root{--bg:#080d1c;--card:#111c34;--line:#2b3c61;--txt:#f2f5ff;--muted:#a5b3d0;--acc:#a78bfa}
body{background:radial-gradient(ellipse at 50% -15%,#403078 0,transparent 48%),radial-gradient(ellipse at 100% 55%,#123b55 0,transparent 38%),linear-gradient(145deg,#080d1c,#0b1428 58%,#10152d);padding-top:18px}
.top{max-width:620px;margin-bottom:15px;padding:9px 12px;border:1px solid #ffffff18;border-radius:17px;background:linear-gradient(120deg,#172541dd,#111a31dd);box-shadow:0 9px 28px #0005,inset 0 1px #ffffff12}
.back{width:38px;height:38px;display:grid;place-items:center;background:#ffffff0b;border:1px solid #ffffff16}
h1{font-size:clamp(18px,3vw,22px);font-weight:850;letter-spacing:-.5px;color:#f5f0ff;text-shadow:0 2px 16px #a78bfa44}
.icon-btn{border-color:#59618a;background:linear-gradient(145deg,#29375b,#17243f);box-shadow:0 3px 10px #0004}
.bar,.stats,.progress,.msg{max-width:620px}
.bar{gap:10px;margin-bottom:11px}
.bar select{flex:1;min-width:0;border-color:#45527b;background:linear-gradient(145deg,#1b2948,#111d36);box-shadow:0 4px 12px #0003;font-weight:700}
.bar .btn{min-width:128px;background:linear-gradient(120deg,#c4a7ff,#8c9bff 55%,#67d9e8);color:#171632;box-shadow:0 4px 0 #5552a0,0 7px 16px #0004;font-weight:900}
.stats{gap:9px;margin-bottom:11px}
.stat{padding:9px 7px 8px;border-radius:14px;border:1px solid #ffffff19;background:linear-gradient(145deg,#1b2946e8,#101a30e8);box-shadow:0 6px 17px #0003,inset 0 1px #ffffff10}
.stat span{font-size:9px;letter-spacing:1px;color:#aebce0}
.stat b{display:block;margin-top:2px;font-size:clamp(16px,3vw,21px);color:#f6f3ff;text-shadow:0 2px 12px #a78bfa30}
.stat b small{font-size:10px}
.progress{height:9px;margin-bottom:13px;padding:2px;border:1px solid #ffffff18;background:#111b31;box-shadow:inset 0 2px 5px #0007}
#fill{background:linear-gradient(90deg,#38e0ba,#8f8bff,#65d8f1);box-shadow:0 0 12px #8f8bff99}
#board{gap:clamp(6px,1.5vw,11px);padding:clamp(8px,1.8vw,13px);border:1px solid #ffffff25;border-radius:23px;background:linear-gradient(145deg,#172746d9,#101a31e8);box-shadow:0 18px 45px #0007,inset 0 1px #ffffff17,inset 0 -10px 30px #0003}
.card{border-radius:15px;filter:drop-shadow(0 5px 5px #0005);transition:filter .2s,transform .2s}
.card:hover{filter:drop-shadow(0 8px 8px #0007) brightness(1.08);transform:translateY(-2px)}
.inner{border-radius:15px;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.75,.2,1)}
.face{display:flex!important;border-radius:15px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:radial-gradient(circle at 50% 35%,#354b78,#1a2a4a 58%,#111d35);border:1px solid #7185bd;color:#c8d2f5;box-shadow:inset 0 1px #ffffff2b,inset 0 -8px 18px #080f20}
.front:before{content:"✦";position:absolute;top:13%;left:15%;font-size:clamp(10px,2vw,16px);color:#b8a3ff;opacity:.8}
.front:after{content:"✧";font-size:clamp(24px,6vw,38px);font-weight:900;color:#d8d0ff;text-shadow:0 0 15px #a78bfa;position:relative}
.back{display:flex!important;transform:rotateY(180deg);background:radial-gradient(circle at 35% 25%,#6654bd,#3d347f 55%,#211d50);border:1px solid #a99bff;box-shadow:inset 0 1px #ffffff35,inset 0 -9px 20px #141039;font-size:clamp(27px,7vw,43px);text-shadow:0 4px 10px #0005}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.card.flipped .front,.card.matched .front{display:flex!important}
.card.flipped .back,.card.matched .back{display:flex!important}
.card.matched{filter:drop-shadow(0 0 10px #35e5b899);animation:matchGlow .55s ease}
.card.matched .back{background:radial-gradient(circle at 35% 20%,#1cb88e,#08775f 62%,#064b43);border:1px solid #83f4d0;box-shadow:inset 0 1px #ffffff55,0 0 20px #2be2ae55}
@keyframes matchGlow{50%{transform:scale(1.07);filter:drop-shadow(0 0 16px #35e5b8)}}
.msg{min-height:38px;margin-top:13px;padding:8px 13px;border:1px solid #ffffff18;border-radius:99px;background:#111d35cc;color:#c3cce5;font-weight:650;box-shadow:0 5px 15px #0003}
.msg b{color:#fff}
.skip{background:#27395d;border-color:#6476a6}
.panel{background:radial-gradient(circle at 50% 0,#293d69,#111c34 65%);border:1px solid #a78bfa88;border-radius:23px;box-shadow:0 25px 75px #000b,inset 0 1px #ffffff22}
.panel h2{color:#f6efff;text-shadow:0 2px 16px #a78bfa55}
.panel .btn{background:linear-gradient(120deg,#c4a7ff,#8c9bff 55%,#67d9e8);color:#171632}
.ver{margin-top:15px;color:#7383a8;font-weight:700;letter-spacing:.7px}
@media(max-width:430px){
 body{padding:10px 9px 18px}.top{padding:7px 9px;margin-bottom:11px}.bar{gap:7px}.bar select,.bar .btn{padding:10px 9px;font-size:12px}.bar .btn{min-width:105px}
 .stats{gap:6px}.stat{padding:7px 4px;border-radius:11px}.stat span{font-size:8px;letter-spacing:.5px}.stat b{font-size:16px}
 #board{border-radius:17px;padding:7px;gap:6px}.card,.inner,.face{border-radius:10px}.msg{border-radius:13px;font-size:12px}
}
@media(prefers-reduced-motion:reduce){.inner,.card,.card.matched{transition:none;animation:none}}

</style>
</head>
<body>
  <div class="top">
    <a class="back" href="../index.html" title="Voltar">←</a>
    <h1>🧠 Jogo da Memória</h1>
    <button class="icon-btn" id="sound" aria-pressed="true" title="Som ligado" aria-label="Ligar ou desligar som">🔊</button>
  </div>

  <div class="bar">
    <select id="size" aria-label="Dificuldade">
      <option value="4x4">Fácil · 8 pares</option>
      <option value="5x4" selected>Médio · 10 pares</option>
      <option value="6x4">Difícil · 12 pares</option>
    </select>
    <button class="btn" id="new">Novo jogo</button>
  </div>

  <div class="stats">
    <div class="stat"><span>Jogadas</span><b id="moves">0</b></div>
    <div class="stat"><span>Tempo</span><b id="time">0:00</b></div>
    <div class="stat"><span>Pares</span><b id="pairs">0/10</b></div>
    <div class="stat"><span>Recorde</span><b id="best">—</b></div>
  </div>

  <div class="progress" aria-hidden="true"><div id="fill"></div></div>
  <div id="board"></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="ver">v1.6 · 24/11/2026</div>

  <div id="ov">
    <div class="panel">
      <h2 id="ovTitle">Parabéns! 🎉</h2>
      <p id="ovLine1"></p>
      <p id="ovLine2"></p>
      <button class="btn" id="ovBtn">Jogar de novo</button>
    </div>
  </div>
  <canvas id="fx"></canvas>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const board=$('board'),movesEl=$('moves'),timeEl=$('time'),pairsEl=$('pairs'),bestEl=$('best'),fill=$('fill'),msg=$('msg');
const size=$('size'),soundBtn=$('sound'),overlay=$('ov'),ovTitle=$('ovTitle'),ovLine1=$('ovLine1'),ovLine2=$('ovLine2'),fx=$('fx');
const SYMBOLS=['🍎','🚀','🐍','🎧','⚽','🌵','🍕','🐙','💎','🎲','🌈','🔥','🦊','🍩','🎯','🧩','🐳','🍀'];
let cols=5,rows=4,deck=[],cards=[],first=null,locked=false,moves=0,matched=0,seconds=0,timer=null,mismatchTimer=null,started=false,muted=false,audio=null,round=0;
function safeGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function safeSet(k,v){try{localStorage.setItem(k,String(v))}catch(e){}}
function audioTone(freq,duration=.08,type='sine'){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=audio||new AC();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function sound(kind){if(kind==='flip')audioTone(430,.045);if(kind==='match'){audioTone(650,.10);setTimeout(()=>audioTone(850,.11),70)}if(kind==='miss')audioTone(170,.10,'triangle');if(kind==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>audioTone(f,.18),i*100))}}
function keyBest(){return 'memoria.best.'+cols+'x'+rows}
function keyTime(){return 'memoria.time.'+cols+'x'+rows}
function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function paintSound(){soundBtn.textContent=muted?'🔇':'🔊';soundBtn.setAttribute('aria-pressed',String(!muted));soundBtn.title=muted?'Som desligado':'Som ligado'}
function paintBest(){const b=Number(safeGet(keyBest())||0),t=Number(safeGet(keyTime())||0);bestEl.innerHTML=b?b+' jog. <small>· '+fmt(t)+'</small>':'—'}
function stopClocks(){if(timer){clearInterval(timer);timer=null}if(mismatchTimer){clearTimeout(mismatchTimer);mismatchTimer=null}}
function startTimer(){if(started)return;started=true;timer=setInterval(()=>{seconds++;timeEl.textContent=fmt(seconds)},1000)}
function cardButton(item,index){
 const b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','Carta '+(index+1)+', fechada');b.dataset.index=String(index);
 b.innerHTML='<span class="inner"><span class="face front"></span><span class="face back">'+item.sym+'</span></span>';
 b.addEventListener('click',()=>flip(index));return b
}
function build(){
 round++;stopClocks();cols=Number(size.value.split('x')[0])||5;rows=Number(size.value.split('x')[1])||4;
 const pairCount=cols*rows/2,picked=shuffle(SYMBOLS.slice()).slice(0,pairCount);
 deck=shuffle(picked.concat(picked).map((sym,id)=>({sym,done:false,id})));
 first=null;locked=false;moves=0;matched=0;seconds=0;started=false;cards=[];
 movesEl.textContent='0';timeEl.textContent='0:00';pairsEl.textContent='0/'+pairCount;fill.style.width='0%';paintBest();
 overlay.classList.remove('show');fx.classList.remove('show');
 board.style.setProperty('--cols',String(cols));board.innerHTML='';
 deck.forEach((item,i)=>{const el=cardButton(item,i);board.appendChild(el);cards.push(el)});
 fitBoard();msg.textContent='Escolha duas cartas para encontrar os pares.';msg.setAttribute('role','status')
}
function fitBoard(){const ratio=cols/rows;const available=Math.max(260,window.innerHeight-260);board.style.maxWidth=Math.min(560,Math.floor(available*ratio))+'px'}
function flip(i){
 if(locked)return;const item=deck[i],card=cards[i];if(!item||item.done||card.classList.contains('flipped'))return;
 startTimer();card.classList.add('flipped');card.setAttribute('aria-label','Carta '+(i+1)+', '+item.sym);sound('flip');
 if(first===null){first=i;return}
 const prev=first;first=null;moves++;movesEl.textContent=String(moves);
 if(deck[prev].sym===item.sym){
  deck[prev].done=true;item.done=true;cards[prev].classList.add('matched');card.classList.add('matched');
  cards[prev].setAttribute('aria-label','Par encontrado '+item.sym);card.setAttribute('aria-label','Par encontrado '+item.sym);
  matched++;pairsEl.textContent=matched+'/'+(deck.length/2);fill.style.width=(matched/(deck.length/2)*100)+'%';msg.textContent='✅ Par encontrado! Continue assim.';sound('match');
  if(matched===deck.length/2)finish();
 }else{
  locked=true;const token=round;msg.textContent='Não combinou. Tente outra vez.';sound('miss');
  mismatchTimer=setTimeout(()=>{if(token!==round)return;[prev,i].forEach(n=>{if(!deck[n].done){cards[n].classList.remove('flipped');cards[n].setAttribute('aria-label','Carta '+(n+1)+', fechada')}});locked=false;mismatchTimer=null;msg.textContent='Escolha duas cartas para encontrar os pares.'},850)
 }
}
function finish(){
 stopClocks();const oldMoves=Number(safeGet(keyBest())||0),oldTime=Number(safeGet(keyTime())||0);let record=false;
 if(!oldMoves||moves<oldMoves){safeSet(keyBest(),moves);record=true}
 if(!oldTime||seconds<oldTime)safeSet(keyTime(),seconds);
 paintBest();sound('win');ovTitle.textContent=record?'Novo recorde! 🏆':'Parabéns! 🎉';
 ovLine1.textContent='Você encontrou todos os pares em '+moves+' jogadas e '+fmt(seconds)+'.';
 ovLine2.textContent=record?'Esse é o seu melhor resultado nesta dificuldade.':'Melhor resultado: '+(oldMoves?oldMoves+' jogadas · '+fmt(oldTime):'este resultado');
 overlay.classList.add('show');msg.textContent='🎉 Todos os pares encontrados!'
}
function celebrate(){}
$('new').addEventListener('click',build);$('ovBtn').addEventListener('click',build);size.addEventListener('change',build);
soundBtn.addEventListener('click',()=>{muted=!muted;safeSet('memoria.muted',muted?'1':'0');paintSound();if(!muted)sound('flip')});
window.addEventListener('resize',fitBoard);
muted=safeGet('memoria.muted')==='1';paintSound();build();
})();
</script>
<script src="../arcade-common.js"></script></body>
</html>
