<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Jogo da Memória — Jogos do Jhon v2.1</title>
<style>
:root{color-scheme:dark;--bg:#080e1b;--panel:#111d35;--line:#34496f;--text:#f4f6ff;--muted:#aebbd5;--violet:#8b7cf6;--cyan:#58d5e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100vh;min-height:100dvh;padding:14px 12px 28px;color:var(--text);background:radial-gradient(ellipse at 50% -10%,#453477 0,transparent 44%),radial-gradient(ellipse at 0 80%,#06465b66,transparent 45%),linear-gradient(145deg,#080e1b,#111b32 62%,#09182b);display:flex;flex-direction:column;align-items:center}
button,select{font:inherit}
.game-shell{width:100%;max-width:620px}
.top{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:12px;border:1px solid #ffffff24;border-radius:18px;background:linear-gradient(120deg,#1a2948,#101a30);box-shadow:0 10px 28px #0006}
.back-link,.sound-button{height:44px;width:44px;flex:0 0 44px;display:grid;place-items:center;border:1px solid #ffffff2c;border-radius:13px;background:#ffffff0b;color:#f5f3ff;text-decoration:none;font-size:23px}
.sound-button{cursor:pointer;font-size:20px}
h1{flex:1;min-width:0;margin:0;font-size:clamp(17px,4vw,23px);font-weight:850;letter-spacing:-.4px}
.controls{display:flex;gap:9px;margin-bottom:11px}
#difficulty{min-width:0;flex:1;padding:12px;border:1px solid #687ba8;border-radius:13px;background:#172744;color:#fff;font-weight:750}
.action-button{padding:12px 16px;border:0;border-radius:13px;background:linear-gradient(110deg,#bca3ff,#8799ff 58%,#69d7e5);color:#171632;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #4f4a89,0 8px 17px #0005}
.action-button:active{transform:translateY(2px);box-shadow:0 2px 0 #4f4a89}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:11px}
.stat{min-width:0;padding:9px 4px;border:1px solid #ffffff24;border-radius:14px;background:linear-gradient(145deg,#1a2a49,#101a30);text-align:center;box-shadow:0 5px 14px #0004}
.stat-label{display:block;color:var(--muted);font-size:10px;letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.stat-value{display:block;margin-top:2px;color:#fff;font-size:clamp(15px,4vw,21px);font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress{height:9px;padding:2px;margin-bottom:12px;border:1px solid #ffffff24;border-radius:99px;background:#0c1528;overflow:hidden}
#progressFill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#37dfb0,#a18bff,#62dbea);transition:width .2s ease}
.board-frame{width:100%;max-width:620px;padding:clamp(8px,2vw,13px);border:1px solid #a5b6e14d;border-radius:22px;background:linear-gradient(145deg,#1a2948ed,#101a30f5);box-shadow:0 18px 42px #0008,inset 0 1px #ffffff1b}
#memoryBoard{display:grid;width:100%;grid-template-columns:repeat(var(--columns,4),minmax(0,1fr));gap:clamp(7px,1.8vw,11px);align-items:stretch}
.memory-tile{display:flex!important;position:relative;align-items:center;justify-content:center;width:100%;min-width:0;min-height:0;height:auto;aspect-ratio:1 / 1;padding:0;margin:0;border:2px solid #b6caff;border-radius:13px;background:linear-gradient(145deg,#5274ad 0%,#304b7a 52%,#192d50 100%);color:#fff;box-shadow:inset 0 2px 5px #ffffff55,inset 0 -9px 17px #08152d88,0 5px 10px #0007;font-size:clamp(25px,7vw,45px);font-weight:900;text-shadow:0 0 10px #fff,0 0 20px #a78bfa;line-height:1;cursor:pointer;appearance:none;-webkit-appearance:none;overflow:hidden;touch-action:manipulation}
.memory-tile::before{content:"";position:absolute;inset:7px;border:1px solid #ffffff38;border-radius:8px;pointer-events:none}
.memory-tile:not(.is-open):not(.is-matched)::after{content:"✦";position:absolute;color:#e9e7ff;font-size:clamp(20px,5vw,31px);text-shadow:0 0 9px #fff,0 0 18px #9e8bff}
.memory-tile:not(.is-open):not(.is-matched){font-size:0}
.memory-tile.is-open,.memory-tile.is-matched{background:linear-gradient(145deg,#8d73e8,#5542a5 58%,#29205f);border-color:#e0d7ff;font-size:clamp(28px,7.5vw,49px);animation:tileReveal .2s ease-out}
.memory-tile.is-matched{background:linear-gradient(145deg,#4adea5,#087c68 68%,#064e49);border-color:#c2ffe5;box-shadow:0 0 0 2px #34d39955,0 0 19px #34d39966,inset 0 2px 6px #ffffff55}
.memory-tile:active{transform:scale(.97)}
.memory-tile:focus-visible{outline:3px solid #fef08a;outline-offset:3px}
@keyframes tileReveal{from{opacity:.55;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.message{min-height:48px;margin-top:13px;padding:11px 13px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid #ffffff24;border-radius:15px;background:#111d35;color:#dce7ff;font-weight:700;box-shadow:0 6px 16px #0004}
.version{margin-top:13px;text-align:center;color:#7e90b7;font-size:12px;font-weight:800;letter-spacing:.7px}
#resultOverlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:#050916dd;backdrop-filter:blur(7px)}
#resultOverlay.is-visible{display:flex}
.result-panel{width:min(100%,350px);padding:24px 20px;border:1px solid #ad9dff88;border-radius:22px;background:linear-gradient(155deg,#293d69,#111c34 72%);text-align:center;box-shadow:0 25px 70px #000c}
.result-panel h2{margin:0 0 10px;font-size:24px}
.result-panel p{margin:5px 0;color:#d6def2;line-height:1.5}
.result-panel .action-button{width:100%;margin-top:14px}
@media(max-width:390px){body{padding:10px 9px 22px}.top{padding:7px 8px;gap:8px}.back-link,.sound-button{width:40px;height:40px;flex-basis:40px}.controls{gap:7px}#difficulty,.action-button{padding:11px 9px;font-size:12px}.stats{gap:5px}.stat{padding:8px 2px;border-radius:11px}.stat-label{font-size:8px;letter-spacing:.4px}.board-frame{padding:7px;border-radius:17px}#memoryBoard{gap:6px}.memory-tile{border-radius:10px}.memory-tile::before{inset:5px;border-radius:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="game-shell">
  <header class="top">
    <a class="back-link" href="../index.html" aria-label="Voltar ao catálogo" title="Voltar">←</a>
    <h1>🧠 Jogo da Memória</h1>
    <button class="sound-button" id="soundButton" type="button" aria-label="Desligar som" aria-pressed="true">🔊</button>
  </header>
  <section class="controls" aria-label="Controles do jogo">
    <select id="difficulty" aria-label="Dificuldade">
      <option value="4x4" selected>Fácil · 8 pares</option>
      <option value="5x4">Médio · 10 pares</option>
      <option value="6x4">Difícil · 12 pares</option>
    </select>
    <button class="action-button" id="newGame" type="button">Novo jogo</button>
  </section>
  <section class="stats" aria-label="Placar">
    <div class="stat"><span class="stat-label">Jogadas</span><strong class="stat-value" id="moves">0</strong></div>
    <div class="stat"><span class="stat-label">Tempo</span><strong class="stat-value" id="time">0:00</strong></div>
    <div class="stat"><span class="stat-label">Pares</span><strong class="stat-value" id="pairs">0/8</strong></div>
    <div class="stat"><span class="stat-label">Recorde</span><strong class="stat-value" id="best">—</strong></div>
  </section>
  <div class="progress" role="progressbar" aria-label="Pares encontrados" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><div id="progressFill"></div></div>
  <section class="board-frame" aria-label="Tabuleiro">
    <div id="memoryBoard" style="--columns:4" aria-label="Cartas do jogo"></div>
  </section>
  <div class="message" id="message" role="status" aria-live="polite">Toque em duas cartas para encontrar os pares.</div>
  <div class="version">JOGOS DO JHON · v2.1 · 25/11/2026</div>
</main>
<div id="resultOverlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="result-panel">
    <h2 id="resultTitle">Parabéns! 🎉</h2>
    <p id="resultLine1"></p>
    <p id="resultLine2"></p>
    <button class="action-button" id="playAgain" type="button">Jogar novamente</button>
  </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const SYMBOLS=['🍎','🚀','🐍','🎧','⚽','🌵','🍕','🐙','💎','🎲','🌈','🔥','🦊','🍩','🎯','🧩','🐳','🍀'];
const difficulty=$('difficulty'),board=$('memoryBoard'),movesEl=$('moves'),timeEl=$('time'),pairsEl=$('pairs'),bestEl=$('best'),message=$('message'),progressFill=$('progressFill'),progress=progressFill.parentElement;
const overlay=$('resultOverlay'),resultTitle=$('resultTitle'),resultLine1=$('resultLine1'),resultLine2=$('resultLine2'),soundButton=$('soundButton');
let deck=[],tiles=[],firstChoice=null,locked=false,moves=0,matched=0,seconds=0,timer=null,hideTimer=null,round=0,started=false,muted=false,audioContext=null,totalPairs=8;
function safeGet(key){try{return localStorage.getItem(key)}catch(error){return null}}
function safeSet(key,value){try{localStorage.setItem(key,String(value))}catch(error){}}
function shuffle(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function formatTime(value){return Math.floor(value/60)+':'+String(value%60).padStart(2,'0')}
function bestKey(){return 'memoria.best.'+difficulty.value}
function bestTimeKey(){return 'memoria.time.'+difficulty.value}
function updateBest(){const b=Number(safeGet(bestKey())||0),t=Number(safeGet(bestTimeKey())||0);bestEl.textContent=b?b+' jog.':'—';bestEl.title=b?'Melhor tempo: '+formatTime(t):'Sem recorde ainda'}
function setMessage(text){message.textContent=text}
function stopTimers(){if(timer){clearInterval(timer);timer=null}if(hideTimer){clearTimeout(hideTimer);hideTimer=null}}
function startClock(){if(started)return;started=true;timer=setInterval(()=>{seconds++;timeEl.textContent=formatTime(seconds)},1000)}
function tone(freq,duration){if(muted)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioContext=audioContext||new AC();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(.035,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+duration)}catch(error){}}
function playSound(kind){if(kind==='flip')tone(420,.06);if(kind==='match'){tone(660,.10);setTimeout(()=>tone(840,.10),85)}if(kind==='miss')tone(180,.12);if(kind==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.16),i*95))}}
function paintSound(){soundButton.textContent=muted?'🔇':'🔊';soundButton.setAttribute('aria-pressed',String(!muted));soundButton.setAttribute('aria-label',muted?'Ligar som':'Desligar som')}
function buildGame(){
 round++;stopTimers();const cfg=difficulty.value.split('x').map(Number);const columns=cfg[0],rows=cfg[1];totalPairs=columns*rows/2;
 const chosen=shuffle(SYMBOLS).slice(0,totalPairs);deck=shuffle(chosen.concat(chosen));
 firstChoice=null;locked=false;moves=0;matched=0;seconds=0;started=false;tiles=[];
 movesEl.textContent='0';timeEl.textContent='0:00';pairsEl.textContent='0/'+totalPairs;progressFill.style.width='0%';progress.setAttribute('aria-valuemax',String(totalPairs));progress.setAttribute('aria-valuenow','0');
 board.style.setProperty('--columns',String(columns));board.replaceChildren();overlay.classList.remove('is-visible');updateBest();
 deck.forEach((symbol,index)=>{
  const tile=document.createElement('button');tile.type='button';tile.className='memory-tile';tile.textContent='✦';tile.setAttribute('aria-label','Carta '+(index+1)+', fechada');tile.dataset.index=String(index);
  tile.addEventListener('click',()=>chooseCard(index));board.appendChild(tile);tiles.push(tile);
 });
 setMessage('Toque em duas cartas para encontrar os pares.');
}
function chooseCard(index){
 if(locked)return;const tile=tiles[index];if(!tile||tile.classList.contains('is-open')||tile.classList.contains('is-matched'))return;
 startClock();tile.classList.add('is-open');tile.textContent=deck[index];tile.setAttribute('aria-label','Carta '+(index+1)+', '+deck[index]);playSound('flip');
 if(firstChoice===null){firstChoice=index;return}
 const previous=firstChoice;firstChoice=null;moves++;movesEl.textContent=String(moves);
 if(deck[previous]===deck[index]){
  [previous,index].forEach(i=>{tiles[i].classList.add('is-matched');tiles[i].setAttribute('aria-label','Par encontrado '+deck[i])});
  matched++;pairsEl.textContent=matched+'/'+totalPairs;progressFill.style.width=(matched/totalPairs*100)+'%';progress.setAttribute('aria-valuenow',String(matched));setMessage('Muito bem! Você encontrou um par.');playSound('match');
  if(matched===totalPairs)finishGame();
 }else{
  locked=true;const thisRound=round;setMessage('Não foi dessa vez. Tente outro par.');playSound('miss');
  hideTimer=setTimeout(()=>{
   if(thisRound!==round)return;
   [previous,index].forEach(i=>{tiles[i].classList.remove('is-open');tiles[i].textContent='✦';tiles[i].setAttribute('aria-label','Carta '+(i+1)+', fechada')});
   locked=false;hideTimer=null;setMessage('Toque em duas cartas para encontrar os pares.');
  },850);
 }
}
function finishGame(){
 stopTimers();const oldMoves=Number(safeGet(bestKey())||0),oldTime=Number(safeGet(bestTimeKey())||0);let record=false;
 if(!oldMoves||moves<oldMoves){safeSet(bestKey(),moves);record=true}
 if(!oldTime||seconds<oldTime)safeSet(bestTimeKey(),seconds);
 updateBest();playSound('win');resultTitle.textContent=record?'Novo recorde! 🏆':'Parabéns! 🎉';
 resultLine1.textContent='Você encontrou todos os pares em '+moves+' jogadas e '+formatTime(seconds)+'.';
 resultLine2.textContent=record?'Esse é seu melhor resultado nesta dificuldade.':'Recorde: '+(oldMoves?oldMoves+' jogadas · '+formatTime(oldTime):moves+' jogadas');
 overlay.classList.add('is-visible');setMessage('🎉 Todos os pares encontrados!');
}
$('newGame').addEventListener('click',buildGame);$('playAgain').addEventListener('click',buildGame);difficulty.addEventListener('change',buildGame);
soundButton.addEventListener('click',()=>{muted=!muted;safeSet('memoria.muted',muted?'1':'0');paintSound();if(!muted)playSound('flip')});
muted=safeGet('memoria.muted')==='1';paintSound();buildGame();
})();
</script>
</body>
</html>
