<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>Duelo de Reflexos · v1.0</title><style>
:root{--bg:#070b14;--panel:#101a2b;--line:#27364d;--text:#e5edf8;--muted:#9aa9bd;--cyan:#22d3ee;--violet:#a78bfa;--green:#34d399;--yellow:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 300px at 20% 0,#162b49,transparent),var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;padding:16px}main{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top a{color:var(--cyan);text-decoration:none}.version{color:var(--muted);font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}h1{margin:8px 0;font-size:clamp(25px,6vw,36px)}p{color:var(--muted)}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#17243a;color:var(--text);padding:11px 14px}button:hover{border-color:var(--cyan)}.primary{background:linear-gradient(120deg,#0e7490,#6d28d9);border:0;font-weight:700}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:100px;text-align:center;background:#0b1322;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px}.muted{color:var(--muted)}@media(max-width:520px){body{padding:10px}.panel{padding:12px}}
</style></head><body><main><div class="top"><a href="../index.html">← Arcade</a><span class="version">v1.0</span></div><h1>⚡ Duelo de Reflexos</h1><p>Dois jogadores, um celular! Aguarde o sinal verde e toque o seu botão o mais rápido possível. Não toque antes!</p><section class="panel"><div class="row"><label>Partida: <select id="rounds"><option value="5">Melhor de 5</option><option value="10">10 rodadas</option><option value="15">15 rodadas</option></select></label><button class="primary" id="start">Começar duelo</button></div><div class="stats"><div class="stat"><b id="score1">0</b>Jogador 1</div><div class="stat"><b id="round">0</b>Rodada</div><div class="stat"><b id="score2">0</b>Jogador 2</div></div><div id="arena" style="margin:15px 0;text-align:center;border:2px solid var(--line);border-radius:18px;padding:22px;background:#0b1322;min-height:120px"><h2 id="message">Prepare-se!</h2><p id="hint">Inicie a partida para jogar.</p></div><div class="row"><button id="p1" style="flex:1;min-height:90px;background:#164e63;font-size:22px">🔵 Jogador 1<br><small>TOQUE!</small></button><button id="p2" style="flex:1;min-height:90px;background:#4c1d95;font-size:22px">🟣 Jogador 2<br><small>TOQUE!</small></button></div><button id="reset" style="margin-top:12px">Reiniciar</button></section><script>
let scores=[0,0],round=0,total=5,state='idle',timer=null,goAt=0;const $=id=>document.getElementById(id);
function render(){ $('score1').textContent=scores[0];$('score2').textContent=scores[1];$('round').textContent=round+'/'+total}
function start(){clearTimeout(timer);scores=[0,0];round=0;total=+$('rounds').value;render();next()}
function next(){if(round>=total){state='end';$('message').textContent=scores[0]===scores[1]?'🤝 Empate!':scores[0]>scores[1]?'🏆 Jogador 1 venceu!':'🏆 Jogador 2 venceu!';$('hint').textContent='Partida encerrada. Revanche?';return}round++;render();state='wait';$('arena').style.background='#7f1d1d';$('message').textContent='🚫 NÃO TOQUE!';$('hint').textContent='Aguarde o sinal...';timer=setTimeout(()=>{state='go';goAt=performance.now();$('arena').style.background='#14532d';$('message').textContent='🟢 AGORA!';$('hint').textContent='Toque o botão mais rápido!'},1200+Math.random()*3500)}
function hit(player){if(state==='wait'){state='end';clearTimeout(timer);scores[1-player]++;render();$('message').textContent='⛔ Falsa largada!';$('hint').textContent='Ponto para o outro jogador.';setTimeout(next,1200)}else if(state==='go'){let ms=Math.round(performance.now()-goAt);state='end';scores[player]++;render();$('message').textContent='⚡ '+ms+' ms!';$('hint').textContent='Ponto para Jogador '+(player+1);setTimeout(next,1400)}}
$('start').onclick=start;$('p1').onclick=()=>hit(0);$('p2').onclick=()=>hit(1);$('reset').onclick=start;
</script></main><script src="../arcade-common.js"></script><div style="text-align:center;margin:12px 0"><a href="../index.html" style="color:#94a3b8;text-decoration:none;font-size:13px">← Voltar ao Jogos do Jhon</a></div></body></html>
