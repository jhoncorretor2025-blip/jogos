<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>Damas · Jogos do Jhon · v1.1</title>
<style>
:root{color-scheme:dark;--bg:#07111b;--panel:#101e2d;--line:#294158;--text:#edf6f8;--muted:#9bb1c2;--cyan:#45d9e8;--gold:#f6c96a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 14px 30px;background:radial-gradient(900px 520px at 50% -10%,#173c50,#07111b 70%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
.wrap{width:min(1050px,100%);margin:auto}header{text-align:center;margin:0 auto 16px}h1{font-size:clamp(25px,4vw,38px);margin:0 0 5px}header p{color:var(--muted);margin:0;font-size:14px}.version{display:inline-block;margin-top:8px;padding:4px 10px;border:1px solid #315064;border-radius:30px;color:#9fdce5;font-size:11px}
.panel{background:linear-gradient(145deg,#13273a,#0d1927);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px #0005}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:13px}.btn,select{border:1px solid #35516a;background:#14283a;color:var(--text);border-radius:11px;padding:10px 14px;font:600 13px system-ui;cursor:pointer}.btn.primary{background:linear-gradient(120deg,#0e7490,#155e75);border-color:#38bdf8}.btn:disabled{opacity:.4;cursor:not-allowed}.stat{background:#091521;border:1px solid #20384c;border-radius:12px;padding:8px 13px;text-align:center;color:var(--muted);font-size:12px}.stat b{color:#fff;font-size:17px;margin-left:5px}.message{margin:12px 0 0;padding:11px 13px;border-radius:11px;background:#0a1723;border:1px solid #20384c;color:#cbe5ed;font-size:13px;line-height:1.5;text-align:center;min-height:43px}.back{display:inline-block;margin-top:14px;color:#9edee8;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
button:focus-visible,select:focus-visible{outline:3px solid #67e8f9;outline-offset:2px}
@media(max-width:600px){body{padding:12px 8px 22px}.panel{padding:10px}.toolbar .btn{flex:1}.toolbar{gap:7px}}
</style></head><body><main class="wrap"><header><h1>♟️ Damas</h1><p>Capture as peças adversárias e coroe suas damas.</p><span class="version">Jogos do Jhon · v1.1</span></header><section class="panel"><div class="toolbar"><span class="stat">Vez <b id="turn">Vermelhas</b></span><span class="stat">Capturas <b id="captures">0 × 0</b></span><select id="opponent"><option value="cpu">Contra o computador</option><option value="local">2 jogadores</option></select><button class="btn primary" id="restart">Nova partida</button></div>
<style>
.checkers{width:min(620px,100%);margin:auto;display:grid;grid-template-columns:repeat(8,1fr);border:7px solid #68462e;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px #0006}.sq{aspect-ratio:1;display:grid;place-items:center;border:0;padding:0;position:relative}.light{background:#e7d5b5}.dark{background:#744b32;cursor:pointer}.sq.sel{outline:4px solid #45d9e8;outline-offset:-4px}.sq.hint::after{content:"";width:25%;height:25%;border-radius:50%;background:#8cf0c5;box-shadow:0 0 9px #8cf0c5}.piece{width:76%;height:76%;border-radius:50%;box-shadow:inset 0 3px 5px #fff8,inset 0 -6px 8px #0008,0 4px 5px #0008;border:3px solid #f2d9aa;display:grid;place-items:center;color:#fff;font-size:clamp(12px,2vw,22px);font-weight:900}.red{background:radial-gradient(circle at 30% 25%,#ff8c88,#b51f39 70%)}.black{background:radial-gradient(circle at 30% 25%,#8da3ae,#192735 70%)}.piece.king::after{content:"♛";text-shadow:0 2px 4px #000}
</style><div class="checkers" id="board" aria-label="Tabuleiro de damas"></div><div class="message" id="message" role="status" aria-live="polite">Bom jogo!</div></section><div style="text-align:center"><a class="back" href="../index.html">← Voltar ao Jogos do Jhon</a></div></main><script>(()=>{

// Web Audio API - Som Retrô
let audioCtx=null;function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}function tone(f,d,t='square',v=.05){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function sfxMove(){tone(220,.04,'square',.03)}function sfxClick(){tone(440,.08,'triangle',.05)}

const boardEl=document.getElementById('board'),msg=document.getElementById('message');let board=[],turn='r',selected=null,moves=[],captures={r:0,b:0},busy=false;
const dirs=p=>p.k?[-1,1]:[p.c==='r'?-1:1];
function init(){board=Array.from({length:8},()=>Array(8).fill(null));for(let y=0;y<3;y++)for(let x=0;x<8;x++)if((x+y)%2===1)board[y][x]={c:'b',k:false};for(let y=5;y<8;y++)for(let x=0;x<8;x++)if((x+y)%2===1)board[y][x]={c:'r',k:false};turn='r';selected=null;moves=[];captures={r:0,b:0};busy=false;render();say('Sua vez! Selecione uma peça vermelha.')}
function legalFor(color){const out=[];let anyCapture=false;for(let y=0;y<8;y++)for(let x=0;x<8;x++){const p=board[y][x];if(!p||p.c!==color)continue;for(const dy of dirs(p))for(const dx of [-1,1]){const ny=y+dy,nx=x+dx;if(ny>=0&&ny<8&&nx>=0&&nx<8&&!board[ny][nx])out.push({fx:x,fy:y,tx:nx,ty:ny,cap:null});const cy=y+dy,cx=x+dx,ty2=y+dy*2,tx2=x+dx*2;if(ty2>=0&&ty2<8&&tx2>=0&&tx2<8&&board[cy]?.[cx]&&board[cy][cx].c!==color&&!board[ty2][tx2]){out.push({fx:x,fy:y,tx:tx2,ty:ty2,cap:{x:cx,y:cy}});anyCapture=true}}}return anyCapture?out.filter(m=>m.cap):out}
function capturesFrom(x,y){const p=board[y][x];if(!p)return[];const out=[];for(const dy of dirs(p))for(const dx of [-1,1]){const cx=x+dx,cy=y+dy,tx=x+dx*2,ty=y+dy*2;if(tx>=0&&tx<8&&ty>=0&&ty<8&&board[cy]?.[cx]&&board[cy][cx].c!==p.c&&!board[ty][tx])out.push({fx:x,fy:y,tx,ty,cap:{x:cx,y:cy}})}return out}
function render(){boardEl.innerHTML='';const legal=selected?moves.filter(m=>m.fx===selected.x&&m.fy===selected.y):[];for(let y=0;y<8;y++)for(let x=0;x<8;x++){const sq=document.createElement('button');sq.type='button';sq.className='sq '+((x+y)%2?'dark':'light');sq.dataset.x=x;sq.dataset.y=y;if(selected&&selected.x===x&&selected.y===y)sq.classList.add('sel');if(legal.some(m=>m.tx===x&&m.ty===y))sq.classList.add('hint');const p=board[y][x];if(p){const d=document.createElement('span');d.className='piece '+(p.c==='r'?'red':'black')+(p.k?' king':'');sq.appendChild(d)}boardEl.appendChild(sq)}document.getElementById('turn').textContent=turn==='r'?'Vermelhas':'Pretas';document.getElementById('captures').textContent=captures.r+' × '+captures.b}
function say(s){msg.textContent=s}
function endTurn(){turn=turn==='r'?'b':'r';selected=null;moves=[];const legal=legalFor(turn);if(!legal.length){say((turn==='r'?'Vermelhas':'Pretas')+' sem movimentos. '+(turn==='r'?'Pretas':'Vermelhas')+' venceram!');render();return}render();if(turn==='b'&&document.getElementById('opponent').value==='cpu'){busy=true;setTimeout(cpuMove,550)}else say(turn==='r'?'Sua vez! Selecione uma peça vermelha.':'Vez das pretas.')}
function makeMove(m){const p=board[m.fy][m.fx];board[m.fy][m.fx]=null;board[m.ty][m.tx]=p;if(m.cap){board[m.cap.y][m.cap.x]=null;captures[p.c]++;if((p.c==='r'&&m.ty===0)||(p.c==='b'&&m.ty===7))p.k=true;const more=capturesFrom(m.tx,m.ty);if(more.length){selected={x:m.tx,y:m.ty};moves=more;render();say('Outra captura obrigatória com a mesma peça.');return false}}if((p.c==='r'&&m.ty===0)||(p.c==='b'&&m.ty===7))p.k=true;endTurn();return true}
function cpuMove(){if(turn!=='b')return;const options=selected?capturesFrom(selected.x,selected.y):legalFor('b');if(!options.length){busy=false;endTurn();return}options.sort((a,b)=>Number(!!b.cap)-Number(!!a.cap)+(Math.random()-.5));makeMove(options[0]);if(turn==='b'&&selected){setTimeout(cpuMove,450)}else busy=false}
boardEl.addEventListener('click',e=>{if(busy||turn==='b'&&document.getElementById('opponent').value==='cpu')return;const sq=e.target.closest('.sq');if(!sq)return;const x=+sq.dataset.x,y=+sq.dataset.y,p=board[y][x];if(selected){const m=moves.find(m=>m.tx===x&&m.ty===y);if(m){makeMove(m);return}if(moves.some(m=>m.cap)){say('Você precisa continuar a sequência de captura com a mesma peça.');return}}if(p&&p.c===turn){selected={x,y};moves=legalFor(turn).filter(m=>m.fx===x&&m.fy===y);render();say(moves.length?'Movimentos possíveis destacados.':'Essa peça não tem movimento disponível.');return}selected=null;moves=[];render()});
document.getElementById('restart').addEventListener('click',init);document.getElementById('opponent').addEventListener('change',init);init();
})();</script><script src="../arcade-common.js"></script></body></html>
