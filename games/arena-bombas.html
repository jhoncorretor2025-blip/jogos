<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1a"><title>Arena de Bombas · Jogos do Jhon · v1.0</title><style>:root{color-scheme:dark;--bg:#080d1a;--line:#263750;--txt:#edf5ff;--muted:#9fb0c8;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(900px 450px at 12% -10%,#12334a 0,transparent 65%),radial-gradient(750px 430px at 100% 0,#291a4b 0,transparent 65%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}.wrap{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:11px}.brand .emoji{font-size:34px}.brand h1{font-size:clamp(20px,4vw,30px);margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.ver{display:inline-block;color:#9fb0c8;font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:99px;margin-top:6px}.back{color:#a5f3fc;text-decoration:none;border:1px solid #276078;background:#0b2635;padding:10px 13px;border-radius:11px;font-weight:700;font-size:13px}.panel{background:linear-gradient(145deg,#142139,#0d1729);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 40px #0004}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}.stat{background:#091321;border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:88px;text-align:center}.stat b{display:block;font-size:18px}.stat small{display:block;color:var(--muted);font-size:10px}.btn{border:1px solid #35506d;background:#172944;color:#eff8ff;border-radius:10px;padding:10px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#087e98,#5b3bab);border-color:#4b9ab0}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto 2px;max-width:700px}.game{display:flex;align-items:center;justify-content:center;min-height:260px;overflow:hidden}.message{text-align:center;color:#a5f3fc;font-weight:800;min-height:25px;margin:8px 0}canvas{display:block;max-width:100%;border-radius:12px;background:#07111e;touch-action:none}.touch{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px}.touch .btn{min-width:54px;min-height:46px}canvas{width:min(100%,462px);background:#142b2b;border:1px solid #3b6a5a}@media(max-width:560px){body{padding:10px}.panel{padding:10px}.back{padding:8px 10px}.stat{min-width:72px;padding:7px}.stat b{font-size:16px}}</style></head><body><main class="wrap"><header><div class="brand"><span class="emoji">💣</span><div><h1>Arena de Bombas</h1><p>Abra caminho com explosões e derrote os robôs.</p><span class="ver">Jogos do Jhon · v1.0</span></div></div><a class="back" href="../index.html">← Catálogo</a></header><section class="panel"><div class="toolbar"><div class="stat"><b id="score">0</b><small>PONTOS</small></div><div class="stat"><b id="lives">3</b><small>VIDAS</small></div><div class="stat"><b id="leftCount">4</b><small>INIMIGOS</small></div><button class="btn primary" id="start">▶ Nova partida</button><button class="btn" id="bomb">💣 Bomba</button></div><div class="game"><canvas id="c" width="462" height="378"></canvas></div><div class="touch"><button class="btn" data-m="up">▲</button><button class="btn" data-m="left">◀</button><button class="btn" data-m="down">▼</button><button class="btn" data-m="right">▶</button></div><p class="message" id="msg">WASD ou setas para mover. Espaço para plantar bomba.</p><p class="note">As explosões avançam em cruz, destroem caixas e derrotam inimigos. Não fique na linha da explosão!</p></section></main><script>(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),msg=document.getElementById('msg'),S=42,C=11,R=9;let map,player,enemies,bombs,flashes,score,lives,playing=false,lastEnemy=0,raf=0,keys={};
function reset(){map=Array.from({length:R},(_,y)=>Array.from({length:C},(_,x)=>(x===0||y===0||x===C-1||y===R-1||(x%2===0&&y%2===0))?1:(Math.random()<.26?2:0)));map[1][1]=map[1][2]=map[2][1]=map[2][2]=0;player={x:1,y:1};enemies=[];for(let i=0;i<4;i++){let pos;do{pos={x:7+Math.floor(Math.random()*3),y:1+Math.floor(Math.random()*7)}}while(map[pos.y][pos.x]);enemies.push(pos)}bombs=[];flashes=[];score=0;lives=3;updateHud();draw()}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('leftCount').textContent=enemies.length}
function tile(x,y){return map[y]&&map[y][x]===0}
function move(dx,dy){if(!playing)return;let nx=player.x+dx,ny=player.y+dy;if(tile(nx,ny)&&!bombs.some(b=>b.x===nx&&b.y===ny)){player.x=nx;player.y=ny;draw()}}
function plant(){if(!playing||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:performance.now()+1450});draw()}
function explode(b){let cells=[[b.x,b.y]];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let n=1;n<=2;n++){let x=b.x+dx*n,y=b.y+dy*n;if(map[y][x]===1)break;cells.push([x,y]);if(map[y][x]===2){map[y][x]=0;score+=5;break}}cells.forEach(([x,y])=>{enemies=enemies.filter(e=>e.x!==x||e.y!==y);if(player.x===x&&player.y===y){lives--;if(lives<=0){playing=false;msg.textContent='💥 Você foi atingido! Fim de jogo.'}else{player={x:1,y:1};msg.textContent='Cuidado! Você perdeu uma vida.'}}});score+=cells.filter(([x,y])=>x===b.x&&y===b.y).length*0;flashes.push({cells,t:performance.now()+300});updateHud()}
function draw(){ctx.clearRect(0,0,c.width,c.height);for(let y=0;y<R;y++)for(let x=0;x<C;x++){ctx.fillStyle=map[y][x]===1?'#334155':map[y][x]===2?'#98613c':'#24534a';ctx.fillRect(x*S,y*S,S-2,S-2);if(map[y][x]===2){ctx.fillStyle='#d7a16a';ctx.fillRect(x*S+7,y*S+7,S-16,S-16)}}flashes.forEach(f=>f.cells.forEach(([x,y])=>{ctx.fillStyle='#fb923c99';ctx.fillRect(x*S,y*S,S-2,S-2)}));bombs.forEach(b=>{ctx.beginPath();ctx.arc(b.x*S+21,b.y*S+21,14,0,7);ctx.fillStyle='#101010';ctx.fill();ctx.fillStyle='#fbbf24';ctx.fillRect(b.x*S+20,b.y*S+3,4,7)});enemies.forEach(e=>{ctx.fillStyle='#fb7185';ctx.fillRect(e.x*S+6,e.y*S+7,28,27);ctx.fillStyle='#111827';ctx.fillRect(e.x*S+12,e.y*S+14,5,5);ctx.fillRect(e.x*S+24,e.y*S+14,5,5)});ctx.fillStyle='#38bdf8';ctx.fillRect(player.x*S+7,player.y*S+6,27,30);ctx.fillStyle='#082f49';ctx.fillRect(player.x*S+13,player.y*S+12,5,5);ctx.fillRect(player.x*S+24,player.y*S+12,5,5)}
function tick(now){if(!playing)return;bombs=bombs.filter(b=>{if(now>=b.t){explode(b);return false}return true});if(now-lastEnemy>650){lastEnemy=now;enemies.forEach(e=>{let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>tile(e.x+dx,e.y+dy));if(opts.length){let [dx,dy]=opts[Math.floor(Math.random()*opts.length)];e.x+=dx;e.y+=dy}if(e.x===player.x&&e.y===player.y){lives--;player={x:1,y:1};if(lives<=0){playing=false;msg.textContent='Os robôs te pegaram! Fim de jogo.'}}})}if(enemies.length===0&&playing){playing=false;score+=100;msg.textContent='🏆 Arena limpa! Você venceu: +100 pontos.'}flashes=flashes.filter(f=>f.t>now);updateHud();draw();if(playing)raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);reset();playing=true;lastEnemy=performance.now();msg.textContent='Sobreviva e elimine todos os robôs!';tick(performance.now())}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),mapKeys={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(mapKeys[k]){move(...mapKeys[k]);e.preventDefault()}if(k===' '){plant();e.preventDefault()}});document.getElementById('bomb').onclick=plant;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({up:()=>move(0,-1),down:()=>move(0,1),left:()=>move(-1,0),right:()=>move(1,0)}[b.dataset.m])());document.getElementById('start').onclick=start;reset();})();</script></body></html>
