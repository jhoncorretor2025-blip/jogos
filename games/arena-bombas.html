<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1a"><title>Arena de Bombas · Jogos do Jhon · v1.2</title><style>:root{color-scheme:dark;--bg:#080d1a;--line:#263750;--txt:#edf5ff;--muted:#9fb0c8;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(900px 450px at 12% -10%,#12334a 0,transparent 65%),radial-gradient(750px 430px at 100% 0,#291a4b 0,transparent 65%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}.wrap{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:11px}.brand .emoji{font-size:34px}.brand h1{font-size:clamp(20px,4vw,30px);margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.ver{display:inline-block;color:#9fb0c8;font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:99px;margin-top:6px}.back{color:#a5f3fc;text-decoration:none;border:1px solid #276078;background:#0b2635;padding:10px 13px;border-radius:11px;font-weight:700;font-size:13px}.panel{background:linear-gradient(145deg,#142139,#0d1729);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 40px #0004}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}.stat{background:#091321;border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:88px;text-align:center}.stat b{display:block;font-size:18px}.stat small{display:block;color:var(--muted);font-size:10px}.btn{border:1px solid #35506d;background:#172944;color:#eff8ff;border-radius:10px;padding:10px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#087e98,#5b3bab);border-color:#4b9ab0}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto 2px;max-width:700px}.game{display:flex;align-items:center;justify-content:center;min-height:260px;overflow:hidden}.message{text-align:center;color:#a5f3fc;font-weight:800;min-height:25px;margin:8px 0}canvas{display:block;max-width:100%;border-radius:12px;background:#07111e;touch-action:none}.touch{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:10px}.touch .btn{min-width:54px;min-height:46px}canvas{width:min(100%,462px);background:#142b2b;border:1px solid #3b6a5a}@media(max-width:560px){body{padding:10px}.panel{padding:10px}.back{padding:8px 10px}.stat{min-width:72px;padding:7px}.stat b{font-size:16px}}.panel{background:radial-gradient(ellipse at 50% 0%,#18463b,#0d1c2b 78%);border-color:#2f6653}.game canvas{border:2px solid #3d765c;box-shadow:inset 0 0 25px #061b13,0 14px 30px #0009}.touch .btn{background:linear-gradient(145deg,#1e4750,#102b36);border-color:#39717a;box-shadow:inset 0 1px #ffffff22,0 4px 8px #0004}</style></head><body data-arcade-controls="joystick" data-arcade-repeat="true"><main class="wrap"><header><div class="brand"><span class="emoji">💣</span><div><h1>Arena de Bombas</h1><p>Abra caminho com explosões e derrote os robôs.</p><span class="ver">Jogos do Jhon · v1.2</span></div></div><a class="back" href="../index.html">← Catálogo</a></header><section class="panel"><div class="toolbar"><div class="stat"><b id="score">0</b><small>PONTOS</small></div><div class="stat"><b id="lives">3</b><small>VIDAS</small></div><div class="stat"><b id="leftCount">4</b><small>INIMIGOS</small></div><button class="btn primary" id="start">▶ Nova partida</button><button class="btn" id="bomb">💣 Bomba</button></div><div class="game"><canvas id="c" width="462" height="378"></canvas></div><div class="touch"><button class="btn" data-m="up">▲</button><button class="btn" data-m="left">◀</button><button class="btn" data-m="down">▼</button><button class="btn" data-m="right">▶</button></div><p class="message" id="msg">WASD ou setas para mover. Espaço para plantar bomba.</p><p class="note">As explosões avançam em cruz, destroem caixas e derrotam inimigos. Não fique na linha da explosão!</p></section></main><script>(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),msg=document.getElementById('msg'),S=42,C=11,R=9;let map,player,enemies,bombs,flashes,score,lives,playing=false,lastEnemy=0,raf=0,keys={},invulnUntil=0;
function reset(){map=Array.from({length:R},(_,y)=>Array.from({length:C},(_,x)=>(x===0||y===0||x===C-1||y===R-1||(x%2===0&&y%2===0))?1:(Math.random()<.26?2:0)));map[1][1]=map[1][2]=map[2][1]=map[2][2]=0;player={x:1,y:1};invulnUntil=0;enemies=[];for(let i=0;i<4;i++){let pos;do{pos={x:7+Math.floor(Math.random()*3),y:1+Math.floor(Math.random()*7)}}while(map[pos.y][pos.x]);enemies.push(pos)}bombs=[];flashes=[];score=0;lives=3;updateHud();draw()}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('leftCount').textContent=enemies.length}
function tile(x,y){return !!(map[y]&&map[y][x]===0)}function occupiedByBomb(x,y){return bombs.some(b=>b.x===x&&b.y===y)}function hurtPlayer(now){if(now<invulnUntil||!playing)return;lives--;invulnUntil=now+1300;if(lives<=0){playing=false;msg.textContent='💥 Você perdeu todas as vidas! Fim de jogo.'}else{player={x:1,y:1};msg.textContent='Cuidado! Você perdeu uma vida. Proteção temporária ativada.'}updateHud()}
function move(dx,dy){if(!playing)return;let nx=player.x+dx,ny=player.y+dy;if(tile(nx,ny)&&!occupiedByBomb(nx,ny)){player.x=nx;player.y=ny;draw()}}
function plant(){if(!playing||bombs.some(b=>b.x===player.x&&b.y===player.y))return;bombs.push({x:player.x,y:player.y,t:performance.now()+1450});draw()}
function explode(b){let cells=[[b.x,b.y]];for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])for(let n=1;n<=2;n++){let x=b.x+dx*n,y=b.y+dy*n;if(map[y][x]===1)break;cells.push([x,y]);if(map[y][x]===2){map[y][x]=0;score+=5;break}}cells.forEach(([x,y])=>{const before=enemies.length;enemies=enemies.filter(e=>e.x!==x||e.y!==y);if(enemies.length<before)score+=50;if(player.x===x&&player.y===y)hurtPlayer(performance.now())});score+=cells.filter(([x,y])=>x===b.x&&y===b.y).length*0;flashes.push({cells,t:performance.now()+300});updateHud()}
function draw(){ctx.clearRect(0,0,c.width,c.height);let bg=ctx.createLinearGradient(0,0,0,c.height);bg.addColorStop(0,'#1b463d');bg.addColorStop(1,'#0b2726');ctx.fillStyle=bg;ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<R;y++)for(let x=0;x<C;x++){let px=x*S,py=y*S;ctx.fillStyle=(x+y)%2?'#ffffff08':'#001b1640';ctx.fillRect(px,py,S-1,S-1);ctx.strokeStyle='#a7f3d015';ctx.strokeRect(px+2,py+2,S-5,S-5);if(map[y][x]===1){let g=ctx.createLinearGradient(px,py,px+S,py+S);g.addColorStop(0,'#84939a');g.addColorStop(.45,'#43545c');g.addColorStop(1,'#263640');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(px+2,py+2,S-5,S-5,5);ctx.fill();ctx.strokeStyle='#cbd5e155';ctx.stroke();ctx.fillStyle='#dbeafe66';ctx.fillRect(px+7,py+7,12,3);ctx.fillStyle='#17232b';ctx.fillRect(px+6,py+S-10,S-14,3)}else if(map[y][x]===2){let g=ctx.createLinearGradient(px,py,px,py+S);g.addColorStop(0,'#d99a54');g.addColorStop(1,'#713d20');ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(px+4,py+4,S-9,S-9,4);ctx.fill();ctx.strokeStyle='#f8c17d';ctx.stroke();ctx.fillStyle='#522d1c';ctx.fillRect(px+5,py+18,S-11,5);ctx.fillStyle='#f6c58b';ctx.fillRect(px+9,py+8,3,20);ctx.fillRect(px+S-12,py+8,3,20)}}flashes.forEach(f=>f.cells.forEach(([x,y])=>{let px=x*S,py=y*S,g=ctx.createRadialGradient(px+21,py+21,2,px+21,py+21,31);g.addColorStop(0,'#fff8b8');g.addColorStop(.35,'#fbbf24dd');g.addColorStop(1,'#f9731600');ctx.fillStyle=g;ctx.fillRect(px-4,py-4,S+7,S+7)}));bombs.forEach(b=>{let pulse=1+Math.sin(performance.now()/75)*.08,px=b.x*S+21,py=b.y*S+21;ctx.save();ctx.shadowColor='#fb923c';ctx.shadowBlur=18;let g=ctx.createRadialGradient(px-5,py-7,2,px,py,16);g.addColorStop(0,'#64748b');g.addColorStop(.35,'#1e293b');g.addColorStop(1,'#020617');ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,14*pulse,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#94a3b8';ctx.lineWidth=2;ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(px+4,py-13,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7ed';ctx.beginPath();ctx.arc(px+5,py-16,2,0,Math.PI*2);ctx.fill();ctx.restore()});enemies.forEach(e=>{let px=e.x*S+21,py=e.y*S+21;ctx.save();ctx.shadowColor='#fb7185';ctx.shadowBlur=11;ctx.fillStyle='#571c33';ctx.beginPath();ctx.roundRect(px-15,py-14,30,28,8);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#fb7185';ctx.beginPath();ctx.roundRect(px-12,py-16,24,25,7);ctx.fill();ctx.fillStyle='#111827';ctx.fillRect(px-8,py-7,5,6);ctx.fillRect(px+3,py-7,5,6);ctx.fillStyle='#fff1f2';ctx.fillRect(px-7,py-6,2,2);ctx.fillRect(px+4,py-6,2,2);ctx.strokeStyle='#fecdd3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py-16);ctx.lineTo(px,py-22);ctx.stroke();ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(px,py-23,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#7f1d1d';ctx.fillRect(px-15,py+12,30,5);ctx.restore()});let px=player.x*S+21,py=player.y*S+21;ctx.save();ctx.shadowColor='#38bdf8';ctx.shadowBlur=13;ctx.fillStyle='#075985';ctx.beginPath();ctx.roundRect(px-15,py-14,30,30,9);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.roundRect(px-12,py-17,24,26,8);ctx.fill();ctx.fillStyle='#bae6fd';ctx.beginPath();ctx.arc(px,py-7,10,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#082f49';ctx.fillRect(px-7,py-4,5,6);ctx.fillRect(px+2,py-4,5,6);ctx.fillStyle='#f8fafc';ctx.fillRect(px-6,py-3,2,2);ctx.fillRect(px+3,py-3,2,2);ctx.fillStyle='#fbbf24';ctx.fillRect(px-14,py+9,10,5);ctx.fillRect(px+4,py+9,10,5);ctx.restore();if(performance.now()<invulnUntil){ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.arc(player.x*S+21,player.y*S+21,19,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#d1fae5aa';ctx.font='bold 10px system-ui';ctx.fillText('BOMBER ARENA',8,14)}
function tick(now){if(!playing)return;bombs=bombs.filter(b=>{if(now>=b.t){explode(b);return false}return true});if(now-lastEnemy>650){lastEnemy=now;enemies.forEach(e=>{if(!playing)return;let opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>tile(e.x+dx,e.y+dy)&&!occupiedByBomb(e.x+dx,e.y+dy));if(opts.length){let [dx,dy]=opts[Math.floor(Math.random()*opts.length)];e.x+=dx;e.y+=dy}if(e.x===player.x&&e.y===player.y)hurtPlayer(now)})}if(enemies.length===0&&playing){playing=false;score+=100;msg.textContent='🏆 Arena limpa! Você venceu: +100 pontos.'}flashes=flashes.filter(f=>f.t>now);updateHud();draw();if(playing)raf=requestAnimationFrame(tick)}
function start(){cancelAnimationFrame(raf);reset();playing=true;lastEnemy=performance.now();msg.textContent='Sobreviva e elimine todos os robôs!';tick(performance.now())}
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),mapKeys={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(mapKeys[k]){move(...mapKeys[k]);e.preventDefault()}if(k===' '){plant();e.preventDefault()}});document.getElementById('bomb').onclick=plant;document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({up:()=>move(0,-1),down:()=>move(0,1),left:()=>move(-1,0),right:()=>move(1,0)}[b.dataset.m])());document.getElementById('start').onclick=start;reset();})();</script><script src="../arcade-common.js"></script></body></html>
