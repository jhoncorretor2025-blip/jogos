<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1a"><title>Arkanoid · Jogos do Jhon · v1.1</title><style>
:root{color-scheme:dark;--bg:#080d1a;--panel:#111c30;--line:#263750;--txt:#edf5ff;--muted:#9fb0c8;--cyan:#22d3ee;--purple:#a78bfa;--green:#34d399;--gold:#fbbf24}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:16px;background:radial-gradient(900px 450px at 12% -10%,#12334a 0,transparent 65%),radial-gradient(750px 430px at 100% 0,#291a4b 0,transparent 65%),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center}.wrap{width:min(100%,960px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:11px}.brand .emoji{font-size:34px}.brand h1{font-size:clamp(20px,4vw,30px);margin:0}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.ver{display:inline-block;color:#9fb0c8;font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:99px;margin-top:6px}.back{color:#a5f3fc;text-decoration:none;border:1px solid #276078;background:#0b2635;padding:10px 13px;border-radius:11px;font-weight:700;font-size:13px}.panel{background:linear-gradient(145deg,#142139,#0d1729);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 12px 40px #0004}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:12px}.stat{background:#091321;border:1px solid var(--line);border-radius:11px;padding:8px 12px;min-width:88px;text-align:center}.stat b{display:block;font-size:18px}.stat small{display:block;color:var(--muted);font-size:10px}.btn,select{border:1px solid #35506d;background:#172944;color:#eff8ff;border-radius:10px;padding:10px 13px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.primary{background:linear-gradient(100deg,#087e98,#5b3bab);border-color:#4b9ab0}.btn:active{transform:scale(.98)}.note{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin:12px auto 2px;max-width:700px}.game{display:flex;align-items:center;justify-content:center;min-height:260px;overflow:hidden}canvas{display:block;max-width:100%;border-radius:12px;background:#07111e;touch-action:none}.message{text-align:center;color:#a5f3fc;font-weight:800;min-height:25px;margin:8px 0}canvas{width:min(100%,560px);border:1px solid #23405b;background:linear-gradient(#0a1830,#07111d)}
@media(max-width:560px){body{padding:10px}.panel{padding:10px}.back{padding:8px 10px}.stat{min-width:72px;padding:7px}.stat b{font-size:16px}}.panel{background:radial-gradient(ellipse at 50% 0%,#172e54,#0d1729 78%);border-color:#31547d;box-shadow:0 18px 48px #0008}.game canvas{box-shadow:inset 0 0 28px #22d3ee13,0 12px 28px #0007}</style></head><body><main class="wrap"><header><div class="brand"><span class="emoji">🧱</span><div><h1>Arkanoid</h1><p>Quebre todos os blocos sem deixar a bolinha cair.</p><span class="ver">Jogos do Jhon · v1.0</span></div></div><a class="back" href="../index.html">← Catálogo</a></header><section class="panel"><div class="toolbar"><div class="stat"><b id="score">0</b><small>PONTOS</small></div><div class="stat"><b id="lives">3</b><small>VIDAS</small></div><div class="stat"><b id="level">1</b><small>FASE</small></div><button class="btn primary" id="start">▶ Iniciar / continuar</button><button class="btn" id="restart">↻ Reiniciar</button></div><div class="game"><canvas id="c" width="560" height="440" aria-label="Jogo Arkanoid"></canvas></div><p class="message" id="msg">Use ← →, A/D ou arraste a plataforma. Clique em iniciar.</p><p class="note">Destrua todos os blocos. A cada fase a bola fica um pouco mais rápida. No celular, arraste o dedo para mover a plataforma.</p></section></main><script>(()=>{'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),msg=document.getElementById('msg');let paddle,ball,bricks,score=0,lives=3,level=1,running=false,raf=null;function setup(){paddle={x:230,y:414,w:100,h:12};ball={x:280,y:395,r:7,dx:2.5+level*.3,dy:-3.5-level*.25};bricks=[];for(let r=0;r<4+Math.min(level,3);r++)for(let col=0;col<9;col++)bricks.push({x:10+col*60,y:35+r*24,w:54,h:16,on:true,color:['#38bdf8','#a78bfa','#34d399','#fbbf24','#fb7185'][r%5]})}
function draw(){x.clearRect(0,0,560,440);let bg=x.createLinearGradient(0,0,0,440);bg.addColorStop(0,'#101f40');bg.addColorStop(.55,'#0b1730');bg.addColorStop(1,'#07101d');x.fillStyle=bg;x.fillRect(0,0,560,440);x.strokeStyle='#5eead411';for(let y=0;y<440;y+=22){x.beginPath();x.moveTo(0,y);x.lineTo(560,y);x.stroke()}x.fillStyle='#67e8f911';x.fillRect(0,390,560,50);bricks.forEach(b=>{if(!b.on)return;let g=x.createLinearGradient(b.x,b.y,b.x,b.y+b.h);g.addColorStop(0,'#ffffff');g.addColorStop(.18,b.color);g.addColorStop(1,'#14253f');x.fillStyle=g;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,5);x.fill();x.strokeStyle=b.color;x.lineWidth=1.3;x.stroke();x.fillStyle='#ffffff66';x.fillRect(b.x+5,b.y+3,b.w-10,2);x.fillStyle='#0005';x.fillRect(b.x+5,b.y+b.h-3,b.w-10,2)});let pg=x.createLinearGradient(paddle.x,paddle.y,paddle.x,paddle.y+16);pg.addColorStop(0,'#e0fbff');pg.addColorStop(.25,'#22d3ee');pg.addColorStop(1,'#075985');x.shadowColor='#22d3ee';x.shadowBlur=18;x.fillStyle=pg;x.beginPath();x.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,7);x.fill();x.shadowBlur=0;x.fillStyle='#e0faff';x.fillRect(paddle.x+12,paddle.y+3,paddle.w-24,2);let glow=x.createRadialGradient(ball.x-2,ball.y-3,1,ball.x,ball.y,ball.r*2.8);glow.addColorStop(0,'#fff');glow.addColorStop(.35,'#cffafe');glow.addColorStop(1,'#22d3ee00');x.fillStyle=glow;x.beginPath();x.arc(ball.x,ball.y,ball.r*2.8,0,Math.PI*2);x.fill();x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.shadowBlur=0}
function update(){if(!running)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>560-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy=Math.abs(ball.dy);if(ball.dy>0&&ball.y+ball.r>=paddle.y&&ball.y<paddle.y+paddle.h&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w){ball.dy=-Math.abs(ball.dy);ball.dx=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*5}for(let b of bricks){if(b.on&&ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){b.on=false;ball.dy*=-1;score+=10;document.getElementById('score').textContent=score;break}}if(ball.y>450){lives--;document.getElementById('lives').textContent=lives;if(lives<=0){running=false;msg.textContent='Fim de jogo! Pontuação: '+score;return}ball.x=280;ball.y=395;ball.dx=2.5+level*.3;ball.dy=-3.5-level*.25;running=false;msg.textContent='Vida perdida. Toque em iniciar para continuar.'}if(bricks.every(b=>!b.on)){level++;document.getElementById('level').textContent=level;setup();running=false;msg.textContent='Fase '+level+'! Toque em iniciar.'}draw();if(running)raf=requestAnimationFrame(update)}
function move(px){paddle.x=Math.max(0,Math.min(560-paddle.w,px-paddle.w/2))}c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();move((e.clientX-r.left)/r.width*560)});window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')paddle.x=Math.max(0,paddle.x-28);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')paddle.x=Math.min(560-paddle.w,paddle.x+28)});document.getElementById('start').onclick=()=>{if(!running){running=true;msg.textContent='Boa sorte!';cancelAnimationFrame(raf);update()}};document.getElementById('restart').onclick=()=>{score=0;lives=3;level=1;running=false;document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;document.getElementById('level').textContent=1;setup();draw();msg.textContent='Partida reiniciada.'};setup();draw();})();</script></body></html>
