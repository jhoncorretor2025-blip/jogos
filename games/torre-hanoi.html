<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>Torre de Hanói · Jogos do Jhon · v1.0</title>
<style>
:root{color-scheme:dark;--bg:#07111b;--panel:#101e2d;--line:#294158;--text:#edf6f8;--muted:#9bb1c2;--cyan:#45d9e8;--gold:#f6c96a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 14px 30px;background:radial-gradient(900px 520px at 50% -10%,#173c50,#07111b 70%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
.wrap{width:min(1050px,100%);margin:auto}header{text-align:center;margin:0 auto 16px}h1{font-size:clamp(25px,4vw,38px);margin:0 0 5px}header p{color:var(--muted);margin:0;font-size:14px}.version{display:inline-block;margin-top:8px;padding:4px 10px;border:1px solid #315064;border-radius:30px;color:#9fdce5;font-size:11px}
.panel{background:linear-gradient(145deg,#13273a,#0d1927);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px #0005}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:13px}.btn,select{border:1px solid #35516a;background:#14283a;color:var(--text);border-radius:11px;padding:10px 14px;font:600 13px system-ui;cursor:pointer}.btn.primary{background:linear-gradient(120deg,#0e7490,#155e75);border-color:#38bdf8}.btn:disabled{opacity:.4;cursor:not-allowed}.stat{background:#091521;border:1px solid #20384c;border-radius:12px;padding:8px 13px;text-align:center;color:var(--muted);font-size:12px}.stat b{color:#fff;font-size:17px;margin-left:5px}.message{margin:12px 0 0;padding:11px 13px;border-radius:11px;background:#0a1723;border:1px solid #20384c;color:#cbe5ed;font-size:13px;line-height:1.5;text-align:center;min-height:43px}.back{display:inline-block;margin-top:14px;color:#9edee8;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
button:focus-visible,select:focus-visible{outline:3px solid #67e8f9;outline-offset:2px}
@media(max-width:600px){body{padding:12px 8px 22px}.panel{padding:10px}.toolbar .btn{flex:1}.toolbar{gap:7px}}
</style></head><body><main class="wrap"><header><h1>🗼 Torre de Hanói</h1><p>Mova todos os discos para a última torre com o menor número de movimentos.</p><span class="version">Jogos do Jhon · v1.0</span></header><section class="panel"><div class="toolbar"><span class="stat">Movimentos <b id="moves">0</b></span><span class="stat">Mínimo <b id="minimum">31</b></span><select id="disks"><option value="3">3 discos</option><option value="4">4 discos</option><option value="5" selected>5 discos</option><option value="6">6 discos</option><option value="7">7 discos</option></select><button class="btn" id="undo">↶ Desfazer</button><button class="btn primary" id="reset">Reiniciar</button></div>
<style>
.towers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;min-height:300px}.tower{height:275px;position:relative;border:1px solid #294158;border-radius:15px;background:linear-gradient(180deg,#102236,#091521);cursor:pointer;display:flex;align-items:end;justify-content:center;padding:0 8px 17px}.tower::before{content:"";position:absolute;bottom:16px;width:8px;height:210px;border-radius:8px;background:#b98550}.tower::after{content:"";position:absolute;bottom:12px;left:8%;right:8%;height:12px;border-radius:8px;background:#c18a51}.stack{position:relative;z-index:1;display:flex;flex-direction:column-reverse;align-items:center;justify-content:flex-start;width:100%;height:210px;padding-bottom:0;gap:3px}.disk{height:24px;border-radius:9px;border:1px solid #ffffff44;box-shadow:0 3px 8px #0006;flex:none;max-width:100%}.tower small{position:absolute;top:10px;color:#b9ccd9;font-weight:800}.tower.selected{outline:3px solid #45d9e8;background:#123449}.hint{color:#9bb1c2;text-align:center;font-size:12px;margin:12px 0}
</style><div class="towers" id="towers"><button class="tower" data-t="0"><small>TORRE A</small><span class="stack"></span></button><button class="tower" data-t="1"><small>TORRE B</small><span class="stack"></span></button><button class="tower" data-t="2"><small>TORRE C</small><span class="stack"></span></button></div><p class="hint">Clique na torre de origem e depois na torre de destino. Nunca coloque um disco maior sobre um menor.</p><div class="message" id="message" role="status" aria-live="polite">Bom jogo!</div></section><div style="text-align:center"><a class="back" href="../index.html">← Voltar ao Jogos do Jhon</a></div></main><script>(()=>{

// Web Audio API - Som Retrô
let audioCtx=null;function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}function tone(f,d,t='square',v=.05){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}function sfxMove(){tone(220,.04,'square',.03)}function sfxClick(){tone(440,.08,'triangle',.05)}

const towers=[[7,6,5,4,3],[ ],[ ]],el=document.getElementById('towers'),msg=document.getElementById('message');let stacks=[],moves=0,selected=null,history=[];
const colors=['#38bdf8','#8b5cf6','#ec4899','#f97316','#eab308','#22c55e','#14b8a6'];
function reset(){const n=+document.getElementById('disks').value;stacks=[Array.from({length:n},(_,i)=>n-i),[],[]];moves=0;selected=null;history=[];document.getElementById('minimum').textContent=Math.pow(2,n)-1;render();msg.textContent='Mova todos os discos para a Torre C.'}
function render(){document.getElementById('moves').textContent=moves;document.getElementById('undo').disabled=!history.length;[...el.children].forEach((tower,i)=>{tower.classList.toggle('selected',selected===i);const stack=tower.querySelector('.stack');stack.innerHTML='';stacks[i].forEach(size=>{const d=document.createElement('div');d.className='disk';d.style.width=(30+size*9)+'%';d.style.background=colors[size-1];d.title='Disco '+size;stack.appendChild(d)})})}
el.addEventListener('click',e=>{const t=e.target.closest('.tower');if(!t)return;const i=+t.dataset.t;if(selected===null){if(!stacks[i].length)return;selected=i;msg.textContent='Agora escolha a torre para onde deseja mover o disco.';render();return}if(selected===i){selected=null;render();return}const disk=stacks[selected][stacks[selected].length-1],top=stacks[i][stacks[i].length-1];if(top&&top<disk){msg.textContent='Movimento inválido: disco maior não pode ficar sobre um menor.';return}history.push(stacks.map(a=>a.slice()));stacks[i].push(stacks[selected].pop());moves++;selected=null;render();if(stacks[2].length===stacks.reduce((n,a)=>n+a.length,0)){msg.textContent='🏆 Torre concluída em '+moves+' movimentos! '+(moves===+document.getElementById('minimum').textContent?'Perfeito, no mínimo possível!':'Tente bater o mínimo de movimentos.')}else msg.textContent='Movimento realizado. Continue!'});
document.getElementById('undo').addEventListener('click',()=>{if(!history.length)return;stacks=history.pop();moves--;selected=null;render();msg.textContent='Último movimento desfeito.'});
document.getElementById('reset').addEventListener('click',reset);document.getElementById('disks').addEventListener('change',reset);reset();
})();</script><script src="../arcade-common.js"></script></body></html>
