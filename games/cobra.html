<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Cobra Neon — Jogos do Jhon</title>
<style>
  :root{--bg:#070b14;--card:#0f172a;--line:#1e293b;--txt:#e2e8f0;--muted:#94a3b8;--acc:#34d399}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(700px 400px at 50% -10%,rgba(52,211,153,.16),transparent 65%),var(--bg);
    color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:14px 14px 22px;
    -webkit-tap-highlight-color:transparent;user-select:none;
  }
  .top{width:100%;max-width:520px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{color:var(--muted);text-decoration:none;font-size:22px;line-height:1;padding:6px 8px;border-radius:10px}
  .back:hover{background:#111c31;color:var(--txt)}
  h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .hud{width:100%;max-width:520px;display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .stat{flex:1;min-width:70px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .stat span{display:block;font-size:10px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .stat b{font-size:17px;font-variant-numeric:tabular-nums}
  .stage{position:relative;width:100%;max-width:520px;aspect-ratio:1}
  canvas{width:100%;height:100%;display:block;border-radius:14px;touch-action:none}
  .overlay{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:8px;text-align:center;padding:22px;border-radius:14px;
    background:rgba(4,8,16,.85);backdrop-filter:blur(4px);
  }
  .overlay.show{display:flex}
  .overlay h2{margin:0;font-size:24px}
  .overlay p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
  .btn{
    margin-top:8px;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:700;
    color:#04211b;background:linear-gradient(90deg,#34d399,#22d3ee);cursor:pointer;
  }
  .btn:active{transform:scale(.97)}
  .btn.alt{background:#1e293b;color:#e2e8f0;border:1px solid #334155}
  .diff-row{display:flex;gap:6px;margin:12px 0 0;flex-wrap:wrap;justify-content:center}
  .diff-btn{border:1px solid var(--line);background:#101a2e;color:#cbd5e1;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .diff-btn.active{background:linear-gradient(90deg,#34d399,#22d3ee);color:#04211b;border-color:transparent}
  .pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:8px;margin-top:14px}
  .pad button{
    border:1px solid var(--line);background:#101a2e;color:#cbd5e1;border-radius:12px;font-size:20px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .pad button:active{background:#1b2b47;transform:scale(.96)}
  .pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .p{grid-area:2/2;font-size:16px}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
  .hint{color:#64748b;font-size:12.5px;margin:12px 0 0;text-align:center}
  .ver{color:#475569;font-size:11.5px;margin-top:10px}
  @media (hover:hover){.pad{opacity:.9}}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="../index.html" title="Voltar">←</a>
    <h1>🐍 Cobra Neon</h1>
  </div>

  <div class="hud">
    <div class="stat"><span>Pontos</span><b id="score">0</b></div>
    <div class="stat"><span>Recorde</span><b id="best">0</b></div>
    <div class="stat"><span>Nível</span><b id="level">1</b></div>
    <div class="stat" style="flex:0 0 auto;display:flex;align-items:center"><span style="display:none">.</span><b id="speed" style="font-size:13px;color:#94a3b8">1x</b></div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay show" id="ov">
      <h2 id="ovTitle">Cobra Neon</h2>
      <p id="ovText">Coma os pontos, cresça e não bata em nada. A cada nível aparecem novos obstáculos!</p>
      <div class="diff-row">
        <button class="diff-btn" data-diff="easy">Fácil</button>
        <button class="diff-btn active" data-diff="normal">Normal</button>
        <button class="diff-btn" data-diff="hard">Difícil</button>
      </div>
      <button class="btn" id="ovBtn">Jogar</button>
    </div>
  </div>

  <div class="pad">
    <button class="u" data-dir="up" aria-label="Cima">↑</button>
    <button class="l" data-dir="left" aria-label="Esquerda">←</button>
    <button class="p" id="pauseBtn" aria-label="Pausar">⏸</button>
    <button class="r" data-dir="right" aria-label="Direita">→</button>
    <button class="d" data-dir="down" aria-label="Baixo">↓</button>
  </div>

  <p class="hint">Setas / WASD • deslize na tela • <b>espaço</b> pausa</p>
  <div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button id="soundBtn" style="border:1px solid var(--line);background:#101a2e;color:#cbd5e1;border-radius:10px;padding:6px 12px;font-size:12px;cursor:pointer">🔊 Som: on</button></div>
  <div class="ver">v2.1 • 24/11/2026</div>

<script>
(function(){
  let audioCtx=null;function ensureAudio(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}}function tone(f,d,t="square",v=.05){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
  const GRID = 19;
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const ov = document.getElementById('ov');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovBtn = document.getElementById('ovBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const levelEl = document.getElementById('level');

  let cell = 20, size = 400;
  let snake, dir, queue, food, golden, score, dead, running, paused, tick, acc, last, started, shake=0, soundOn=true;
  let obstacles = [];
  let level = 1;
  let best = Number(localStorage.getItem('cobra.best') || 0);
  bestEl.textContent = best;
  let diff = 'normal';
  const diffSpeed = { easy: 180, normal: 150, hard: 115 };

  function fit(){
    size = Math.floor(cv.clientWidth) || 400;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(size * dpr);
    cv.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = size / GRID;
    draw();
  }

  function reset(){
    const m = Math.floor(GRID / 2);
    snake = [{x:m,y:m},{x:m-1,y:m},{x:m-2,y:m}];
    dir = {x:1,y:0};
    queue = [];
    score = 0; dead = false; paused = false; running = false; started = false;
    tick = diffSpeed[diff]; acc = 0; last = 0;
    level = 1;
    obstacles = [];
    scoreEl.textContent = '0';
    speedEl.textContent = '1x';
    levelEl.textContent = '1';
    placeFood();
    draw();
  }

  function placeFood(){
    const free = [];
    for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
      if (!snake.some(s => s.x === x && s.y === y) && !obstacles.some(o => o.x === x && o.y === y)) free.push({x,y});
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function addObstaclesForLevel(lv){
    obstacles = [];
    if (lv < 2) return;
    const count = Math.min( (lv - 1) * 3, 12 );
    const free = [];
    for (let y = 0; y < GRID; y++) for (let x = 0; x < GRID; x++) {
      // avoid center area and edges
      if (x <= 1 || y <= 1 || x >= GRID-2 || y >= GRID-2) continue;
      if (Math.abs(x - Math.floor(GRID/2)) < 3 && Math.abs(y - Math.floor(GRID/2)) < 3) continue;
      free.push({x,y});
    }
    // shuffle
    for (let i = free.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [free[i], free[j]] = [free[j], free[i]];
    }
    for (let i = 0; i < count && i < free.length; i++) obstacles.push(free[i]);
  }

  function roundRect(x, y, w, h, r){
    const rr = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr, y);
    ctx.arcTo(x+w, y, x+w, y+h, rr);
    ctx.arcTo(x+w, y+h, x, y+h, rr);
    ctx.arcTo(x, y+h, x, y, rr);
    ctx.arcTo(x, y, x+w, y, rr);
    ctx.closePath();
  }

  function draw(){
    const w = size;
    ctx.save();
    if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.82;if(shake<.5)shake=0}
    ctx.clearRect(0, 0, w, w);
    // background with subtle gradient
    const bg = ctx.createRadialGradient(w/2, w/2, 0, w/2, w/2, w*.7);
    bg.addColorStop(0, '#0a1a2e');
    bg.addColorStop(1, '#040810');
    ctx.fillStyle = bg;
    roundRect(0, 0, w, w, 14); ctx.fill();

    // grid
    ctx.strokeStyle = 'rgba(148,163,184,.05)';
    ctx.lineWidth = 1;
    for (let i = 1; i < GRID; i++) {
      const p = Math.round(i * cell) + .5;
      ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, w);
      ctx.moveTo(0, p); ctx.lineTo(w, p); ctx.stroke();
    }

    // obstacles
    for (const o of obstacles) {
      const px = o.x * cell, py = o.y * cell;
      const g = ctx.createLinearGradient(px, py, px+cell, py+cell);
      g.addColorStop(0, '#7c3aed'); g.addColorStop(1, '#4c1d95');
      ctx.fillStyle = g;
      roundRect(px + cell*.1, py + cell*.1, cell*.8, cell*.8, cell*.15);
      ctx.fill();
      ctx.strokeStyle = 'rgba(167,139,250,.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // golden fruit
    if (golden) {
      const cx=(golden.x+.5)*cell, cy=(golden.y+.5)*cell;
      const pulse=1+Math.sin(performance.now()/180)*.15;
      ctx.save(); ctx.shadowColor='#fbbf24'; ctx.shadowBlur=22;
      ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(cx,cy,cell*.38*pulse,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.fillStyle='#fff'; ctx.font='bold '+Math.round(cell*.5)+'px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('★',cx,cy); ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
    // food
    if (food) {
      const cx = (food.x + .5) * cell, cy = (food.y + .5) * cell;
      const pulse = 1 + Math.sin(performance.now() / 260) * .12;
      ctx.save();
      ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 20;
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(cx, cy, cell * .32 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.6)';
      ctx.beginPath(); ctx.arc(cx - cell*.08, cy - cell*.09, cell*.07, 0, Math.PI * 2); ctx.fill();
    }

    if (!snake) return;
    // snake body with gradient
    for (let i = snake.length - 1; i >= 0; i--) {
      const s = snake[i];
      const t = i / Math.max(snake.length - 1, 1);
      const pad = cell * .07;
      if (i === 0) {
        ctx.save();
        ctx.shadowColor = '#34d399'; ctx.shadowBlur = 12;
        ctx.fillStyle = '#6ee7b7';
        roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad*2, cell - pad*2, cell * .3);
        ctx.fill();
        ctx.restore();
      } else {
        const lightness = 55 - t * 20;
        ctx.fillStyle = 'hsl(160 60% ' + lightness + '%)';
        roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad*2, cell - pad*2, cell * .28);
        ctx.fill();
      }
    }

    // eyes
    const head = snake[0];
    const hx = (head.x + .5) * cell, hy = (head.y + .5) * cell;
    ctx.fillStyle = '#04120d';
    const off = cell * .17;
    let e1 = {x:-off,y:-off}, e2 = {x:off,y:-off};
    if (dir.x === 1) { e1 = {x:off,y:-off}; e2 = {x:off,y:off}; }
    if (dir.x === -1){ e1 = {x:-off,y:-off}; e2 = {x:-off,y:off}; }
    if (dir.y === 1) { e1 = {x:-off,y:off}; e2 = {x:off,y:off}; }
    ctx.beginPath(); ctx.arc(hx+e1.x, hy+e1.y, cell*.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(hx+e2.x, hy+e2.y, cell*.1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function turn(nx, ny){
    const base = queue.length ? queue[queue.length-1] : dir;
    if (base.x === -nx && base.y === -ny) return;
    if (base.x === nx && base.y === ny) return;
    if (queue.length < 3) queue.push({x:nx,y:ny});
  }

  function step(){
    if (queue.length) dir = queue.shift();
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID) return die();
    if (obstacles.some(o => o.x === head.x && o.y === head.y)) return die();
    const grow = food && head.x === food.x && head.y === food.y;
    const eatGolden = golden && head.x === golden.x && head.y === golden.y;
    const body = grow ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return die();

    snake.unshift(head);
    if (eatGolden) {
      score += 50; tone(880,.12,'triangle',.08); scoreEl.textContent=score;
      if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('cobra.best',best)}
      golden=null;
      for(let i=0;i<3 && snake.length>4;i++) snake.pop();
    }
    if (grow) {
      score += 10;
      tone(660,.08,'square',.06);
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem('cobra.best', best); }
      // level up every 50 points
      const newLevel = 1 + Math.floor(score / 50);
      if (newLevel > level) {
        level = newLevel;
        levelEl.textContent = level;
        addObstaclesForLevel(level);
        placeFood();
        tick = Math.max(60, diffSpeed[diff] - (level-1)*8);
      }
      if (tick > 60) tick = Math.max(60, tick - 3);
      speedEl.textContent = Math.round(diffSpeed[diff] / tick * 10) / 10 + 'x';
      placeFood();
      if (!golden && Math.random() < .22) {
        const free=[];for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){if(!snake.some(s=>s.x===x&&s.y===y)&&!(food&&food.x===x&&food.y===y)&&!obstacles.some(o=>o.x===x&&o.y===y))free.push({x,y})}
        if(free.length) golden=free[Math.floor(Math.random()*free.length)];
      }
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function die(){
    dead = true; running = false; shake=14; tone(120,.3,'sawtooth',.1);
    ovTitle.textContent = 'Fim de jogo';
    ovText.innerHTML = 'Pontos: <b>' + score + '</b> • Nível ' + level + (score >= best && score > 0 ? ' — novo recorde! 🏆' : '');
    ovBtn.textContent = 'Jogar de novo';
    ov.classList.add('show');
  }

  function win(){
    running = false; dead = true;
    ovTitle.textContent = 'Você dominou a tela! 🏆';
    ovText.innerHTML = 'Pontos: <b>' + score + '</b>';
    ovBtn.textContent = 'Jogar de novo';
    ov.classList.add('show');
  }

  function start(){
    reset();
    addObstaclesForLevel(level);
    placeFood();
    ov.classList.remove('show');
    running = true; started = true;
  }

  function togglePause(){
    if (!started || dead) return;
    paused = !paused;
    if (paused) {
      ovTitle.textContent = 'Pausado';
      ovText.textContent = 'Respire e volte quando quiser.';
      ovBtn.textContent = 'Continuar';
      ov.classList.add('show');
    } else {
      ov.classList.remove('show');
    }
  }

  function frame(t){
    requestAnimationFrame(frame);
    if (!running || paused || dead) { last = t; return; }
    if (!last) last = t;
    let dt = t - last; last = t;
    if (dt > 250) dt = 250;
    acc += dt;
    let guard = 0;
    while (acc >= tick && guard++ < 5) { acc -= tick; step(); if (dead) break; }
    draw();
  }

  ovBtn.addEventListener('click', function(){
    ensureAudio();
    if (paused) { paused = false; ov.classList.remove('show'); return; }
    start();
  });
  document.getElementById('soundBtn').addEventListener('click', function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊 Som: on':'🔇 Som: off'; });

  document.getElementById('pauseBtn').addEventListener('click', togglePause);

  const dirs = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };
  document.querySelectorAll('.pad button[data-dir]').forEach(function(b){
    b.addEventListener('pointerdown', function(e){
      e.preventDefault();
      const d = dirs[b.dataset.dir];
      if (!started) start();
      turn(d[0], d[1]);
    });
  });

  window.addEventListener('keydown', function(e){
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k) >= 0) e.preventDefault();
    if (k === 'arrowup' || k === 'w') { if (!started) start(); turn(0,-1); }
    else if (k === 'arrowdown' || k === 's') { if (!started) start(); turn(0,1); }
    else if (k === 'arrowleft' || k === 'a') { if (!started) start(); turn(-1,0); }
    else if (k === 'arrowright' || k === 'd') { if (!started) start(); turn(1,0); }
    else if (k === ' ') togglePause();
    else if (k === 'enter' && (dead || !started)) start();
  });

  document.querySelectorAll('.diff-btn').forEach(function(b){
    b.addEventListener('click', function(){
      if (started && !dead) return;
      diff = b.dataset.diff;
      document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      reset();
    });
  });

  let tx = 0, ty = 0;
  const stage = document.querySelector('.stage');
  stage.addEventListener('touchstart', function(e){
    const t = e.changedTouches[0]; tx = t.clientX; ty = t.clientY;
  }, {passive:true});
  stage.addEventListener('touchend', function(e){
    const t = e.changedTouches[0];
    const dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    if (!started) start();
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  }, {passive:true});

  window.addEventListener('resize', fit);
  reset();
  fit();
  requestAnimationFrame(frame);
})();
</script>
<script src="../arcade-common.js"></script></body>
</html>
