<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111b"><title>Jewel Match · Jogos do Jhon · v1.0</title>
<style>
:root{color-scheme:dark;--bg:#07111b;--panel:#101e2d;--line:#294158;--text:#edf6f8;--muted:#9bb1c2;--cyan:#45d9e8;--gold:#f6c96a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:20px 14px 30px;background:radial-gradient(900px 520px at 50% -10%,#173c50,#07111b 70%);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}
.wrap{width:min(1050px,100%);margin:auto}header{text-align:center;margin:0 auto 16px}h1{font-size:clamp(25px,4vw,38px);margin:0 0 5px}header p{color:var(--muted);margin:0;font-size:14px}.version{display:inline-block;margin-top:8px;padding:4px 10px;border:1px solid #315064;border-radius:30px;color:#9fdce5;font-size:11px}
.panel{background:linear-gradient(145deg,#13273a,#0d1927);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 50px #0005}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:13px}.btn,select{border:1px solid #35516a;background:#14283a;color:var(--text);border-radius:11px;padding:10px 14px;font:600 13px system-ui;cursor:pointer}.btn.primary{background:linear-gradient(120deg,#0e7490,#155e75);border-color:#38bdf8}.btn:disabled{opacity:.4;cursor:not-allowed}.stat{background:#091521;border:1px solid #20384c;border-radius:12px;padding:8px 13px;text-align:center;color:var(--muted);font-size:12px}.stat b{color:#fff;font-size:17px;margin-left:5px}.message{margin:12px 0 0;padding:11px 13px;border-radius:11px;background:#0a1723;border:1px solid #20384c;color:#cbe5ed;font-size:13px;line-height:1.5;text-align:center;min-height:43px}.back{display:inline-block;margin-top:14px;color:#9edee8;text-decoration:none;font-size:13px}.back:hover{text-decoration:underline}
button:focus-visible,select:focus-visible{outline:3px solid #67e8f9;outline-offset:2px}
@media(max-width:600px){body{padding:12px 8px 22px}.panel{padding:10px}.toolbar .btn{flex:1}.toolbar{gap:7px}}
</style></head><body><main class="wrap"><header><h1>💎 Jewel Match</h1><p>Combine joias iguais, faça combos e alcance a pontuação-alvo.</p><span class="version">Jogos do Jhon · v1.0</span></header><section class="panel"><div class="toolbar"><span class="stat">Pontos <b id="score">0</b></span><span class="stat">Movimentos <b id="moves">30</b></span><span class="stat">Meta <b id="goal">1500</b></span><button class="btn primary" id="new">Nova partida</button></div>
<style>
.jewel-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;width:min(540px,100%);margin:auto;touch-action:manipulation}.gem{aspect-ratio:1;border:1px solid #ffffff30;border-radius:11px;font-size:clamp(17px,4vw,31px);cursor:pointer;background:linear-gradient(145deg,#173149,#091521);box-shadow:inset 0 2px 5px #fff2,0 4px 7px #0004;display:grid;place-items:center;padding:0}.gem.selected{outline:3px solid #fff;outline-offset:1px;transform:scale(1.04)}.gem:disabled{cursor:default;opacity:.5}
</style><div class="jewel-grid" id="board" aria-label="Tabuleiro de combinar joias"></div><p style="text-align:center;color:#9bb1c2;font-size:12px">Troque duas joias vizinhas para formar linhas ou colunas com pelo menos três iguais. Alcance a meta antes de acabar os movimentos.</p><div class="message" id="message" role="status" aria-live="polite">Bom jogo!</div></section><div style="text-align:center"><a class="back" href="../index.html">← Voltar ao Jogos do Jhon</a></div></main><script>(()=>{
const boardEl=document.getElementById('board'),msg=document.getElementById('message'),N=8,icons=['🔴','🔵','🟢','🟣','🟡','🟠'];let board=[],selected=null,score=0,moves=30,busy=false;
function hasMatchAt(r,c){const v=board[r][c];return c>=2&&board[r][c-1]===v&&board[r][c-2]===v||r>=2&&board[r-1][c]===v&&board[r-2][c]===v}
function newGame(){score=0;moves=30;selected=null;busy=false;board=Array.from({length:N},()=>Array(N).fill(0));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v;do{v=Math.floor(Math.random()*icons.length);board[r][c]=v}while(hasMatchAt(r,c))}render();ui();msg.textContent='Combine três ou mais joias iguais. Boa sorte!'}
function ui(){document.getElementById('score').textContent=score;document.getElementById('moves').textContent=moves;document.getElementById('goal').textContent=1500;boardEl.querySelectorAll('button').forEach(b=>b.disabled=busy||moves<=0)}
function render(){boardEl.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){const b=document.createElement('button');b.className='gem';b.type='button';b.textContent=icons[board[r][c]];b.dataset.r=r;b.dataset.c=c;b.setAttribute('aria-label','Joia '+(board[r][c]+1));if(selected&&selected.r===r&&selected.c===c)b.classList.add('selected');boardEl.appendChild(b)}ui()}
function matches(){const set=new Set();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=board[r][c];if(c+2<N&&board[r][c+1]===v&&board[r][c+2]===v){let k=c;while(k<N&&board[r][k]===v)set.add(r*N+k++)}if(r+2<N&&board[r+1][c]===v&&board[r+2][c]===v){let k=r;while(k<N&&board[k][c]===v)set.add(k++*N+c)}}return [...set]}
function collapse(){for(let c=0;c<N;c++){const vals=[];for(let r=N-1;r>=0;r--)if(board[r][c]!==null)vals.push(board[r][c]);while(vals.length<N)vals.push(Math.floor(Math.random()*icons.length));for(let r=N-1;r>=0;r--)board[r][c]=vals[N-1-r]}}
async function resolve(){let combo=0;while(true){const list=matches();if(!list.length)break;combo++;score+=list.length*10*combo;list.forEach(i=>board[Math.floor(i/N)][i%N]=null);render();await new Promise(res=>setTimeout(res,180));collapse();render();await new Promise(res=>setTimeout(res,120))}busy=false;ui();if(score>=1500){moves=0;ui();msg.textContent='🏆 Você atingiu a meta de 1.500 pontos! Parabéns!'}else if(moves<=0){msg.textContent='Fim dos movimentos! Você fez '+score+' pontos. Toque em Nova partida.'}else msg.textContent=combo?'Boa! Combo de '+combo+' sequência(s).':'Troca realizada.'}
boardEl.addEventListener('click',async e=>{const b=e.target.closest('.gem');if(!b||busy||moves<=0)return;const r=+b.dataset.r,c=+b.dataset.c;if(!selected){selected={r,c};render();return}if(selected.r===r&&selected.c===c){selected=null;render();return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)!==1){selected={r,c};render();return}const a=selected;[board[a.r][a.c],board[r][c]]=[board[r][c],board[a.r][a.c]];selected=null;if(!matches().length){[board[a.r][a.c],board[r][c]]=[board[r][c],board[a.r][a.c]];render();msg.textContent='Essa troca não forma uma combinação. Tente outra.';return}moves--;busy=true;render();await resolve()});
document.getElementById('new').addEventListener('click',newGame);newGame();
})();</script></body></html>
