<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><title>Conecte os Pontos · v1.0</title><style>
:root{--bg:#070b14;--panel:#101a2b;--line:#27364d;--text:#e5edf8;--muted:#9aa9bd;--cyan:#22d3ee;--violet:#a78bfa;--green:#34d399;--yellow:#fbbf24;--red:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(700px 300px at 20% 0,#162b49,transparent),var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;padding:16px}main{max-width:850px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.top a{color:var(--cyan);text-decoration:none}.version{color:var(--muted);font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0}h1{margin:8px 0;font-size:clamp(25px,6vw,36px)}p{color:var(--muted)}button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#17243a;color:var(--text);padding:11px 14px}button:hover{border-color:var(--cyan)}.primary{background:linear-gradient(120deg,#0e7490,#6d28d9);border:0;font-weight:700}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{flex:1;min-width:100px;text-align:center;background:#0b1322;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px}.muted{color:var(--muted)}@media(max-width:520px){body{padding:10px}.panel{padding:12px}}
</style></head><body><main><div class="top"><a href="../index.html">← Arcade</a><span class="version">v1.0</span></div><h1>🔵 Conecte os Pontos</h1><p>Faça linhas entre os pontos e feche quadrados para conquistar território. Quem fechar um quadrado joga novamente!</p><section class="panel"><div class="row"><label>Tabuleiro <select id="size"><option value="4">4 × 4 pontos · rápido</option><option value="5" selected>5 × 5 pontos</option><option value="6">6 × 6 pontos · estratégico</option></select></label><button class="primary" id="new">Novo jogo</button></div><div class="stats"><div class="stat"><b id="s1">0</b>Jogador 1 🟦</div><div class="stat"><b id="turn">1</b>Vez de</div><div class="stat"><b id="s2">0</b>Jogador 2 🟪</div></div><p id="status">Toque em dois pontos adjacentes para desenhar uma linha.</p><div id="board" style="display:grid;gap:0;margin:14px auto;max-width:520px;touch-action:manipulation"></div><button id="reset">Reiniciar</button></section><script>
let n=5,edges={},boxes={},player=1,score=[0,0],finished=false;const $=id=>document.getElementById(id);
function key(a,b){return[a,b].sort().join('-')}function edgeId(r,c,dir){return dir==='h'?key(r*n+c,r*n+c+1):key(r*n+c,(r+1)*n+c)}
function init(){n=+$('size').value;edges={};boxes={};player=1;score=[0,0];finished=false;draw()}
function hasEdge(k){return !!edges[k]}function boxEdges(r,c){return[key(r*n+c,r*n+c+1),key((r+1)*n+c,(r+1)*n+c+1),key(r*n+c,(r+1)*n+c),key(r*n+c+1,(r+1)*n+c+1)]}
function lineClick(r,c,d){if(finished)return;let k=edgeId(r,c,d);if(edges[k])return;edges[k]=player;let got=0;for(let br=Math.max(0,r-(d==='v'?0:0));br<n-1;br++)for(let bc=0;bc<n-1;bc++){let id=br+'_'+bc;if(!boxes[id]&&boxEdges(br,bc).every(x=>edges[x])){boxes[id]=player;got++}}if(got)score[player-1]+=got;else player=3-player;if(Object.keys(boxes).length===(n-1)*(n-1)){finished=true;player=score[0]===score[1]?0:score[0]>score[1]?1:2}draw()}
function draw(){const board=$('board');board.style.gridTemplateColumns='repeat('+n+',1fr)';board.innerHTML='';for(let r=0;r<n;r++)for(let c=0;c<n;c++){let cell=document.createElement('div');cell.style.aspectRatio='1';cell.style.position='relative';cell.style.minWidth='0';cell.style.display='grid';cell.style.gridTemplateColumns='1fr';cell.style.gridTemplateRows='1fr';cell.style.background=(boxes[r+'_'+c]===1?'#164e63':boxes[r+'_'+c]===2?'#4c1d95':'transparent');if(r<n-1&&c<n-1){let b=document.createElement('div');b.style.position='absolute';b.style.inset='0';b.style.pointerEvents='none';cell.appendChild(b);if(boxes[r+'_'+c])b.textContent=boxes[r+'_'+c]===1?'🟦':'🟪';b.style.display='grid';b.style.placeItems='center'}let dot=document.createElement('div');dot.style.width='12px';dot.style.height='12px';dot.style.borderRadius='50%';dot.style.background='#e5edf8';dot.style.margin='auto';dot.style.zIndex='2';cell.appendChild(dot);
if(c<n-1){let h=document.createElement('button');h.style.position='absolute';h.style.left='50%';h.style.top='0';h.style.transform='translateX(-50%)';h.style.width='100%';h.style.height='12px';h.style.padding='0';h.style.border='0';h.style.borderRadius='4px';h.style.background=edges[edgeId(r,c,'h')]===1?'#22d3ee':edges[edgeId(r,c,'h')]===2?'#a78bfa':'transparent';h.onclick=()=>lineClick(r,c,'h');cell.appendChild(h)}
if(r<n-1){let v=document.createElement('button');v.style.position='absolute';v.style.right='0';v.style.top='50%';v.style.transform='translateY(-50%)';v.style.width='12px';v.style.height='100%';v.style.padding='0';v.style.border='0';v.style.borderRadius='4px';v.style.background=edges[edgeId(r,c,'v')]===1?'#22d3ee':edges[edgeId(r,c,'v')]===2?'#a78bfa':'transparent';v.onclick=()=>lineClick(r,c,'v');cell.appendChild(v)}board.appendChild(cell)}
$('s1').textContent=score[0];$('s2').textContent=score[1];$('turn').textContent=finished?'Final':('Jogador '+player);$('status').textContent=finished?'Fim! '+(player===0?'Empate!':'Jogador '+player+' venceu!'):'Jogador '+player+' joga. '+(score[0]+score[1])+' quadrados conquistados.'}
$('new').onclick=init;$('reset').onclick=init;init();
</script></main><script src="../arcade-common.js"></script><div style="text-align:center;margin:12px 0"><a href="../index.html" style="color:#94a3b8;text-decoration:none;font-size:13px">← Voltar ao Jogos do Jhon</a></div></body></html>
