<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Jhon's Epic Forest Quest — v4.3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="gameFrame" src="ninja_forest_run_v4_0.html?v=4.3" title="Jhon's Epic Forest Quest v4.3"></iframe>
<script>
(function(){
  const frame=document.getElementById('gameFrame');
  function inject(src){
    const d=frame.contentDocument;
    if(!d||!d.body)return false;
    if(d.querySelector('script[data-jhon-src="'+src+'"]'))return true;
    const s=d.createElement('script');
    s.src=src+'?v=4.3';
    s.dataset.jhonSrc=src;
    d.body.appendChild(s);
    return true;
  }
  function apply(){
    try{
      const d=frame.contentDocument;
      if(!d||!d.body)return;
      const v=d.querySelector('.version');
      if(v)v.textContent="🥷 JHON'S EPIC FOREST QUEST • v4.3";
      inject('musica.js');
      inject('inimigos.js');
    }catch(e){}
  }
  frame.addEventListener('load',function(){apply();setTimeout(apply,300);setTimeout(apply,1000);setTimeout(apply,2000)});
  setInterval(apply,2500);
})();
</script>
</body>
</html>
