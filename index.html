<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jhon's Epic Forest Quest</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="ninja_forest_run_v4.html" title="Jhon's Epic Forest Quest"></iframe><script>const frame=document.getElementById('game');let lastAuto=0;function autoAdvance(){try{const d=frame.contentDocument||frame.contentWindow.document;const b=d.getElementById('finishBanner'),n=d.getElementById('nextBtn');if(b&&n&&!b.classList.contains('hidden')&&Date.now()-lastAuto>1200){lastAuto=Date.now();n.click()}}catch(e){}}frame.addEventListener('load',()=>{setInterval(autoAdvance,250)});</script></body></html>
