<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Jhon's Epic Forest Quest — v4.3</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617}iframe{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="gameFrame" src="ninja_forest_run_v4_0.html?v=4.3" title="Jhon's Epic Forest Quest v4.3"></iframe>
<script>
(function(){
  const frame=document.getElementById('gameFrame');
  let patched=false;
  function patch(){
    try{
      const w=frame.contentWindow,d=frame.contentDocument;
      if(!w||!d||!d.body||!w.build||!w.fixed||!w.draw)return;
      const v=d.querySelector('.version');
      if(v)v.textContent="🥷 JHON'S EPIC FOREST QUEST • v4.3";
      const menuText=d.querySelector('#menu .panel p');
      if(menuText)menuText.innerHTML='<b>v4.3</b> — três tipos de inimigos: amarelos que pulam, marrons que patrulham e ninjas brancos que lançam shurikens.';
      if(patched)return;
      patched=true;
      const originalBuild=w.build;
      w.build=function(lv){
        originalBuild(lv);
        if(!w.enemies)return;
        w.enemies.forEach(function(e,i){
          if(e.type==='boss')return;
          e.enemyKind=['jumper','runner','ninja'][i%3];
          e.type=e.enemyKind;
          e.baseY=e.y;
          e.jumpPhase=(i%2)*Math.PI;
          e.shotClock=0;
          e.shotInterval=300+(i%3)*60;
          e.patrolDir=i%2?-1:1;
          e.patrolBase=e.x;
        });
      };
      const originalFixed=w.fixed;
      w.fixed=function(){
        originalFixed();
        if(!w.enemies)return;
        for(const e of w.enemies){
          if(!e.alive||e.type==='boss')continue;
          if(e.type==='jumper'){
            e.jumpPhase+=0.09;
            e.y=e.baseY-Math.max(0,Math.sin(e.jumpPhase))*62;
          }else if(e.type==='runner'){
            e.x+=e.patrolDir*0.65;
            if(Math.abs(e.x-e.patrolBase)>85)e.patrolDir*=-1;
          }else if(e.type==='ninja'){
            e.shotClock++;
            if(e.shotClock>=e.shotInterval){
              e.shotClock=0;
              const dir=w.p.x<e.x?-1:1;
              w.shots.push({x:e.x+e.w/2,y:e.y+e.h/2,dx:dir*3.1,r:5,a:0});
            }
          }
        }
      };
      const originalDraw=w.draw;
      w.draw=function(){
        originalDraw();
        if(!w.enemies)return;
        w.ctx.save();
        w.ctx.translate(-w.camera,0);
        for(const e of w.enemies){
          if(!e.alive||e.type==='boss')continue;
          const x=e.x,y=e.y;
          w.ctx.save();
          w.ctx.shadowBlur=8;
          w.ctx.shadowColor=e.type==='jumper'?'#facc15':e.type==='runner'?'#92400e':'#f8fafc';
          if(e.type==='jumper'){
            w.ctx.fillStyle='#facc15';w.ctx.fillRect(x+7,y+13,20,20);w.ctx.beginPath();w.ctx.arc(x+17,y+9,10,0,Math.PI*2);w.ctx.fill();
            w.ctx.fillStyle='#422006';w.ctx.fillRect(x+11,y+7,3,3);w.ctx.fillRect(x+21,y+7,3,3);
          }else if(e.type==='runner'){
            w.ctx.fillStyle='#92400e';w.ctx.fillRect(x+7,y+13,20,20);w.ctx.beginPath();w.ctx.arc(x+17,y+9,10,0,Math.PI*2);w.ctx.fill();
            w.ctx.fillStyle='#fef3c7';w.ctx.fillRect(x+11,y+7,3,3);w.ctx.fillRect(x+21,y+7,3,3);
          }else{
            w.ctx.fillStyle='#f8fafc';w.ctx.fillRect(x+7,y+13,20,20);w.ctx.beginPath();w.ctx.arc(x+17,y+9,10,0,Math.PI*2);w.ctx.fill();
            w.ctx.fillStyle='#0f172a';w.ctx.fillRect(x+8,y+5,18,7);w.ctx.fillStyle='#fff';w.ctx.fillRect(x+11,y+7,3,2);w.ctx.fillRect(x+21,y+7,3,2);
          }
          w.ctx.restore();
        }
        w.ctx.restore();
      };
      setTimeout(function(){
        try{w.build(w.level||1);}catch(e){}
      },50);
    }catch(e){console.warn('v4.3 patch',e)}
  }
  frame.addEventListener('load',function(){setTimeout(patch,250);setTimeout(patch,800);setTimeout(patch,1500)});
})();
</script>
</body>
</html>
