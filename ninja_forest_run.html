<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');const imgs={bg:new Image(),ninja:new Image(),enemy:new Image(),carla:new Image(),coin:new Image(),shuriken:new Image()};imgs.bg.src='imagens/floresta.svg';imgs.ninja.src='imagens/ninja.svg';imgs.enemy.src='imagens/inimigo.svg';imgs.carla.src='imagens/carla.svg';imgs.coin.src='imagens/moeda.svg';imgs.shuriken.src='imagens/shuriken.svg';
let audio=null;function audioInit(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)()}function snd(a,b,d=.12,type='sine',v=.08){if(!audio)return;try{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(a,t);o.frequency.linearRampToValueAtTime(b,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+d)}catch(e){}}
const keys={left:false,right:false,up:false,shield:false,attack:false};let state='menu',level=1,camera=0,shake=0,flash=0,tick=0;
const p={x:60,y:380,w:30,h:44,dx:0,dy:0,speed:5.4,g:.46,jump:-11.9,ground:false,coyote:0,jumpBuffer:0,airJumps:1,lives:3,score:0,energy:100,facing:1,spawnX:60,spawnY:380,attackCd:0,attackTimer:0,combo:0,inv:0};
let worldW=14000,platforms=[],coins=[],enemies=[],shots=[],checkpoints=[],particles=[],texts=[],goal={},rescued=false;
let fireflies=Array.from({length:120},()=>({x:Math.random()*worldW,y:30+Math.random()*430,r:1+Math.random()*2,a:.2+Math.random()*.7,s:(Math.random()-.5)*.3,d:.01+Math.random()*.025}));
const L={
1:{name:'Floresta Sombria',start:60,goal:3500,width:3850,carla:2800,plats:[[0,440,620,100],[710,390,170,22],[960,330,170,22],[1210,440,520,100],[1790,370,190,22],[2050,310,170,22],[2290,440,440,100],[2810,360,180,22],[3060,300,170,22],[3280,410,570,130]],check:[1200,2280],enemy:[500,1320,2460,3150]},
2:{name:'Ruínas da Lua',start:50,goal:3900,width:4250,carla:3150,plats:[[0,440,520,100],[610,360,170,22],[850,290,170,22],[1080,440,430,100],[1580,350,180,22],[1830,255,180,22],[2080,440,480,100],[2630,350,180,22],[2870,265,180,22],[3110,430,420,110],[3560,330,170,22],[3800,250,160,22],[4030,400,220,140]],check:[1060,2060,3090],enemy:[400,1180,2200,2410,3230,3900]},
3:{name:'Floresta do Fogo',start:50,goal:4300,width:4650,carla:3500,plats:[[0,440,500,100],[590,370,170,22],[820,290,170,22],[1040,440,390,100],[1500,350,180,22],[1740,245,180,22],[1980,440,450,100],[2520,340,180,22],[2760,235,180,22],[3000,440,500,100],[3560,350,180,22],[3800,270,180,22],[4040,430,430,110]],check:[1020,1960,2980],enemy:[430,1120,2140,2390,3150,3660,4210]},
4:{name:'Santuário Final',start:50,goal:4450,width:4850,carla:3550,plats:[[0,440,560,100],[650,350,190,22],[900,255,190,22],[1150,440,430,100],[1660,340,180,22],[1900,230,180,22],[2140,440,480,100],[2710,330,180,22],[2950,220,180,22],[3190,430,430,110],[3660,330,180,22],[3900,225,180,22],[4140,430,710,110]],check:[1130,2120,3170],enemy:[450,1250,2250,2470,3300,3720,4230],boss:true}};
function clearAll(){platforms=[];coins=[];enemies=[];shots=[];checkpoints=[];particles=[];texts=[]}
function build(){clearAll();const z=L[level];worldW=z.width;z.plats.forEach((a,i)=>platforms.push({x:a[0],y:a[1],w:a[2],h:a[3],id:i}));z.check.forEach((x,i)=>checkpoints.push({x:x,y:390,w:24,h:50,on:false,id:i+1}));z.enemy.forEach((x,i)=>enemies.push({x:x,y:408,w:32,h:32,min:x-80,max:x+100,s:1.4+(i%3)*.35,dir:i%2?1:-1,type:i%2?'shooter':'runner',timer:0,hp:1,alive:true}));if(z.boss)enemies.push({x:4420,y:390,w:70,h:70,min:4250,max:4700,s:1.1,dir:-1,type:'boss',timer:0,hp:8,alive:true});for(let x=260;x<worldW-100;x+=185){let base=160+Math.sin(x*.018)*75;coins.push({x:x+Math.random()*70-35,y:base,base,collected:false})}goal={x:z.goal,y:330,w:45,h:95};p.x=z.start;p.y=380;p.spawnX=z.start;p.spawnY=380;p.dx=p.dy=0;p.ground=false;p.coyote=0;p.jumpBuffer=0;p.airJumps=1;p.attackCd=p.attackTimer=0;p.inv=70;camera=0;rescued=false;document.getElementById('levelTxt').textContent='Fase '+level;document.getElementById('advice').textContent='“'+z.name+': usa o segundo salto quando a margem apertar.”'}
function start(){state='playing';level=1;p.lives=3;p.score=0;p.energy=100;p.combo=0;build();hud();snd(330,660,.3)}function next(){if(level<4){level++;build();hud();snd(420,860,.35)}else{state='won';snd(350,900,.6)}}
function hud(){document.getElementById('score').textContent=p.score;document.getElementById('lives').textContent='♥'.repeat(Math.max(0,p.lives))||'—';document.getElementById('shieldTxt').textContent=Math.round(p.energy)+'%';document.getElementById('shieldBar').style.width=p.energy+'%';document.getElementById('combo').textContent=p.combo;document.getElementById('carla').textContent=rescued?'RESGATADA':'À espera'}
function part(x,y,color,n=10){for(let i=0;i<n;i++)particles.push({x,y,dx:(Math.random()-.5)*7,dy:(Math.random()-.5)*7-1,r:1+Math.random()*3,color,life:35,max:35})}function msg(x,y,t,color='#facc15'){texts.push({x,y,t,color,life:55})}
function jump(){if(state!=='playing')return;if(p.ground||p.coyote>0){p.dy=p.jump;p.ground=false;p.coyote=0;p.airJumps=1;snd(240,600,.15);part(p.x+15,p.y+44,'#38bdf8',9)}else if(p.airJumps>0){p.dy=p.jump*.88;p.airJumps--;snd(360,780,.16);part(p.x+15,p.y+44,'#8b5cf6',10)}}
function attack(){if(state!=='playing'||p.attackCd>0)return;p.attackTimer=10;p.attackCd=20;const ax=p.facing>0?p.x+p.w:p.x-58,ay=p.y+5,aw=58;let hit=false;p.combo=Math.min(99,p.combo+1);for(const e of enemies){if(!e.alive)continue;if(ax<e.x+e.w&&ax+aw>e.x&&ay<e.y+e.h&&ay+34>e.y){e.hp--;hit=true;part(e.x+e.w/2,e.y+e.h/2,e.type==='boss'?'#f43f5e':'#ef4444',14);msg(e.x,e.y-10,'⚔️ HIT!','#fca5a5');p.score+=e.type==='boss'?250:120;if(e.hp<=0){e.alive=false;p.score+=e.type==='boss'?1200:180}}}snd(hit?180:260,hit?720:360,hit?.18:.06,hit?'square':'sine',hit?.1:.04)}
function hurt(){if(p.inv>0)return;p.lives--;p.combo=0;flash=18;p.inv=80;shake=12;snd(120,30,.3,'sawtooth',.13);if(p.lives<=0){state='gameover';return}p.x=p.spawnX;p.y=p.spawnY;p.dx=p.dy=0}
function shieldOn(){return keys.shield&&p.energy>5}
function update(){if(state!=='playing')return;tick++;if(shake)shake--;if(flash)flash--;if(p.inv)p.inv--;if(p.attackCd)p.attackCd--;if(p.attackTimer)p.attackTimer--;if(shieldOn())p.energy=Math.max(0,p.energy-1.1);else p.energy=Math.min(100,p.energy+.45);
if(keys.left){p.dx=-p.speed;p.facing=-1}else if(keys.right){p.dx=p.speed;p.facing=1}else p.dx*=.82;
if(keys.up)p.jumpBuffer=Math.max(p.jumpBuffer,6);else if(p.jumpBuffer>0)p.jumpBuffer--;if(p.jumpBuffer>0&&(p.ground||p.coyote>0||p.airJumps>0)){jump();p.jumpBuffer=0}
p.x+=p.dx;p.x=Math.max(0,Math.min(worldW-p.w,p.x));p.dy+=p.g;p.y+=p.dy;p.ground=false;
for(const q of platforms){if(p.x<q.x+q.w&&p.x+p.w>q.x&&p.y+p.h>q.y&&p.y+p.h-p.dy<=q.y&&p.dy>=0){p.y=q.y-p.h;p.dy=0;p.ground=true;p.airJumps=1}}
if(p.ground)p.coyote=7;else p.coyote=Math.max(0,p.coyote-1);camera=Math.max(0,Math.min(worldW-cv.width,p.x-cv.width*.42));
for(const c of checkpoints)if(!c.on&&p.x<c.x+c.w&&p.x+p.w>c.x&&p.y<c.y+c.h&&p.y+p.h>c.y){c.on=true;p.spawnX=c.x;p.spawnY=c.y+3;p.score+=100;msg(c.x,c.y-20,'CHECKPOINT!','#facc15');part(c.x+12,c.y,'#facc15',18);snd(520,850,.25)}
if(!rescued&&Math.abs(p.x-L[level].carla)<65){rescued=true;p.score+=1500;part(L[level].carla,365,'#ec4899',24);msg(L[level].carla-30,320,'CARLA RESGATADA! +1500','#ec4899');snd(440,900,.5)}
for(const e of enemies){if(!e.alive)continue;e.x+=e.s*e.dir;if(e.x>e.max||e.x<e.min)e.dir*=-1;e.timer++;if((e.type==='shooter'||e.type==='boss')&&e.timer>90){e.timer=0;shots.push({x:e.x+e.w/2,y:e.y+e.h/2,dx:(p.x<e.x?-1:1)*(e.type==='boss'?4.5:5),r:e.type==='boss'?8:5,ang:0})}if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){if(p.dy>2&&p.y+p.h-p.dy<=e.y+12&&e.type!=='boss'){e.alive=false;p.dy=-8;p.score+=250;p.combo++;part(e.x+16,e.y,'#ef4444',16)}else if(e.type==='boss'){hurt()}else hurt()}}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.dx;s.ang+=.3;const b={x:p.facing>0?p.x+p.w:p.x-24,y:p.y+2,w:24,h:40};if(shieldOn()&&b.x<s.x+s.r&&b.x+b.w>s.x-s.r&&b.y<s.y+s.r&&b.y+b.h>s.y-s.r){shots.splice(i,1);p.score+=60;msg(s.x,s.y,'BLOQUEADO!','#38bdf8');part(s.x,s.y,'#38bdf8',9);snd(550,1000,.12);continue}if(p.x<s.x+s.r&&p.x+p.w>s.x-s.r&&p.y<s.y+s.r&&p.y+p.h>s.y-s.r){shots.splice(i,1);hurt();continue}if(s.x<camera-100||s.x>camera+1050)shots.splice(i,1)}
for(const c of coins)if(!c.collected&&Math.abs(p.x-c.x)<28&&Math.abs(p.y-c.y)<35){c.collected=true;p.score+=100;part(c.x,c.y,'#facc15',10);msg(c.x,c.y-15,'+100');snd(650,1000,.15,'triangle',.09)}
if(p.y>620)hurt();if(p.x<goal.x+goal.w&&p.x+p.w>goal.x&&p.y<goal.y+goal.h&&p.y+p.h>goal.y){if(rescued)next();else msg(goal.x-100,295,'RESGATE CARLA PRIMEIRO!','#ec4899')}
for(const f of fireflies){f.x+=f.s;if(f.x<0)f.x=worldW;if(f.x>worldW)f.x=0;f.a+=f.d;if(f.a>1||f.a<.1)f.d*=-1}for(let i=particles.length-1;i>=0;i--){const a=particles[i];a.x+=a.dx;a.y+=a.dy;a.dy+=.05;a.life--;if(a.life<=0)particles.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].y-=.7;texts[i].life--;if(texts[i].life<=0)texts.splice(i,1)}hud()}
function draw(){ctx.save();if(shake)ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*7);const g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,level===3?'#16060a':'#010409');g.addColorStop(.6,level===3?'#321018':'#071826');g.addColorStop(1,'#0e293f');ctx.fillStyle=g;ctx.fillRect(0,0,950,540);ctx.save();const mx=790-camera*.08;ctx.fillStyle='#fef08a';ctx.shadowColor='#fde68a';ctx.shadowBlur=28;ctx.beginPath();ctx.arc(mx,82,31,0,Math.PI*2);ctx.fill();ctx.restore();for(let layer=0;layer<3;layer++){ctx.fillStyle=layer===0?'#040d16':layer===1?'#091c2b':'#0f2f44';let off=-(camera*(.12+layer*.18))%300;for(let x=-300;x<1250;x+=260){let tx=x+off,ty=285+layer*10;ctx.beginPath();ctx.arc(tx,ty,90-layer*14,0,Math.PI*2);ctx.fill();ctx.fillRect(tx-14,ty,28,270)}}for(const f of fireflies)if(f.x>camera-20&&f.x<camera+970){ctx.save();ctx.globalAlpha=f.a;ctx.fillStyle='#6ee7b7';ctx.shadowColor='#10b981';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(f.x-camera,f.y,f.r,0,Math.PI*2);ctx.fill();ctx.restore()}
ctx.save();ctx.translate(-camera,0);for(const q of platforms){ctx.fillStyle=level===3?'#4a211f':'#113023';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(q.x,q.y+q.h-10,q.w,10);ctx.fillStyle='#34d399';ctx.shadowColor='#10b981';ctx.shadowBlur=8;ctx.fillRect(q.x,q.y,q.w,6);ctx.shadowBlur=0}for(const c of checkpoints){ctx.fillStyle='#713f12';ctx.fillRect(c.x+9,c.y,6,c.h);ctx.fillStyle=c.on?'#facc15':'#64748b';ctx.shadowColor=c.on?'#facc15':'transparent';ctx.shadowBlur=c.on?16:0;ctx.beginPath();ctx.arc(c.x+12,c.y,10,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
for(const c of coins)if(!c.collected){ctx.save();ctx.translate(c.x,c.y+Math.sin(tick*.09+c.x)*5);ctx.rotate(Math.sin(tick*.06)*.35);if(imgs.coin.complete&&imgs.coin.naturalWidth)ctx.drawImage(imgs.coin,-9,-9,18,18);else{ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill()}ctx.restore()}
if(!rescued){const cx=L[level].carla;ctx.save();ctx.shadowColor='#ec4899';ctx.shadowBlur=18;if(imgs.carla.complete&&imgs.carla.naturalWidth)ctx.drawImage(imgs.carla,cx-16,365,32,45);else{ctx.fillStyle='#ec4899';ctx.fillRect(cx,370,25,40)}ctx.fillStyle='#fff';ctx.font='bold 12px Segoe UI';ctx.fillText('CARLA',cx-18,355);ctx.restore()}
for(const e of enemies)if(e.alive){ctx.save();if(imgs.enemy.complete&&imgs.enemy.naturalWidth)ctx.drawImage(imgs.enemy,e.x,e.y,e.w,e.h);else{ctx.fillStyle=e.type==='boss'?'#991b1b':'#7c3aed';ctx.fillRect(e.x,e.y,e.w,e.h)}if(e.type==='boss'){ctx.strokeStyle='#f43f5e';ctx.lineWidth=3;ctx.strokeRect(e.x-4,e.y-4,e.w+8,e.h+8);ctx.fillStyle='#0f172a';ctx.fillRect(e.x,e.y-12,e.w,6);ctx.fillStyle='#ef4444';ctx.fillRect(e.x,e.y-12,e.w*(e.hp/8),6)}ctx.restore()}
for(const s of shots){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.ang);if(imgs.shuriken.complete&&imgs.shuriken.naturalWidth)ctx.drawImage(imgs.shuriken,-8,-8,16,16);else{ctx.fillStyle='#fff';ctx.fillRect(-7,-2,14,4);ctx.fillRect(-2,-7,4,14)}ctx.restore()}
const bob=p.ground&&Math.abs(p.dx)>.5?Math.sin(tick*.35)*2:0;ctx.save();ctx.globalAlpha=p.inv>0&&Math.floor(p.inv/5)%2===0?.45:1;ctx.translate(p.x+p.w/2,p.y+p.h/2+bob);ctx.scale(p.facing,1);if(imgs.ninja.complete&&imgs.ninja.naturalWidth)ctx.drawImage(imgs.ninja,-19,-26,38,52);else{ctx.fillStyle='#111827';ctx.fillRect(-15,-22,30,44)}if(p.attackTimer){ctx.strokeStyle='#e2e8f0';ctx.lineWidth=5;ctx.shadowColor='#f8fafc';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(9,-5);ctx.lineTo(55,-28);ctx.stroke();ctx.strokeStyle='#94a3b8';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(12,-6);ctx.lineTo(26,3);ctx.stroke()}ctx.restore();if(shieldOn()){ctx.save();ctx.strokeStyle='rgba(56,189,248,.9)';ctx.fillStyle='rgba(56,189,248,.16)';ctx.shadowColor='#38bdf8';ctx.shadowBlur=22;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x+p.w/2,p.y+p.h/2,28,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore()}
ctx.fillStyle='#78350f';ctx.fillRect(goal.x+12,goal.y,8,goal.h);ctx.fillStyle='#f43f5e';ctx.shadowColor='#f43f5e';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(goal.x+20,goal.y+10);ctx.lineTo(goal.x+65,goal.y+32);ctx.lineTo(goal.x+20,goal.y+55);ctx.fill();ctx.shadowBlur=0;for(const a of particles){ctx.globalAlpha=a.life/a.max;ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const t of texts){ctx.fillStyle=t.color;ctx.font='bold 15px Segoe UI';ctx.shadowColor=t.color;ctx.shadowBlur=8;ctx.fillText(t.t,t.x,t.y);ctx.shadowBlur=0}ctx.restore();
if(tick<150&&state==='playing'){ctx.fillStyle='rgba(2,6,23,.48)';ctx.fillRect(255,95,440,50);ctx.fillStyle='#fef08a';ctx.textAlign='center';ctx.font='bold 22px Segoe UI';ctx.fillText('FASE '+level+' — '+L[level].name,475,128);ctx.textAlign='left'}if(state==='menu')menu();else if(state==='gameover')over('GAME OVER','Pressione R para tentar novamente');else if(state==='won')over('🏆 MISSÃO CUMPRIDA!','Jhon e Carla venceram a floresta!');ctx.restore()}
function menu(){ctx.fillStyle='rgba(2,6,23,.93)';ctx.fillRect(0,0,950,540);ctx.textAlign='center';ctx.fillStyle='#34d399';ctx.shadowColor='#10b981';ctx.shadowBlur=22;ctx.font='bold 36px Segoe UI';ctx.fillText("JHON'S EPIC FOREST QUEST",475,105);ctx.shadowBlur=0;ctx.fillStyle='#e2e8f0';ctx.font='17px Segoe UI';ctx.fillText('Salve Carla atravessando 4 fases cada vez mais perigosas.',475,140);ctx.fillStyle='#94a3b8';ctx.font='14px Segoe UI';ctx.fillText('Novo: segundo salto + coyote time + jump buffer + combate com espada.',475,165);const bx=[170,400,630,860];for(let i=1;i<=4;i++){ctx.fillStyle=i===1?'#0f766e':'#334155';ctx.strokeStyle=i===1?'#34d399':'#475569';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(bx[i-1]-72,235,144,100,14);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 17px Segoe UI';ctx.fillText('FASE '+i,bx[i-1],270);ctx.fillStyle='#cbd5e1';ctx.font='12px Segoe UI';ctx.fillText(L[i].name,bx[i-1],293);ctx.fillStyle=i===1?'#facc15':'#64748b';ctx.font='bold 11px Segoe UI';ctx.fillText(i===1?'LIBERADA':'DESBLOQUEIA',bx[i-1],316)}ctx.fillStyle='#facc15';ctx.font='bold 19px Segoe UI';ctx.fillText('ENTER — COMEÇAR AVENTURA',475,390);ctx.fillStyle='#38bdf8';ctx.font='14px Segoe UI';ctx.fillText('X/K = ataque • J = escudo • Espaço/W/↑ = pulo',475,425);ctx.textAlign='left'}
function over(a,b){ctx.fillStyle='rgba(0,0,0,.86)';ctx.fillRect(0,0,950,540);ctx.textAlign='center';ctx.fillStyle=a.includes('GAME')?'#ef4444':'#34d399';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=22;ctx.font='bold 34px Segoe UI';ctx.fillText(a,475,235);ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='17px Segoe UI';ctx.fillText(b,475,280);ctx.fillText('Pontuação: '+p.score+' • R para reiniciar',475,312);ctx.textAlign='left'}
async function sensei(){const b=document.getElementById('advice');const arr=[`“Fase ${level}: o salto longo está mais seguro. Guarda o segundo salto para a emergência.”`,`“Usa o escudo contra shurikens e a espada quando o inimigo chegar perto.”`,`“Checkpoint ativado significa liberdade para arriscar. Antes dele, joga com calma.”`,`“Buraco grande? Corrida + primeiro salto + segundo salto no ar. O ninja não precisa tocar no meio do caminho.”`];b.textContent='🥋 Sensei pensando...';await new Promise(r=>setTimeout(r,300));b.textContent=arr[Math.floor(Math.random()*arr.length)]}
function bind(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();keys[key]=true;if(key==='up')jump();if(key==='attack')attack()});el.addEventListener('pointerup',e=>{e.preventDefault();keys[key]=false});el.addEventListener('pointercancel',()=>keys[key]=false);el.addEventListener('pointerleave',()=>keys[key]=false)}bind('left','left');bind('right','right');bind('shield','shield');bind('jump','up');bind('attack','attack');
window.addEventListener('keydown',e=>{audioInit();const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' ','a','d','w','j','x','k'].includes(k))e.preventDefault();if(k==='arrowleft'||k==='a')keys.left=true;if(k==='arrowright'||k==='d')keys.right=true;if(k==='arrowup'||k===' '||k==='w'){keys.up=true;if(state==='playing')jump()}if(k==='j')keys.shield=true;if(k==='x'||k==='k'){keys.attack=true;attack()}if(k==='enter'&&state==='menu')start();if(k==='r'&&(state==='gameover'||state==='won'))start()});window.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=false;if(k==='arrowright'||k==='d')keys.right=false;if(k==='arrowup'||k===' '||k==='w')keys.up=false;if(k==='j')keys.shield=false;if(k==='x'||k==='k')keys.attack=false});
function loop(){update();draw();requestAnimationFrame(loop)}window.onload=()=>{build();state='menu';hud();loop()};
</script></body></html>
