<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhon's Epic Forest Quest — Save Carla</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon:#34d399; --sky:#38bdf8; --danger:#f43f5e; --gold:#facc15; }
        * { box-sizing: border-box; }
        body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#07111d,#02040a 55%);font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;color:#fff;overflow-x:hidden;touch-action:none}
        .game-wrapper{width:min(1180px,100%);margin:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
        .game-container{position:relative;width:100%;overflow:hidden;border:1px solid rgba(52,211,153,.35);border-radius:18px;background:#020617;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 45px rgba(16,185,129,.12)}
        canvas{display:block;width:100%;height:auto;image-rendering:auto}
        .hud{position:absolute;left:14px;right:14px;top:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
        .hud-card{background:rgba(2,6,23,.78);backdrop-filter:blur(8px);border:1px solid rgba(148,163,184,.2);border-radius:12px;padding:10px 12px;min-width:230px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
        .bar{height:9px;background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
        .bar>i{display:block;height:100%;width:0;border-radius:99px;transition:width .15s ease}
        .touch-controls{display:none;position:absolute;left:0;right:0;bottom:14px;justify-content:space-between;padding:0 18px;z-index:10}
        .touch-group{display:flex;gap:10px}
        .touch-btn{width:62px;height:62px;border-radius:18px;background:rgba(15,23,42,.78);border:2px solid rgba(52,211,153,.75);display:flex;align-items:center;justify-content:center;font-size:22px;user-select:none;backdrop-filter:blur(8px);box-shadow:0 10px 25px rgba(0,0,0,.45)}
        .touch-btn:active{transform:scale(.94);background:rgba(52,211,153,.35)}
        .ai-panel{background:rgba(15,23,42,.9);border:1px solid rgba(56,189,248,.24);border-radius:14px;padding:12px 15px;backdrop-filter:blur(10px);box-shadow:0 14px 32px rgba(0,0,0,.35)}
        .ai-row{display:flex;justify-content:space-between;gap:12px;align-items:center}
        #askAiBtn{white-space:nowrap}
        .mini-note{font-size:12px;color:#94a3b8;margin-top:4px}
        .footer{font-size:12px;color:#64748b;text-align:center}
        @media(max-width:900px){.touch-controls{display:flex}.hud{flex-direction:column}.hud-card{min-width:0;width:max-content}.hud-right{align-self:flex-end}.ai-row{align-items:flex-start;flex-direction:column}.mini-note{padding-right:4px}}
    </style>
</head>
<body>
<div class="game-wrapper">
  <div class="game-container" id="gameContainer">
    <canvas id="gameCanvas" width="950" height="540"></canvas>
    <div class="hud">
      <div class="hud-card">
        <div class="text-sm font-bold tracking-wide">🥷 JHON <span id="livesText">♥♥♥</span></div>
        <div class="text-xs text-slate-300 mt-1">Pontos <b id="scoreText">0</b> · Carla <b id="carlaText">À espera</b></div>
      </div>
      <div class="hud-card hud-right">
        <div class="text-xs text-sky-300 font-bold mb-1">ESCUDO <span id="shieldText">100%</span></div>
        <div class="bar" style="width:190px"><i id="shieldBar" style="background:#38bdf8;width:100%"></i></div>
      </div>
    </div>
    <div class="touch-controls">
      <div class="touch-group"><div class="touch-btn" id="btnLeft">◀</div><div class="touch-btn" id="btnRight">▶</div></div>
      <div class="touch-group"><div class="touch-btn" id="btnShield" style="border-color:#38bdf8">🛡️</div><div class="touch-btn" id="btnJump" style="border-color:#f87171">▲</div></div>
    </div>
  </div>
  <div class="ai-panel">
    <div class="ai-row">
      <div><div class="font-bold text-sky-400 text-sm">🥋 MOTO-SENSEI</div><div id="aiAdviceText" class="text-slate-300 text-sm italic mt-1">“A floresta testa os rápidos, mas recompensa os atentos.”</div></div>
      <button id="askAiBtn" onclick="consultSensei()" class="bg-sky-600 hover:bg-sky-500 text-white font-bold px-3 py-2 rounded-lg text-xs transition shadow-md border border-sky-400">Pedir conselho ✨</button>
    </div>
    <div class="mini-note">Mover: ← → / A D · Pular: ↑ / W / Espaço · Escudo: J · Reiniciar: R</div>
  </div>
  <div class="footer">Gráficos próprios em <code>imagens/</code> · Ninja Forest Run</div>
</div>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const img={
  bg:new Image(), ninja:new Image(), enemy:new Image(), carla:new Image(), coin:new Image(), shuriken:new Image()
};
img.bg.src='imagens/floresta.svg';img.ninja.src='imagens/ninja.svg';img.enemy.src='imagens/inimigo.svg';img.carla.src='imagens/carla.svg';img.coin.src='imagens/moeda.svg';img.shuriken.src='imagens/shuriken.svg';
let audioCtx=null;function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f1,f2,d=.12,type='sine',vol=.08){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),n=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(f1,n);o.frequency.linearRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(vol,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(n+d)}catch(e){}}
function playSound(t){if(t==='jump')tone(240,580,.15,'sine',.1);else if(t==='coin')tone(680,980,.18,'triangle',.12);else if(t==='hit')tone(160,30,.3,'sawtooth',.13);else if(t==='shield')tone(500,950,.12,'sine',.09);else if(t==='checkpoint')tone(550,820,.25,'sine',.1);else if(t==='win'){tone(350,700,.45,'sine',.15);setTimeout(()=>tone(520,900,.45,'sine',.12),110)}}
const keys={left:false,right:false,up:false,shield:false};let gameState='menu',cameraX=0,flashTimer=0,shakeTimer=0,shakeIntensity=0;
const player={name:'Jhon',x:60,y:380,width:30,height:42,speed:5.4,dx:0,dy:0,gravity:.52,jumpPower:-12,grounded:false,lives:3,score:0,facing:'right',shieldEnergy:100,spawnX:60,spawnY:380};
const carla={x:6100,y:398,width:26,height:38,rescued:false};
let platforms=[],coins=[],enemies=[],shurikens=[],checkpoints=[],particles=[],floatingTexts=[],worldWidth=12200,goal={x:11850,y:310,width:40,height:90};
let fireflies=Array.from({length:90},()=>({x:Math.random()*worldWidth,y:50+Math.random()*400,size:Math.random()*2.4+1,alpha:.2+Math.random()*.8,delta:Math.random()>.5?.012:-.012}));
function triggerShake(d,i){shakeTimer=d;shakeIntensity=i}
function addParticles(x,y,color='#34d399',count=8){for(let i=0;i<count;i++)particles.push({x,y,dx:(Math.random()-.5)*6,dy:(Math.random()-.5)*6-1.2,r:Math.random()*3+1,color,life:38,max:38})}
function addFloatingText(x,y,text,color='#facc15'){floatingTexts.push({x,y,text,color,life:55})}
function loadLevel(){
 cameraX=0;particles=[];floatingTexts=[];shurikens=[];player.x=60;player.y=380;player.spawnX=60;player.spawnY=380;player.dx=player.dy=0;carla.rescued=false;
 platforms=[
  {x:0,y:440,w:750,h:100,t:'static'},{x:820,y:370,w:140,h:22,t:'static'},{x:1040,y:290,w:150,h:22,t:'static'},
  {x:1280,y:440,w:600,h:100,t:'static'},{x:1460,y:220,w:120,h:22,t:'moving',min:1380,max:1650,dir:1,s:1.8},{x:1750,y:350,w:160,h:22,t:'static'},
  {x:2000,y:440,w:500,h:100,t:'static'},{x:2180,y:250,w:130,h:22,t:'moving',min:2080,max:2380,dir:-1,s:2.2},{x:2600,y:440,w:700,h:100,t:'static'},
  {x:2800,y:330,w:130,h:22,t:'static'},{x:3400,y:440,w:450,h:100,t:'static'},{x:3600,y:270,w:120,h:22,t:'static'},
  {x:3850,y:180,w:130,h:22,t:'moving',min:3780,max:4100,dir:1,s:2.5},{x:4200,y:440,w:600,h:100,t:'static'},{x:4400,y:310,w:140,h:22,t:'static'},
  {x:4700,y:220,w:120,h:22,t:'static'},{x:5050,y:440,w:550,h:100,t:'static'},{x:5280,y:290,w:130,h:22,t:'moving',min:5180,max:5500,dir:-1,s:2},
  {x:5700,y:440,w:800,h:100,t:'static'},{x:6700,y:440,w:400,h:100,t:'static'},{x:6950,y:280,w:120,h:22,t:'static'},
  {x:7250,y:170,w:130,h:22,t:'moving',min:7150,max:7500,dir:1,s:2.8},{x:7650,y:440,w:500,h:100,t:'static'},{x:7900,y:310,w:140,h:22,t:'static'},
  {x:8200,y:210,w:130,h:22,t:'static'},{x:8600,y:440,w:600,h:100,t:'static'},{x:8850,y:290,w:130,h:22,t:'moving',min:8750,max:9100,dir:-1,s:2.4},
  {x:9400,y:440,w:450,h:100,t:'static'},{x:9650,y:300,w:130,h:22,t:'static'},{x:9950,y:190,w:140,h:22,t:'moving',min:9850,max:10250,dir:1,s:3},
  {x:10400,y:440,w:500,h:100,t:'static'},{x:10680,y:320,w:130,h:22,t:'static'},{x:11000,y:220,w:130,h:22,t:'static'},{x:11400,y:400,w:800,h:140,t:'static'}
 ];
 checkpoints=[{x:3450,y:400,w:25,h:40,active:false,id:1},{x:6750,y:400,w:25,h:40,active:false,id:2},{x:9450,y:400,w:25,h:40,active:false,id:3}];
 coins=[];for(let x=600;x<=11600;x+=230){const y=175+Math.sin(x*.011)*80;coins.push({x:x+Math.random()*70-35,y,baseY:y,collected:false})}
 enemies=[650,1350,2100,2900,3750,4500,5400,6050,7100,7950,8800,9650,10600,11200].map((x,i)=>({x,y:416,w:30,h:30,min:x-80,max:x+90,s:1.5+(i%4)*.35,dir:1,type:i%2?'shooter':'patrol',timer:0}));
 goal={x:11850,y:310,width:45,height:90};
}
function initGame(){player.lives=3;player.score=0;player.shieldEnergy=100;gameState='playing';loadLevel();document.getElementById('aiAdviceText').textContent='“Avance com calma. O primeiro obstáculo é apenas um aviso do que virá.”';updateHud()}
function tryJump(){if(player.grounded){player.dy=player.jumpPower;player.grounded=false;playSound('jump');addParticles(player.x+player.width/2,player.y+player.height,'#38bdf8',10)}}
function resetPlayer(){player.x=player.spawnX;player.y=player.spawnY;player.dx=player.dy=0;flashTimer=30;triggerShake(14,6);playSound('hit')}
function updateHud(){document.getElementById('scoreText').textContent=player.score;document.getElementById('livesText').textContent='♥'.repeat(Math.max(0,player.lives))||'—';document.getElementById('carlaText').textContent=carla.rescued?'RESGATADA':'À espera';document.getElementById('shieldText').textContent=Math.round(player.shieldEnergy)+'%';document.getElementById('shieldBar').style.width=player.shieldEnergy+'%'}
async function consultSensei(){const box=document.getElementById('aiAdviceText'),btn=document.getElementById('askAiBtn');btn.disabled=true;box.textContent='🥋 O Sensei está meditando…';await new Promise(r=>setTimeout(r,450));const tips=[`“Jhon, tens ${player.lives} vidas: guarda o escudo para os shurikens e salta sobre os inimigos.”`,`“Pontuação é vaidade; chegar até Carla é o verdadeiro objetivo. Usa os checkpoints com sabedoria.”`,`“Quando o terreno parecer impossível, procura o caminho alto. O ninja vence pela posição.”`];box.textContent=tips[Math.floor(Math.random()*tips.length)];btn.disabled=false}
window.addEventListener('keydown',e=>{initAudio();const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(k))e.preventDefault();if(k==='ArrowLeft'||k.toLowerCase()==='a')keys.left=true;if(k==='ArrowRight'||k.toLowerCase()==='d')keys.right=true;if(k==='ArrowUp'||k===' '||k.toLowerCase()==='w'){if(!keys.up)tryJump();keys.up=true}if(k.toLowerCase()==='j')keys.shield=true;if(k.toLowerCase()==='r'&&gameState!=='playing')initGame();if(k==='Enter'&&gameState==='menu')initGame()});
window.addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k.toLowerCase()==='a')keys.left=false;if(k==='ArrowRight'||k.toLowerCase()==='d')keys.right=false;if(k==='ArrowUp'||k===' '||k.toLowerCase()==='w')keys.up=false;if(k.toLowerCase()==='j')keys.shield=false});
function bindTouch(id,name){const el=document.getElementById(id);if(!el)return;el.addEventListener('touchstart',e=>{e.preventDefault();initAudio();if(name==='up')tryJump();keys[name]=true},{passive:false});['touchend','touchcancel'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[name]=false},{passive:false}))}
bindTouch('btnLeft','left');bindTouch('btnRight','right');bindTouch('btnJump','up');bindTouch('btnShield','shield');
function update(){if(gameState!=='playing')return;if(shakeTimer>0)shakeTimer--;if(flashTimer>0)flashTimer--;const activeShield=keys.shield&&player.shieldEnergy>8;player.shieldEnergy=activeShield?Math.max(0,player.shieldEnergy-1.35):Math.min(100,player.shieldEnergy+.6);
 if(keys.right){player.dx=player.speed;player.facing='right'}else if(keys.left){player.dx=-player.speed;player.facing='left'}else player.dx=0;player.x=Math.max(0,Math.min(worldWidth-player.width,player.x+player.dx));player.dy+=player.gravity;player.y+=player.dy;player.grounded=false;
 platforms.forEach(p=>{if(p.t==='moving'){p.x+=p.s*p.dir;if(p.x>p.max||p.x<p.min)p.dir*=-1}if(player.x<p.x+p.w&&player.x+player.width>p.x&&player.y+player.height>p.y&&player.y+player.height-player.dy<=p.y){if(p.t==='moving')player.x+=p.s*p.dir;player.y=p.y-player.height;player.dy=0;player.grounded=true}});
 cameraX=Math.max(0,Math.min(worldWidth-canvas.width,player.x-canvas.width*.42));
 checkpoints.forEach(cp=>{if(!cp.active&&player.x<cp.x+cp.w&&player.x+player.width>cp.x&&player.y<cp.y+cp.h&&player.y+player.height>cp.y){cp.active=true;player.spawnX=cp.x;player.spawnY=cp.y+cp.h-player.height;player.score+=250;playSound('checkpoint');addParticles(cp.x,cp.y,'#facc15',15);addFloatingText(cp.x-15,cp.y-15,'CHECKPOINT +250','#facc15')}});
 if(!carla.rescued&&player.x<carla.x+carla.width+14&&player.x+player.width>carla.x-14&&player.y<carla.y+carla.height&&player.y+player.height>carla.y){carla.rescued=true;player.score+=1500;playSound('win');addParticles(carla.x,carla.y,'#ec4899',24);addFloatingText(carla.x-35,carla.y-25,'CARLA RESGATADA! +1500','#ec4899')}
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.x+=e.s*e.dir;if(e.x>e.max||e.x<e.min)e.dir*=-1;if(e.type==='shooter'){e.timer++;if(e.timer>82){e.timer=0;shurikens.push({x:e.x+e.w/2,y:e.y+12,dx:e.dir*4.9,r:6,a:0})}}if(player.x<e.x+e.w&&player.x+player.width>e.x&&player.y<e.y+e.h&&player.y+player.height>e.y){if(player.dy>0&&player.y+player.height-player.dy<=e.y+10){enemies.splice(i,1);player.dy=-9.4;player.score+=300;playSound('coin');addParticles(e.x,e.y,'#ef4444',12);addFloatingText(e.x,e.y-10,'+300','#ef4444')}else if(flashTimer===0){player.lives--;if(player.lives<=0)gameState='gameover';else resetPlayer()}}}
 for(let i=shurikens.length-1;i>=0;i--){const s=shurikens[i];s.x+=s.dx;s.a+=.28;const sx=player.facing==='right'?player.x+player.width:player.x-22;if(keys.shield&&player.shieldEnergy>8&&sx<s.x+s.r&&sx+22>s.x-s.r&&player.y<s.y+s.r&&player.y+player.height>s.y-s.r){shurikens.splice(i,1);player.score+=80;playSound('shield');addParticles(s.x,s.y,'#38bdf8',8);continue}if(player.x<s.x+s.r&&player.x+player.width>s.x-s.r&&player.y<s.y+s.r&&player.y+player.height>s.y-s.r&&flashTimer===0){shurikens.splice(i,1);player.lives--;if(player.lives<=0)gameState='gameover';else resetPlayer()}else if(s.x<cameraX-120||s.x>cameraX+canvas.width+120)shurikens.splice(i,1)}
 const tt=Date.now()*.006;coins.forEach(c=>{c.y=c.baseY+Math.sin(tt+c.x)*6;if(!c.collected&&player.x<c.x+16&&player.x+player.width>c.x-16&&player.y<c.y+16&&player.y+player.height>c.y-16){c.collected=true;player.score+=150;playSound('coin');addParticles(c.x,c.y,'#facc15',10);addFloatingText(c.x,c.y-12,'+150','#facc15')}});
 if(player.y>canvas.height+50){player.lives--;if(player.lives<=0)gameState='gameover';else resetPlayer()}
 if(player.x<goal.x+goal.width&&player.x+player.width>goal.x&&player.y<goal.y+goal.height&&player.y+player.height>goal.y){player.score+=3000;gameState='won';playSound('win')}
 particles.forEach((p,i)=>{p.x+=p.dx;p.y+=p.dy;p.life--;if(p.life<=0)particles.splice(i,1)});floatingTexts.forEach((t,i)=>{t.y-=1.1;t.life--;if(t.life<=0)floatingTexts.splice(i,1)});fireflies.forEach(f=>{f.alpha+=f.delta;if(f.alpha>1||f.alpha<.15)f.delta*=-1});updateHud()}
function draw(){ctx.save();if(shakeTimer>0)ctx.translate((Math.random()-.5)*shakeIntensity,(Math.random()-.5)*shakeIntensity);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img.bg,0,0,canvas.width,canvas.height);
 // subtle parallax silhouettes
 ctx.fillStyle='rgba(2,6,23,.26)';for(let i=-1;i<6;i++){const x=((i*210-cameraX*.15)%1100)-100;ctx.beginPath();ctx.arc(x,280,115,0,Math.PI*2);ctx.fill();ctx.fillRect(x-10,265,20,280)}
 fireflies.forEach(f=>{if(f.x>cameraX-30&&f.x<cameraX+canvas.width+30){ctx.save();ctx.globalAlpha=f.alpha;ctx.fillStyle='#6ee7b7';ctx.shadowColor='#10b981';ctx.shadowBlur=9;ctx.beginPath();ctx.arc(f.x-cameraX,f.y,f.size,0,Math.PI*2);ctx.fill();ctx.restore()}});
 ctx.save();ctx.translate(-cameraX,0);
 platforms.forEach(p=>{ctx.fillStyle=p.t==='moving'?'#17402c':'#123526';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#34d399';ctx.shadowColor='#10b981';ctx.shadowBlur=10;ctx.fillRect(p.x,p.y,p.w,6);ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(p.x,p.y+p.h-8,p.w,8)});
 checkpoints.forEach(c=>{ctx.fillStyle=c.active?'#facc15':'#64748b';ctx.fillRect(c.x+9,c.y,7,c.h);ctx.beginPath();ctx.arc(c.x+12,c.y,10,0,Math.PI*2);ctx.fill()});
 if(!carla.rescued)ctx.drawImage(img.carla,carla.x-10,carla.y-15,48,48);
 coins.forEach(c=>{if(!c.collected)ctx.drawImage(img.coin,c.x-13,c.y-13,26,26)});
 enemies.forEach(e=>ctx.drawImage(img.enemy,e.x-4,e.y-10,38,38));
 shurikens.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);ctx.drawImage(img.shuriken,-11,-11,22,22);ctx.restore()});
 ctx.fillStyle='#78350f';ctx.fillRect(goal.x+16,goal.y,8,goal.height);ctx.fillStyle='#f43f5e';ctx.shadowColor='#f43f5e';ctx.shadowBlur=16;ctx.beginPath();ctx.moveTo(goal.x+24,goal.y+10);ctx.lineTo(goal.x+70,goal.y+35);ctx.lineTo(goal.x+24,goal.y+60);ctx.fill();ctx.shadowBlur=0;
 if(flashTimer%4<2)ctx.drawImage(img.ninja,player.x-10,player.y-10,50,58);
 if(keys.shield&&player.shieldEnergy>8){ctx.save();ctx.strokeStyle='#38bdf8';ctx.fillStyle='rgba(56,189,248,.23)';ctx.lineWidth=3;ctx.shadowColor='#38bdf8';ctx.shadowBlur=16;const sx=player.facing==='right'?player.x+player.width:player.x-22;ctx.fillRect(sx,player.y+4,22,34);ctx.strokeRect(sx,player.y+4,22,34);ctx.restore()}
 particles.forEach(p=>{ctx.save();ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore()});
 floatingTexts.forEach(t=>{ctx.save();ctx.font='bold 15px Segoe UI';ctx.fillStyle=t.color;ctx.shadowColor=t.color;ctx.shadowBlur=8;ctx.fillText(t.text,t.x,t.y);ctx.restore()});ctx.restore();
 if(gameState==='menu')overlay('JHON’S EPIC FOREST QUEST','Salve Carla, sobreviva à floresta e alcance a bandeira.','ENTER para começar','#34d399');
 if(gameState==='gameover')overlay('FIM DE JOGO',`Pontuação: ${player.score} · R para tentar novamente`,'R para recomeçar','#ef4444');
 if(gameState==='won')overlay('MISSÃO CUMPRIDA!',`Jhon e Carla venceram! Pontuação: ${player.score}`,'R para jogar de novo','#34d399');
 ctx.restore()}
