<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jhon's Epic Forest Quest v2</title><style>:root{--g:#34d399;--b:#38bdf8;--r:#f43f5e;--y:#facc15;--p:#ec4899}*{box-sizing:border-box}html,body{margin:0;background:#02040a;color:#fff;font-family:Segoe UI,Tahoma,sans-serif}body{display:flex;justify-content:center;touch-action:none}.wrap{width:min(1180px,100%);padding:12px}.game{position:relative;overflow:hidden;border:1px solid #34d39966;border-radius:18px;background:#020617;box-shadow:0 28px 80px #000b}canvas{display:block;width:100%;height:auto}.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.card{background:#020617d9;border:1px solid #94a3b82e;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px);min-width:250px}.bar{width:180px;height:9px;background:#0f172a;border:1px solid #fff2;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.ai{margin-top:12px;background:#0f172af2;border:1px solid #38bdf83f;border-radius:14px;padding:12px 15px}.airow{display:flex;justify-content:space-between;align-items:center;gap:12px}.touch{display:none;position:absolute;left:0;right:0;bottom:12px;justify-content:space-between;padding:0 14px}.tg{display:flex;gap:9px}.tb{width:60px;height:60px;border-radius:18px;background:#0f172acc;border:2px solid #34d399c0;display:flex;align-items:center;justify-content:center;font-size:22px;user-select:none}@media(max-width:900px){.touch{display:flex}.hud{flex-direction:column}.card{min-width:0;width:max-content}.hud .card:nth-child(2){align-self:flex-end}.airow{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="game"><canvas id="c" width="950" height="540"></canvas><div class="hud"><div class="card"><b>🥷 JHON <span id="lives">♥♥♥</span> <span id="phase">Fase 1</span></b><div style="font-size:12px;margin-top:4px">Pontos <b id="score">0</b> · 💗 Carla <b id="carla">À espera</b></div><div style="font-size:12px;margin-top:4px;color:#facc15">🪙 <b id="coins">0</b> · ⚔️ Combo <b id="combo">0</b></div></div><div class="card"><b style="color:#38bdf8;font-size:12px">ESCUDO <span id="shieldTxt">100%</span></b><div class="bar"><i id="shieldBar" style="width:100%"></i></div><div style="font-size:12px;color:#94a3b8;margin-top:4px">← → / A D · ↑ / W / Espaço · X/K atacar · J escudo</div></div></div><div class="touch"><div class="tg"><div class="tb" id="left">◀</div><div class="tb" id="right">▶</div></div><div class="tg"><div class="tb" id="shield">🛡️</div><div class="tb" id="jump">▲</div><div class="tb" id="attack">⚔️</div></div></div></div><div class="ai"><div class="airow"><div><b style="color:#38bdf8">🥋 MOTO-SENSEI</b><div id="advice" style="margin-top:5px;color:#cbd5e1;font-size:14px;font-style:italic">“O portal no fim da fase abre a próxima aventura.”</div></div><button id="ask" onclick="sensei()" style="background:#0284c7;color:#fff;border:1px solid #38bdf8;border-radius:8px;padding:8px 11px;font-weight:700">Pedir conselho ✨</button></div><div style="font-size:12px;color:#64748b;margin-top:8px">As plataformas azuis são apoios de segurança. Carla dá bônus, mas NÃO bloqueia a passagem.</div></div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),I={n:new Image(),e:new Image(),ca:new Image(),co:new Image(),s:new Image()};I.n.src='imagens/ninja.svg';I.e.src='imagens/inimigo.svg';I.ca.src='imagens/carla.svg';I.co.src='imagens/moeda.svg';I.s.src='imagens/shuriken.svg';
const K={l:0,r:0,u:0,j:0,a:0},P={x:55,y:390,w:30,h:44,dx:0,dy:0,g:.46,v:-12.6,sp:5.6,ground:0,air:1,coyote:0,buffer:0,life:3,score:0,energy:100,face:1,spawnX:55,spawnY:390,inv:70,atk:0,cd:0,combo:0,comboT:0};
let state='menu',phase=1,camera=0,world=4200,plats=[],coins=[],enemies=[],shots=[],cp=[],parts=[],texts=[],goal=null,rescued=false,nextBusy=false,t=0;
const F=[null,{name:'Floresta Sombria',w:4200,goal:4010,carla:3430,cp:[1235,2175,3295],p:[[0,440,620],[665,390,170],[855,335,170],[1045,395,170],[1235,440,520],[1795,370,170],[1985,315,170],[2175,440,500],[2725,370,170],[2915,315,170],[3105,390,170],[3295,440,820]],e:[520,1360,2350,3160]},
{name:'Ruínas da Lua',w:4500,goal:4310,carla:3650,cp:[1005,2120,3235],p:[[0,440,560],[605,390,175],[805,335,175],[1005,440,470],[1520,375,175],[1720,315,175],[1920,255,175],[2120,440,470],[2635,375,175],[2835,315,175],[3035,255,175],[3235,440,480],[3750,370,175],[3950,310,175],[4150,400,350]],e:[450,1170,2230,2710,3370,4110]},
{name:'Floresta do Fogo',w:4800,goal:4610,carla:3850,cp:[995,2125,3285],p:[[0,440,540],[585,390,180],[790,330,180],[995,440,470],[1510,375,180],[1715,315,180],[1920,255,180],[2125,440,500],[2670,375,180],[2875,315,180],[3080,255,180],[3285,440,500],[3830,370,180],[4035,310,180],[4240,440,560]],e:[420,1170,2280,2780,3450,3960,4320]},
{name:'Santuário Final',w:5100,goal:4910,carla:4020,cp:[1265,2405,3580],p:[[0,440,590],[635,390,185],[845,330,185],[1055,270,185],[1265,440,470],[1775,375,185],[1985,315,185],[2195,255,185],[2405,440,500],[2950,375,185],[3160,315,185],[3370,255,185],[3580,440,500],[4125,375,185],[4335,315,185],[4545,410,555]],e:[500,1320,2510,3010,3670,4180],boss:1}];
function reset(){const z=F[phase];world=z.w;plats=[];coins=[];enemies=[];shots=[];cp=[];parts=[];texts=[];z.p.forEach((a,i)=>plats.push({x:a[0],y:a[1],w:a[2],h:a[1]===440?100:20,safe:0}));
for(let i=0;i<plats.length-1;i++){let a=plats[i],b=plats[i+1],gap=b.x-(a.x+a.w);if(gap>120){let n=Math.ceil(gap/120)-1;for(let j=0;j<n;j++){let xx=a.x+a.w+(j+1)*gap/(n+1)-38,yy=Math.max(250,Math.min(a.y,b.y)-55);plats.push({x:xx,y:yy,w:76,h:18,safe:1})}}}plats.sort((a,b)=>a.x-b.x);
z.cp.forEach((xx,i)=>cp.push({x:xx,y:390,w:24,h:50,on:0,id:i+1}));z.e.forEach((xx,i)=>enemies.push({x:xx,y:408,w:32,h:32,min:xx-70,max:xx+90,sp:1.3+(i%3)*.35,dir:i%2?1:-1,type:i%2?'shooter':'runner',timer:40,hp:1,alive:1}));if(z.boss)enemies.push({x:4660,y:350,w:82,h:90,min:4480,max:4840,sp:1.05,dir:-1,type:'boss',timer:0,hp:10,alive:1});for(let xx=220;xx<world-100;xx+=175){let yy=175+Math.sin(xx*.014)*65;coins.push({x:xx,y:yy,base:yy,collected:0})}goal={x:z.goal,y:320,w:60,h:115};P.x=55;P.y=390;P.spawnX=55;P.spawnY=390;P.dx=P.dy=0;P.ground=0;P.air=1;P.coyote=0;P.buffer=0;P.atk=0;P.cd=0;P.inv=80;camera=0;rescued=0;nextBusy=0;document.getElementById('phase').textContent='Fase '+phase;document.getElementById('advice').textContent='“'+z.name+': use o segundo salto e as plataformas azuis nos vãos.”';hud()}
function hud(){document.getElementById('lives').textContent='♥'.repeat(Math.max(0,P.life))||'—';document.getElementById('score').textContent=P.score;document.getElementById('shieldTxt').textContent=Math.round(P.energy)+'%';document.getElementById('shieldBar').style.width=P.energy+'%';document.getElementById('coins').textContent=coins.filter(q=>q.collected).length;document.getElementById('combo').textContent=P.combo;document.getElementById('carla').textContent=rescued?'RESGATADA':'À espera'}
function start(){state='play';phase=1;P.life=3;P.score=0;P.energy=100;P.combo=0;reset();beep(330,660,.25)}
function beep(a,b,d){try{if(!audio){audio=new AudioContext()}let o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.frequency.setValueAtTime(a,n);o.frequency.linearRampToValueAtTime(b,n+d);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(n+d)}catch(e){}}
let audio=null;
function jump(){if(state!=='play')return;if(P.ground||P.coyote>0){P.dy=P.v;P.ground=0;P.coyote=0;P.air=1;beep(240,600,.14)}else if(P.air){P.dy=P.v*.92;P.air=0;beep(360,780,.15)}}
function atk(){if(state!=='play'||P.cd)return;P.cd=16;P.atk=10;let ax=P.face>0?P.x+P.w:P.x-60;for(const e of enemies){if(!e.alive)continue;if(ax<e.x+e.w&&ax+60>e.x&&P.y+5<e.y+e.h&&P.y+40>e.y){e.hp--;P.score+=e.type==='boss'?200:120;if(e.hp<=0){e.alive=0;P.score+=e.type==='boss'?1500:200}P.combo++;P.comboT=80}}beep(180,680,.12);hud()}
function hurt(){if(P.inv)return;P.life--;P.combo=0;P.inv=80;if(P.life<=0){state='over';return}P.x=P.spawnX;P.y=P.spawnY;P.dx=P.dy=0;hud()}
function advance(){if(nextBusy)return;nextBusy=1;state='transition';setTimeout(()=>{if(phase<4){phase++;reset();state='play'}else state='win';nextBusy=0},900)}
function update(){if(state!=='play')return;t++;if(P.inv)P.inv--;if(P.cd)P.cd--;if(P.atk)P.atk--;if(P.comboT){P.comboT--;if(!P.comboT)P.combo=0}let shield=K.j&&P.energy>5;P.energy=shield?Math.max(0,P.energy-1.1):Math.min(100,P.energy+.5);if(K.l){P.dx=-P.sp;P.face=-1}else if(K.r){P.dx=P.sp;P.face=1}else P.dx*=.82;if(K.u){P.buffer=6}else if(P.buffer)P.buffer--;if(P.buffer&&(P.ground||P.coyote>0||P.air)){jump();P.buffer=0}
P.x=Math.max(0,Math.min(world-P.w,P.x+P.dx));P.dy+=P.g;P.y+=P.dy;P.ground=0;for(const q of plats){if(P.x<q.x+q.w&&P.x+P.w>q.x&&P.y+P.h>q.y&&P.y+P.h-P.dy<=q.y&&P.dy>=0){P.y=q.y-P.h;P.dy=0;P.ground=1;P.air=1}}if(P.ground)P.coyote=7;else P.coyote=Math.max(0,P.coyote-1);camera=Math.max(0,Math.min(world-c.width,P.x-c.width*.42));
for(const q of cp)if(!q.on&&P.x<q.x+q.w&&P.x+P.w>q.x&&P.y<q.y+q.h&&P.y+P.h>q.y){q.on=1;P.spawnX=q.x;P.spawnY=q.y-4;P.score+=100;hud()}
if(!rescued&&Math.abs(P.x-F[phase].carla)<60&&P.y>330){rescued=1;P.score+=1000;hud()}
for(const e of enemies){if(!e.alive)continue;e.x+=e.sp*e.dir;if(e.x>e.max||e.x<e.min)e.dir*=-1;if((e.type==='shooter'||e.type==='boss')&&++e.timer>90){e.timer=0;shots.push({x:e.x+e.w/2,y:e.y+e.h/2,dx:P.x<e.x?-4.6:4.6,r:5})}if(P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){if(e.type!=='boss'&&P.dy>0&&P.y+P.h-P.dy<=e.y+12){e.alive=0;P.dy=-9.4;P.score+=250}else if(!shield)hurt()}}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.dx;let hit=P.x<s.x+s.r&&P.x+P.w>s.x-s.r&&P.y<s.y+s.r&&P.y+P.h>s.y-s.r;if(hit){shots.splice(i,1);if(!shield)hurt()}else if(s.x<camera-100||s.x>camera+c.width+100)shots.splice(i,1)}
let now=Date.now()*.004;for(const q of coins){q.y=q.base+Math.sin(now+q.x)*6;if(!q.collected&&P.x<q.x+14&&P.x+P.w>q.x-14&&P.y<q.y+14&&P.y+P.h>q.y-14){q.collected=1;P.score+=150;hud()}}if(P.y>c.height+60)hurt();
// PROGRESSÃO CORRIGIDA: basta tocar/chegar ao portal. Carla é bônus.
if(P.x+P.w>=goal.x-10)advance();hud()}
function draw(){ctx.clearRect(0,0,c.width,c.height);let sky=ctx.createLinearGradient(0,0,0,c.height);sky.addColorStop(0,'#010409');sky.addColorStop(1,'#102f48');ctx.fillStyle=sky;ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(c.width-140-camera*.05,90,31,0,Math.PI*2);ctx.fill();ctx.fillStyle='#06131f';for(let i=0;i<8;i++){let xx=(i*180-camera*.15)%1100;ctx.beginPath();ctx.arc(xx,300,110,0,Math.PI*2);ctx.fill();ctx.fillRect(xx-12,300,24,240)}ctx.save();ctx.translate(-camera,0);for(const q of plats){ctx.fillStyle=q.safe?'#123b52':'#12382a';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle=q.safe?'#38bdf8':'#34d399';ctx.shadowColor=q.safe?'#38bdf8':'#10b981';ctx.shadowBlur=10;ctx.fillRect(q.x,q.y,q.w,6);ctx.shadowBlur=0;if(q.safe){ctx.fillStyle='#bae6fd';ctx.font='10px Segoe UI';ctx.fillText('APOIO',q.x+20,q.y-6)}}for(const q of cp){ctx.fillStyle=q.on?'#facc15':'#64748b';ctx.fillRect(q.x+8,q.y,8,q.h)}ctx.fillStyle='#78350f';ctx.fillRect(goal.x+20,goal.y,8,goal.h);ctx.fillStyle='#34d399';ctx.shadowColor='#34d399';ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(goal.x+28,goal.y+10);ctx.lineTo(goal.x+72,goal.y+38);ctx.lineTo(goal.x+28,goal.y+66);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#d1fae5';ctx.font='bold 13px Segoe UI';ctx.fillText(phase<4?'PRÓXIMA FASE':'SAÍDA',goal.x-2,goal.y-10);if(!rescued&&I.ca.complete)ctx.drawImage(I.ca,F[phase].carla-15,360,46,60);for(const q of coins)if(!q.collected&&I.co.complete)ctx.drawImage(I.co,q.x-10,q.y-10,20,20);for(const e of enemies)if(e.alive){if(e.type==='boss'){ctx.fillStyle='#991b1b';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.font='bold 14px Segoe UI';ctx.fillText('BOSS',e.x+18,e.y-8)}else if(I.e.complete)ctx.drawImage(I.e,e.x-3,e.y-3,38,38);else{ctx.fillStyle='#dc2626';ctx.fillRect(e.x,e.y,e.w,e.h)}}for(const s of shots){if(I.s.complete)ctx.drawImage(I.s,s.x-8,s.y-8,16,16);else{ctx.fillStyle='#fff';ctx.fillRect(s.x-6,s.y-2,12,4);ctx.fillRect(s.x-2,s.y-6,4,12)}}ctx.save();if(P.inv%6<3)ctx.globalAlpha=.45;if(I.n.complete)ctx.drawImage(I.n,P.x-5,P.y-4,40,54);else{ctx.fillStyle='#111827';ctx.fillRect(P.x,P.y,P.w,P.h)}if(K.j&&P.energy>5){ctx.fillStyle='#38bdf844';ctx.strokeStyle='#38bdf8';ctx.strokeRect(P.face>0?P.x+P.w:P.x-20,P.y+4,20,34)}if(P.atk){ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(P.face>0?P.x+25:P.x-28,P.y+20,24,P.face>0?-1.2:2.0,P.face>0?.55:3.75);ctx.stroke()}ctx.restore();ctx.restore();if(state==='menu')overlay('JHON’S EPIC FOREST QUEST','Resgate Carla, chegue ao portal e avance pelas 4 fases.','ENTER / toque para começar','#34d399');if(state==='transition')overlay(phase<4?'FASE CONCLUÍDA!':'MISSÃO FINAL!','Carregando a próxima aventura…',phase<4?'PRÓXIMA FASE':'VOCÊ VENCEU','#34d399');if(state==='over')overlay('FIM DE JOGO','Você perdeu todas as vidas.','R para reiniciar','#f43f5e');if(state==='win')overlay('MISSÃO CUMPRIDA!','Jhon e Carla venceram as quatro fases.','R para jogar novamente','#34d399')}
function overlay(a,b,d,col){ctx.fillStyle='#020617eF';ctx.fillRect(0,0,c.width,c.height);ctx.textAlign='center';ctx.fillStyle=col;ctx.font='bold 36px Segoe UI';ctx.fillText(a,c.width/2,220);ctx.fillStyle='#cbd5e1';ctx.font='17px Segoe UI';ctx.fillText(b,c.width/2,260);ctx.fillStyle='#facc15';ctx.font='bold 19px Segoe UI';ctx.fillText(d,c.width/2,305);ctx.textAlign='left'}
function sensei(){const b=document.getElementById('advice');b.textContent=['“Não tente um salto impossível: use o apoio azul.”','“Carla aumenta sua pontuação, mas o portal é o que libera a próxima fase.”','“Guarde o escudo para os shurikens e use o segundo salto nos vãos.”'][Math.floor(Math.random()*3)]}
addEventListener('keydown',e=>{audioInit();let k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup',' '].includes(e.key))e.preventDefault();if(k==='arrowleft'||k==='a')K.l=1;if(k==='arrowright'||k==='d')K.r=1;if(k==='arrowup'||k==='w'||e.key===' '){if(!K.u)jump();K.u=1}if(k==='j')K.j=1;if(k==='x'||k==='k')atk();if(k==='enter'&&state==='menu')start();if(k==='r'&&(state==='over'||state==='win'))start()});addEventListener('keyup',e=>{let k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')K.l=0;if(k==='arrowright'||k==='d')K.r=0;if(k==='arrowup'||k==='w'||e.key===' ')K.u=0;if(k==='j')K.j=0});function bind(id,key,fn){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();if(fn)fn();else K[key]=1});el.addEventListener('pointerup',e=>{e.preventDefault();if(!fn)K[key]=0})}bind('left','l');bind('right','r');bind('shield','j');bind('jump',null,jump);bind('attack',null,atk);c.addEventListener('pointerdown',()=>{if(state==='menu')start()});function loop(){update();draw();requestAnimationFrame(loop)}reset();loop();</script></body></html>
